name: CI/CD - Marts System

on:
  push:
    branches: [master, main]
    paths:
      - 'Marts_System_Merged.html'
      - 'sw.js'
      - 'manifest.json'
      - 'functions/**'
      - 'testsprite_tests/**'
      - '.github/workflows/**'
      - 'firebase.json'
      - '.firebaserc'
  pull_request:
    branches: [master, main]
    paths:
      - 'Marts_System_Merged.html'
      - 'sw.js'
      - 'manifest.json'
      - 'testsprite_tests/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '18'

jobs:
  # ══════════════════════════════════════════════
  # Stage 1: Security Scan (SAST)
  # ══════════════════════════════════════════════
  security:
    name: Security Scan (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Scan for hardcoded secrets
        run: |
          echo "## Security Scan: Hardcoded Secrets" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          FAIL=false

          PATTERNS=(
            'password\s*[=:]\s*["\x27][^"\x27]+'
            'api[_-]?key\s*[=:]\s*["\x27][^"\x27]+'
            'secret\s*[=:]\s*["\x27][^"\x27]+'
            'token\s*[=:]\s*["\x27][A-Za-z0-9_-]{20,}'
            'aws_access_key_id\s*[=:]\s*["\x27][A-Z0-9]+'
            'private[_-]?key\s*[=:]\s*["\x27]'
            'mongodb(\+srv)?://[^\s]+'
            'mysql://[^\s]+'
            'postgres(ql)?://[^\s]+'
            'BEGIN\s+(RSA\s+)?PRIVATE\s+KEY'
          )

          for pat in "${PATTERNS[@]}"; do
            MATCHES=$(grep -inE "$pat" Marts_System_Merged.html sw.js 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "### Potential secret found:" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "$MATCHES" | head -5 >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "Pattern: \`$pat\`" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              FAIL=true
            fi
          done

          if [ "$FAIL" = "true" ]; then
            echo "Status: POTENTIAL SECRETS DETECTED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Review the matches above. If these are false positives, this step will continue." >> $GITHUB_STEP_SUMMARY
          else
            echo "Status: CLEAN - No hardcoded secrets detected" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Scan for XSS vulnerabilities
        run: |
          echo "## Security Scan: XSS Vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ISSUES=0

          XSS_PATTERNS=(
            'document\.write\s*\('
            'innerHTML\s*='
            'eval\s*\('
            'new\s+Function\s*\('
            'setTimeout\s*\(["\x27]'
            'setInterval\s*\(["\x27]'
          )

          for pat in "${XSS_PATTERNS[@]}"; do
            COUNT=$(grep -cE "$pat" Marts_System_Merged.html 2>/dev/null || echo "0")
            if [ "$COUNT" -gt 0 ]; then
              echo "- \`$pat\` — **$COUNT** occurrence(s)" >> $GITHUB_STEP_SUMMARY
              ISSUES=$((ISSUES + COUNT))
            fi
          done

          if [ "$ISSUES" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Status: $ISSUES potential XSS patterns found (review recommended)" >> $GITHUB_STEP_SUMMARY
          else
            echo "Status: CLEAN - No XSS patterns detected" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Scan for insecure practices
        run: |
          echo "## Security Scan: Insecure Practices" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check for HTTP (non-HTTPS) URLs
          HTTP_COUNT=$(grep -oE 'http://[^"\x27 <]+' Marts_System_Merged.html 2>/dev/null | grep -v 'http://localhost' | grep -v '127.0.0.1' | wc -l || echo "0")
          echo "- HTTP (non-HTTPS) URLs: **$HTTP_COUNT**" >> $GITHUB_STEP_SUMMARY

          # Check for inline event handlers
          INLINE_COUNT=$(grep -coE 'on(click|load|error|submit|change|mouseover)\s*=' Marts_System_Merged.html 2>/dev/null || echo "0")
          echo "- Inline event handlers: **$INLINE_COUNT**" >> $GITHUB_STEP_SUMMARY

          # Check Content-Security-Policy in sw.js
          if grep -q "Content-Security-Policy" sw.js 2>/dev/null; then
            echo "- CSP in Service Worker: PRESENT" >> $GITHUB_STEP_SUMMARY
          else
            echo "- CSP in Service Worker: NOT FOUND (recommended)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Status: Scan complete" >> $GITHUB_STEP_SUMMARY

      - name: Run gitleaks secret detection
        if: always()
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ARGS: "--source=. --report-format=sarif --report-path=gitleaks-results.sarif"

      - name: Run Trivy vulnerability scanner
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            gitleaks-results.sarif
            ${{ github.workspace }}/.github/workflows/ci-cd.yml
          retention-days: 30

  # ══════════════════════════════════════════════
  # Stage 2: Lint & Validate
  # ══════════════════════════════════════════════
  lint:
    name: Lint & Validate
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate JavaScript syntax
        run: |
          node -e "
          const fs = require('fs');
          const html = fs.readFileSync('Marts_System_Merged.html', 'utf8');
          const scripts = [];
          let idx = 0;
          while (true) {
            const start = html.indexOf('<script', idx);
            if (start === -1) break;
            const tagEnd = html.indexOf('>', start);
            const end = html.indexOf('</script>', tagEnd);
            if (end === -1) break;
            scripts.push(html.substring(tagEnd + 1, end));
            idx = end + 9;
          }
          console.log('Found ' + scripts.length + ' script block(s)');
          let hasError = false;
          scripts.forEach((code, i) => {
            if (code.trim().length === 0) return;
            try {
              require('vm').compileFunction(code);
              console.log('  Block ' + i + ': OK (' + code.length + ' chars)');
            } catch (e) {
              console.error('  Block ' + i + ': FAIL - ' + e.message);
              hasError = true;
            }
          });
          if (hasError) { console.error('JavaScript validation FAILED'); process.exit(1); }
          console.log('All JavaScript blocks validated successfully');
          "

      - name: Validate HTML structure
        run: |
          node -e "
          const fs = require('fs');
          const html = fs.readFileSync('Marts_System_Merged.html', 'utf8');
          const checks = [
            ['<html', 'Opening html tag'],
            ['</html>', 'Closing html tag'],
            ['<body', 'Opening body tag'],
            ['</body>', 'Closing body tag'],
            ['<script', 'Script tags'],
            ['FIREBASE_CONFIG', 'Firebase config'],
            ['const STORAGE', 'STORAGE object'],
            ['function doLogin', 'Login function'],
          ];
          let fail = false;
          checks.forEach(([pat, name]) => {
            const ok = html.includes(pat);
            console.log('  ' + (ok ? 'PASS' : 'FAIL') + ': ' + name);
            if (!ok) fail = true;
          });
          if (fail) process.exit(1);
          console.log('HTML validation passed');
          "

      - name: Extract SYSTEM_VERSION
        run: |
          node -e "
          const fs = require('fs');
          const html = fs.readFileSync('Marts_System_Merged.html', 'utf8');
          const m = html.match(/SYSTEM_VERSION\s*=\s*'([^']+)'/);
          if (!m) { console.error('SYSTEM_VERSION not found!'); process.exit(1); }
          console.log('SYSTEM_VERSION: ' + m[1]);
          "

      - name: Validate sw.js
        if: hashFiles('sw.js') != ''
        run: |
          node -e "
          const fs = require('fs');
          const sw = fs.readFileSync('sw.js', 'utf8');
          try { require('vm').compileFunction(sw); console.log('sw.js: OK'); }
          catch(e) { console.error('sw.js: FAIL - ' + e.message); process.exit(1); }
          "

  # ══════════════════════════════════════════════
  # Stage 3: Build
  # ══════════════════════════════════════════════
  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare public directory
        run: |
          mkdir -p public
          cp Marts_System_Merged.html public/index.html
          cp sw.js public/sw.js
          cp manifest.json public/manifest.json
          cp icon-192.svg public/icon-192.svg 2>/dev/null || true

      - name: Get version
        id: version
        run: |
          VERSION=$(node -e "
          const fs = require('fs');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const m = html.match(/SYSTEM_VERSION\s*=\s*'([^']+)'/);
          console.log(m ? m[1] : '0.0.0');
          ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: hosting-build
          path: public/
          retention-days: 7

  # ══════════════════════════════════════════════
  # Stage 4a: Preview Deploy (for PRs)
  # ══════════════════════════════════════════════
  preview-deploy:
    name: Deploy Preview
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      preview-url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: hosting-build
          path: public/

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Setup Service Account
        run: |
          echo "${{ secrets.FIREBASE_SA_KEY }}" | base64 -d > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV

      - name: Deploy to Firebase Preview Channel
        id: deploy
        run: |
          CHANNEL="pr-${{ github.event.pull_request.number }}"
          echo "Deploying to preview channel: $CHANNEL"

          firebase deploy:channel:open \
            --channel "$CHANNEL" \
            --expire 7d \
            2>&1 | tee /tmp/deploy.log

          PREVIEW_URL=$(grep -oP 'https://[^\s]+\.web\.app' /tmp/deploy.log | tail -1)
          if [ -z "$PREVIEW_URL" ]; then
            echo "Could not extract preview URL, using default pattern"
            PREVIEW_URL="https://marts-crm-6ca37--${CHANNEL}.web.app"
          fi

          echo "Preview URL: $PREVIEW_URL"
          echo "preview-url=$PREVIEW_URL" >> $GITHUB_OUTPUT

      - name: Comment PR with preview URL
        if: steps.deploy.outputs.preview-url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.deploy.outputs.preview-url }}';
            const version = '${{ needs.build.outputs.version }}';
            const body = `## Preview Deployment Ready\n\n| | |\n|---|---|\n| **URL** | [${previewUrl}](${previewUrl}) |\n| **Version** | \`${version}\` |\n| **Channel** | pr-${{ github.event.pull_request.number }} |\n| **Expires** | 7 days |\n\n> TestSprite will run automated tests against this preview URL.`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview Deployment Ready')
            );
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ══════════════════════════════════════════════
  # Stage 5a: TestSprite on PR preview
  # ══════════════════════════════════════════════
  test-pr:
    name: TestSprite (PR)
    needs: [build, preview-deploy]
    if: >
      github.event_name == 'pull_request' &&
      needs.preview-deploy.outputs.preview-url != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Check for TestSprite tests
        id: check-tests
        run: |
          if [ -d "testsprite_tests" ] && [ "$(find testsprite_tests -name '*.spec.*' -o -name '*.test.*' -o -name 'test_*.py' 2>/dev/null)" ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
            echo "Found test files:"
            find testsprite_tests -name '*.spec.*' -o -name '*.test.*' -o -name 'test_*.py'
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
            echo "No real test files found in testsprite_tests/ - skipping"
          fi

      - name: Run TestSprite
        if: steps.check-tests.outputs.has_tests == 'true'
        uses: TestSprite/run-action@v1
        with:
          testsprite-api-key: ${{ secrets.TESTSPRITE_API_KEY }}
          base_url: ${{ needs.preview-deploy.outputs.preview-url }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          blocking: 'false'

      - name: Upload TestSprite results
        if: always() && steps.check-tests.outputs.has_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: testsprite-pr-results
          path: |
            testsprite_tests/tmp/
            testsprite_tests/*.json
            testsprite_tests/*.xml
          retention-days: 30

      - name: Comment PR with test results
        if: always() && steps.check-tests.outputs.has_tests == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.testsprite.outcome }}' === 'success';
            const emoji = passed ? '✅' : '❌';
            const previewUrl = '${{ needs.preview-deploy.outputs.preview-url }}';
            const body = `## ${emoji} TestSprite Results\n\n| Test | Status |\n|------|--------|\n| Automated UI Tests | ${passed ? 'PASSED' : 'FAILED'} |\n| Preview URL | [Open](${previewUrl}) |\n\n${passed ? '> All automated tests passed. Ready to merge.' : '> Tests failed. Check [TestSprite Dashboard](https://app.testsprite.com) for details and video recordings.'}`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('TestSprite Results')
            );
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ══════════════════════════════════════════════
  # Stage 4b: Approval Gate (production only)
  # ══════════════════════════════════════════════
  approve:
    name: Approval Gate
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://marts-crm-6ca37.web.app
    steps:
      - name: Approved
        run: echo "Production deployment approved for v${{ needs.build.outputs.version }}"

  # ══════════════════════════════════════════════
  # Stage 5b: Production Deploy
  # ══════════════════════════════════════════════
  deploy:
    name: Deploy to Production
    needs: [build, approve]
    runs-on: ubuntu-latest
    outputs:
      production-url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: hosting-build
          path: public/

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Setup Service Account
        run: |
          echo "${{ secrets.FIREBASE_SA_KEY }}" | base64 -d > /tmp/sa-key.json
          echo "SA key written, size: $(wc -c < /tmp/sa-key.json) bytes"
          echo "SA email: $(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/sa-key.json','utf8')).client_email)")"
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV

      - name: Deploy to Firebase Hosting
        id: deploy
        run: |
          firebase deploy --only hosting --project marts-crm-6ca37
          echo "url=https://marts-crm-6ca37.web.app" >> $GITHUB_OUTPUT

      - name: Deploy to Vercel
        if: success()
        run: |
          npm install -g vercel
          cd public
          vercel --token ${{ secrets.VERCEL_TOKEN }} --prod --yes --no-clipboard
          echo "vercel-url=https://marts-crm.vercel.app" >> $GITHUB_OUTPUT

      - name: Update Firestore version doc
        if: success()
        run: |
          npm install firebase-admin@12
          cat > update-firestore-version.js << 'EOF'
            const {initializeApp, cert} = require('firebase-admin/app');
            const {getFirestore} = require('firebase-admin/firestore');
            const app = initializeApp({credential: cert('/tmp/sa-key.json')});
            const db = getFirestore(app);
            const version = '${{ needs.build.outputs.version }}';
            const commitMsg = '${{ github.event.head_commit.message || '' }}'.substring(0, 200);
            console.log('Commit message:', commitMsg);
            db.collection('system_config').doc('version').set({
              version: version,
              updatedAt: new Date(),
              deployedBy: 'github-actions',
              commitSha: '${{ github.sha }}',
              commitMsg: commitMsg,
              hostingUrl: 'https://marts-crm-6ca37.web.app'
            }, { merge: true }).then(() => {
              console.log('Firestore updated: version=' + version);
              process.exit(0);
            }).catch(e => { console.error(e); process.exit(1); });
          EOF
          node update-firestore-version.js

      - name: Health check (Firebase)
        if: success()
        run: |
          echo "Waiting 15s for deploy to propagate..."
          sleep 15
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://marts-crm-6ca37.web.app/Marts_System_Merged.html")
            if [ "$STATUS" = "200" ]; then
              echo "Firebase: HEALTHY (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS, waiting 10s..."
            sleep 10
          done
          echo "::error::Firebase health check failed after 2 minutes"
          exit 1

      - name: Health check (Vercel)
        if: success()
        run: |
          echo "Waiting 10s for Vercel deploy to propagate..."
          sleep 10
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://marts-crm.vercel.app/Marts_System_Merged.html")
            if [ "$STATUS" = "200" ]; then
              echo "Vercel: HEALTHY (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS, waiting 10s..."
            sleep 10
          done
          echo "::error::Vercel health check failed after 2 minutes"
          exit 1

      - name: Summary
        if: success()
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** \`${{ needs.build.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://marts-crm-6ca37.web.app" >> $GITHUB_STEP_SUMMARY
          echo "- Clients auto-update on next login." >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════
  # Stage 6a: TestSprite on production
  # ══════════════════════════════════════════════
  test-production:
    name: TestSprite (Production)
    needs: [build, deploy]
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Wait for deploy to propagate
        run: sleep 30

      - name: Check for TestSprite tests
        id: check-tests
        run: |
          if [ -d "testsprite_tests" ] && [ "$(find testsprite_tests -name '*.spec.*' -o -name '*.test.*' -o -name 'test_*.py' 2>/dev/null)" ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
            echo "Found test files:"
            find testsprite_tests -name '*.spec.*' -o -name '*.test.*' -o -name 'test_*.py'
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
            echo "No real test files found in testsprite_tests/ - skipping"
          fi

      - name: Run TestSprite against production
        if: steps.check-tests.outputs.has_tests == 'true'
        uses: TestSprite/run-action@v1
        with:
          testsprite-api-key: ${{ secrets.TESTSPRITE_API_KEY }}
          base_url: https://marts-crm-6ca37.web.app
          github-token: ${{ secrets.GITHUB_TOKEN }}
          blocking: 'false'

      - name: Upload TestSprite results
        if: always() && steps.check-tests.outputs.has_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: testsprite-production-results
          path: |
            testsprite_tests/tmp/
            testsprite_tests/*.json
            testsprite_tests/*.xml
          retention-days: 30

      - name: Create issue if tests fail
        if: failure() && steps.check-tests.outputs.has_tests == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `TestSprite: Production tests failed for v${{ needs.build.outputs.version }}`,
              body: `## Test Failure Report\n\n| | |\n|---|---|\n| **Version** | \`${{ needs.build.outputs.version }}\` |\n| **Commit** | \`${{ github.sha }}\` |\n| **URL** | https://marts-crm-6ca37.web.app |\n\nCheck [TestSprite Dashboard](https://app.testsprite.com) for detailed results and video recordings.`,
              labels: ['bug', 'automated'],
            });

  # ══════════════════════════════════════════════
  # Stage 7: Slack Notification
  # ══════════════════════════════════════════════
  notify:
    name: Slack Notification
    needs: [security, lint, build, approve, deploy, test-production]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Determine overall status
        id: status
        run: |
          NEEDS='${{ toJSON(needs.*.result) }}'
          if echo "$NEEDS" | grep -q '"failure"'; then
            echo "emoji=:x:" >> $GITHUB_OUTPUT
            echo "color=#ff0000" >> $GITHUB_OUTPUT
            echo "status=FAILED" >> $GITHUB_OUTPUT
          elif echo "$NEEDS" | grep -q '"cancelled"'; then
            echo "emoji=:no_entry_sign:" >> $GITHUB_OUTPUT
            echo "color=#ff9900" >> $GITHUB_OUTPUT
            echo "status=CANCELLED" >> $GITHUB_OUTPUT
          else
            echo "emoji=:white_check_mark:" >> $GITHUB_OUTPUT
            echo "color=#36a64f" >> $GITHUB_OUTPUT
            echo "status=SUCCESS" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d @- << EOF
          {
            "attachments": [
              {
                "color": "${{ steps.status.outputs.color }}",
                "blocks": [
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": "${{ steps.status.outputs.emoji }} Marts CI/CD: ${{ steps.status.outputs.status }}"
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "mrkdwn",
                        "text": "*Branch:*\n${{ github.ref_name }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Version:*\n\`${{ needs.build.outputs.version || 'N/A' }}\`"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Commit:*\n\`${{ github.sha }}\`"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*URL:*\nhttps://marts-crm-6ca37.web.app"
                      }
                    ]
                  },
                  {
                    "type": "actions",
                    "elements": [
                      {
                        "type": "button",
                        "text": {
                          "type": "plain_text",
                          "text": "View Workflow"
                        },
                        "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                      },
                      {
                        "type": "button",
                        "text": {
                          "type": "plain_text",
                          "text": "View Site"
                        },
                        "url": "https://marts-crm-6ca37.web.app"
                      }
                    ]
                  }
                ]
              }
            ]
          }
          EOF
