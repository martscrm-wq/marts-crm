<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marts - Real Estate Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js">
    </script>
    <style>
        /* ===== GLOBAL ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #C4A882;
            --primary-dark: #A68B6E;
            --primary-light: #D4BC9E;
            --accent: #C4A882;
            --bg: #F5F0E8;
            --card: #FDFAF5;
            --card-hover: #F0EBE0;
            --text: #000000;
            --text-light: #666666;
            --border: #E0E0E0;
            --success: #4CAF50;
            --warning: #C4A882;
            --danger: #D94F4F;
            --sidebar-w: 270px;
            --shadow: 0 4px 24px rgba(0, 0, 0, .08);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, .12);
            --radius: 16px;
            --radius-sm: 12px;
            --crm-primary: #C4A882;
            --crm-card-bg: #FDFAF5;
            --crm-card-border: #E0E0E0;
            --crm-text-primary: #000000;
            --crm-text-muted: #999999;
            --crm-page-bg: #F5F0E8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        button {
            cursor: pointer;
            border: none;
            font-family: inherit;
        }
        input,
        select,
        textarea {
            font-family: inherit;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-size: 14px;
            width: 100%;
            transition: .25s;
            background: #FFFFFF;
            color: var(--text);
        }
        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(196, 168, 130, .15);
        }

        /* ===== LOGIN ===== */
        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #FDFAF5 0%, #F5F0E8 40%, #FDFAF5 100%);
            position: relative;
            overflow: hidden;
        }
        .login-box {
            background: rgba(253, 250, 245, .95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 48px 40px;
            width: 420px;
            max-width: 95%;
            box-shadow: 0 25px 80px rgba(0, 0, 0, .1);
            text-align: center;
            border: 1px solid rgba(196, 168, 130, .3);
        }
        .login-logo {
            width: 90px;
            height: 90px;
            border-radius: 20px;
            object-fit: cover;
            margin: 0 auto 16px;
            box-shadow: 0 8px 24px rgba(196, 168, 130, .2);
        }
        .login-box h2 {
            margin-bottom: 4px;
            color: #000;
            font-size: 28px;
            letter-spacing: 4px;
            font-family: 'Cinzel', serif;
        }
        .login-box p {
            color: var(--text-light);
            margin-bottom: 32px;
            font-size: 14px;
        }
        .login-box .form-group {
            margin-bottom: 18px;
            text-align: right;
        }
        .login-box label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            font-size: 13px;
            color: var(--text-light);
        }
        .login-box .btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 14px;
            background: linear-gradient(135deg, #C4A882, #D4BC9E);
            margin-top: 8px;
            color: #000;
        }
        .login-box .btn:hover {
            opacity: .92;
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(196, 168, 130, .3);
        }
        .login-error {
            color: var(--danger);
            font-size: 13px;
            text-align: center;
            margin-bottom: 12px;
            min-height: 20px;
        }

        /* ===== APP LAYOUT ===== */
        .app {
            display: none;
            min-height: 100vh;
        }
        .app.active {
            display: flex;
        }
        .sidebar {
            width: var(--sidebar-w);
            background: linear-gradient(180deg, #FDFAF5 0%, #F8F3EB 50%, #F5F0E8 100%);
            color: #000;
            position: fixed;
            top: 0;
            right: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 30px rgba(0, 0, 0, .08);
            border-left: 1px solid rgba(196, 168, 130, .2);
        }
        .sidebar-header {
            padding: 24px 20px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(196, 168, 130, .15);
        }
        .sidebar-logo {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            object-fit: cover;
            margin: 0 auto 10px;
            box-shadow: 0 4px 16px rgba(196, 168, 130, .2);
            border: 2px solid rgba(196, 168, 130, .2);
        }
        .sidebar-header h3 {
            font-size: 22px;
            letter-spacing: 4px;
            font-weight: 800;
            color: #000;
            font-family: 'Cinzel', serif;
        }
        .sidebar-header small {
            color: rgba(196, 168, 130, .5);
            font-size: 11px;
            letter-spacing: .5px;
        }
        .sidebar-nav {
            padding: 16px 0;
            flex: 1;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 13px 22px;
            cursor: pointer;
            transition: all .2s;
            font-size: 14px;
            border-right: 3px solid transparent;
            margin: 2px 8px;
            border-radius: 10px 0 0 10px;
            color: rgba(0, 0, 0, .5);
        }
        .nav-item:hover {
            background: rgba(196, 168, 130, .08);
            color: rgba(0, 0, 0, .8);
        }
        .nav-item.active {
            background: linear-gradient(270deg, rgba(196, 168, 130, .15), rgba(196, 168, 130, .04));
            border-right-color: var(--accent);
            color: var(--primary);
        }
        .nav-item i {
            width: 22px;
            text-align: center;
            font-size: 17px;
        }
        .sidebar-footer {
            padding: 14px 20px;
            border-top: 1px solid rgba(196, 168, 130, .12);
            font-size: 11px;
            color: rgba(0, 0, 0, .25);
            text-align: center;
        }
        .main {
            margin-right: var(--sidebar-w);
            padding: 28px;
            min-height: 100vh;
            width: calc(100% - var(--sidebar-w));
            background: linear-gradient(180deg, #FDFAF5 0%, #F8F3EB 50%, #FDFAF5 100%);
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            border-top: 1px solid rgba(196, 168, 130, .12);
            margin-top: auto;
            background: rgba(0, 0, 0, .02);
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--gradient-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 15px;
            color: #000;
            box-shadow: 0 3px 10px rgba(196, 168, 130, .2);
            overflow: hidden;
            flex-shrink: 0;
        }
        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
        }
        .user-meta {
            flex: 1;
        }
        .user-meta .name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
        }
        .user-meta .role {
            font-size: 11px;
            color: var(--text-light);
        }

        /* ===== BUTTONS ===== */
        .btn {
            padding: 10px 22px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 14px;
            transition: all .25s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, .4);
        }
        .btn-primary {
            background: linear-gradient(135deg, #C4A882, #D4BC9E);
            color: #000;
        }
        .btn-success {
            background: linear-gradient(135deg, #2E7D32, #4CAF50);
            color: #fff;
        }
        .btn-danger {
            background: linear-gradient(135deg, #B91C1C, #D94F4F);
            color: #fff;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
            box-shadow: none;
        }
        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: none;
        }
        .btn-sm {
            padding: 7px 16px;
            font-size: 13px;
            border-radius: 10px;
        }

        /* ===== CARDS ===== */
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            border: 1px solid rgba(196, 168, 130, .15);
        }
        .card:hover {
            box-shadow: var(--shadow-lg);
        }
        .card h3 {
            margin-bottom: 18px;
            font-size: 17px;
            color: var(--primary);
            font-weight: 700;
        }

        /* ===== STAT CARDS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 22px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 18px;
            border: 1px solid rgba(196, 168, 130, .15);
            transition: all .3s;
            cursor: pointer;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
            border-color: rgba(196, 168, 130, .2);
        }
        .stat-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #000;
            flex-shrink: 0;
        }
        .stat-icon.blue {
            background: linear-gradient(135deg, #C4A882, #D4BC9E);
        }
        .stat-icon.green {
            background: linear-gradient(135deg, #2E7D32, #4CAF50);
        }
        .stat-icon.yellow {
            background: linear-gradient(135deg, #A68B6E, #C4A882);
        }
        .stat-icon.red {
            background: linear-gradient(135deg, #B91C1C, #D94F4F);
        }
        .stat-info h4 {
            font-size: 26px;
            font-weight: 800;
            color: var(--text);
            line-height: 1.2;
        }
        .stat-info p {
            font-size: 13px;
            color: var(--text-light);
            margin-top: 2px;
        }

        /* ===== TABLES ===== */
        .table-wrap {
            overflow-x: auto;
            border-radius: var(--radius-sm);
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 14px;
        }
        th,
        td {
            padding: 14px 18px;
            text-align: right;
            border-bottom: 1px solid var(--border);
        }
        th {
            background: linear-gradient(180deg, #F5F5F5, #F0F0F0);
            font-weight: 700;
            font-size: 13px;
            color: var(--primary);
            white-space: nowrap;
            position: sticky;
            top: 0;
        }
        td {
            background: var(--card);
            color: var(--text);
        }
        tr:hover td {
            background: rgba(196, 168, 130, .04);
        }

        /* ===== BADGES ===== */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }
        .badge-green {
            background: rgba(76, 175, 80, .12);
            color: var(--success);
        }
        .badge-blue {
            background: rgba(196, 168, 130, .12);
            color: var(--accent);
        }
        .badge-red {
            background: rgba(217, 79, 79, .12);
            color: var(--danger);
        }
        .badge-yellow {
            background: rgba(218, 165, 32, .12);
            color: #BCA587;
        }
        .badge-purple {
            background: rgba(139, 92, 246, .12);
            color: #8B5CF6;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .7);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #FFFFFF;
            border-radius: 24px;
            padding: 32px;
            width: 740px;
            max-width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 80px rgba(0, 0, 0, .12);
            border: 1px solid rgba(196, 168, 130, .2);
        }
        .modal h3 {
            margin-bottom: 24px;
            font-size: 20px;
            font-weight: 800;
            color: var(--primary);
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-start;
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 700;
            font-size: 13px;
            color: var(--text-light);
        }
        .form-group.full {
            grid-column: 1 / -1;
        }

        /* ===== FILTERS ===== */
        .filters {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            align-items: flex-end;
            margin-bottom: 22px;
        }
        .filters .form-group {
            margin-bottom: 0;
            min-width: 160px;
        }

        /* ===== CRM CLIENT MANAGEMENT ===== */
        .crm-dashboard-page {
            background: var(--crm-page-bg);
            min-height: 100vh;
        }
        .crm-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            padding: 0 24px;
            background: linear-gradient(90deg, #FDFAF5, #F8F3EB, #FDFAF5);
            border-bottom: 1px solid rgba(196, 168, 130, .2);
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 24px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, .06);
        }
        .crm-navbar-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
        }
        .crm-navbar-logo {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 2px 8px rgba(196, 168, 130, .2);
        }
        .crm-navbar-brand {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            font-weight: 800;
            color: var(--crm-primary);
            letter-spacing: 2px;
        }
        .crm-navbar-nav {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 0 0 auto;
        }
        .crm-nav-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-light);
            cursor: pointer;
            transition: all .2s;
            white-space: nowrap;
        }
        .crm-nav-item i {
            font-size: 14px;
            width: 18px;
            text-align: center;
        }
        .crm-nav-item:hover {
            background: rgba(196, 168, 130, .1);
            color: var(--text-primary);
        }
        .crm-nav-item.active {
            background: var(--crm-primary);
            color: #000;
        }
        .crm-navbar-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 0 0 auto;
        }
        .crm-nav-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--crm-page-bg);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all .2s;
            position: relative;
            font-size: 14px;
        }
        .crm-nav-icon:hover {
            background: var(--crm-card-border);
            color: var(--text-primary);
        }
        .badge-dot {
            position: absolute;
            top: 4px;
            left: 4px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--danger);
            font-size: 7px;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .crm-nav-icon.avatar {
            background: var(--crm-primary);
            color: #000;
            font-weight: 700;
            font-size: 13px;
            overflow: hidden;
        }
        .crm-nav-icon.avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* CMG Board */
        .cmg-column {
            min-width: 280px;
            max-width: 320px;
            flex: 0 0 auto;
            background: var(--crm-card-bg);
            border: 1px solid var(--crm-card-border);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 160px);
        }
        .cmg-drop-zone {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 80px;
            transition: background .2s;
        }
        .cmg-drop-zone.dragover {
            background: rgba(196, 168, 130, .08);
        }
        .cmg-client-card {
            background: var(--crm-page-bg);
            border: 1px solid var(--crm-card-border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            cursor: grab;
            transition: all .15s;
            position: relative;
        }
        .cmg-client-card:hover {
            border-color: var(--crm-primary);
            box-shadow: 0 2px 8px rgba(196, 168, 130, .15);
        }
        .cmg-client-card.dragging {
            opacity: .4;
        }
        .cmg-card-select-stage {
            flex: 1;
            min-width: 0;
            padding: 2px 4px;
            border: 1px solid rgba(196, 168, 130, .25);
            border-radius: 4px;
            font-size: 9px;
            font-weight: 600;
            background: transparent;
            cursor: pointer;
            appearance: auto;
            line-height: 1.4;
            color: var(--text);
        }
        .cmg-card-select-stage:focus {
            outline: none;
            border-color: var(--crm-primary);
        }
        .cmg-status-chip {
            padding: 3px 10px;
            border-radius: 14px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all .15s;
        }
        .cmg-status-chip.active {
            box-shadow: 0 0 0 2px rgba(196, 168, 130, .5);
            transform: scale(1.05);
        }

        /* ===== RESPONSIVE ===== */
        @media(max-width:768px) {
            .sidebar {
                transform: translateX(100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main {
                margin-right: 0;
                width: 100%;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            .cmg-column {
                min-width: 240px;
                max-width: 280px;
            }
            .crm-navbar-nav {
                display: none;
            }
        }
        @media(max-width:480px) {
            .crm-navbar-right .crm-nav-icon:not(.avatar) {
                display: none;
            }
            .cmg-column {
                min-width: 200px;
                max-width: 240px;
            }
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }
        .empty-state i {
            font-size: 52px;
            margin-bottom: 16px;
            color: #CCCCCC;
        }
        .empty-state p {
            font-size: 15px;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .mb-16 {
            margin-bottom: 16px;
        }
        .mt-16 {
            margin-top: 16px;
        }
        .readonly-input {
            background: rgba(196, 168, 130, .05) !important;
            color: var(--text-light) !important;
            cursor: not-allowed;
            border-style: dashed !important;
        }
        .crm-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 18px;
        }
        .crm-tab {
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            background: #FFFFFF;
            border: 1px solid var(--border);
            color: var(--text-light);
            transition: all 0.2s;
        }
        .crm-tab.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
        }
        .crm-tab:hover:not(.active) {
            border-color: var(--primary);
            color: var(--text);

        function doLogin() {

                    'أدخل اسم المستخدم وكلمة المرور' : 'Enter username and password'; return; }
            const users = STORAGE.get('users', defaultUsers);
            const found = users.find(x => x.username === u && x.password === p);
            if (!found) { document.getElementById('loginError').textContent = lang === 'ar' ?

            currentUser = { username: found.username, role: found.role, fullName: found.fullName };

            document.getElementById('loginError').textContent = '';
            showApp();
        }

        // DASHBOARD (minimal)
        // ============================================================
        function renderDashboard(el) {
            const sales = STORAGE.get('sales', []);
            const employees = STORAGE.get('employees', []);
            const total = sales.reduce((s, x) => s + (x.unitPrice || 0), 0);
            const totalComm = sales.reduce((s, x) => s + (x.unitPrice || 0) * (x.commissionRate || 0) / 100, 0);
            const active = employees.filter(e => e.status === 'active').length;
            el.innerHTML =
                `
            <div class="topbar"><h1>${t('nav_dashboard')}</h1>
            <div class="topbar-actions"><div class="toggle-wrap"><span>EN</span><div class="toggle${lang==='en'?' on':''}" onclick="toggleLang()"></div><span>AR</span></div></div></div>
            <div class="stats-grid">
              <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-dollar-sign"></i></div><div class="stat-info"><h4>${fmt(total)}</h4><p>${t('dash_totalSales')}</p></div></div>
              <div class="stat-card"><div class="stat-icon green"><i class="fas fa-percent"></i></div><div class="stat-info"><h4>${fmt(totalComm)}</h4><p>${t('dash_totalCommission')}</p></div></div>
              <div class="stat-card"><div class="stat-icon yellow"><i class="fas fa-users"></i></div><div class="stat-info"><h4>${active}</h4><p>${t('dash_activeEmployees')}</p></div></div>
              <div class="stat-card"><div class="stat-icon red"><i class="fas fa-clock"></i></div><div class="stat-info"><h4>${sales.filter(s=>s.bookingType==='contract').length}</h4><p>${t('dash_commissionDue')}</p></div></div>
            </div>
            <div class="card"><h3>${t('dash_recentSales')}</h3><div class="table-wrap" id="dashTable"></div></div>`;
            const recent = sales.slice(-5).reverse();
            if (!recent.length) { document.getElementById('dashTable').innerHTML = '<div class="empty-state"><p>' + t(
                    'noData') + '</p></div>'; return; }
            let h =
                '<table><thead><tr><th>' + t('sale_code') + '</th><th>' + t('sale_client') + '</th><th>' + t(
                    'sale_project') + '</th><th>' + t('sale_unitType') + '</th><th>' + t('sale_price') +
                '</th><th>' + t('sale_date') + '</th></tr></thead><tbody>';
            recent.forEach(s => { h += '<tr><td>' + s.code + '</td><td>' + s.client + '</td><td>' + s.project +
                    '</td><td>' + s.unitType + '</td><td>' + fmt(s.unitPrice) + '</td><td>' + fmtDate(s.date) +
                    '</td></tr>'; });
            h += '</tbody></table>';
            document.getElementById('dashTable').innerHTML = h;
        }

        // ============================================================
        // CRM VIEW SWITCHER
        // ============================================================
        function switchCrmView(view, stageKey) {
            document.querySelectorAll('.crm-nav-item').forEach(n => n.classList.remove('active'));
            const navItem = Array.from(document.querySelectorAll('.crm-nav-item')).find(n =>
                n.textContent.trim().toLowerCase().includes(view) ||
                (view === 'clientMgmt' && n.textContent.trim().toLowerCase().includes('ادارة'))
            );
            if (navItem) navItem.classList.add('active');
            const content = document.getElementById('crmViewContent');
            if (view === 'dashboard') renderCrmDashboardView(content);
            else if (view === 'clientMgmt') renderCrmClientManagement(content);
            else if (view === 'workspace') renderCrmWorkspaceView(content);
            else if (view === 'deals') renderCrmDealsView(content);
            else if (view === 'marketing') renderCrmMarketingView(content);
            else if (view === 'inventory') renderCrmInventoryView(content);
            else if (view === 'reports') renderCrmReportsView(content);
            else if (view === 'stage' && stageKey) renderCrmStageView(content, stageKey);
            else content.innerHTML =
                '<div class="empty-state" style="padding:80px 20px"><i class="fas fa-tools" style="font-size:48px;color:var(--crm-text-muted)"></i><p style="margin-top:16px;color:var(--crm-text-muted)">' +
                (lang === 'ar' ? 'قريباً' : 'Coming soon') + '</p></div>';
        }

        function getTopAgents(limit) {
            const users = getAllUsers().filter(u => ['sales', 'tl', 'sm', 'marketer', 'ma', 'md'].includes(u.role));
            return users.map(u => ({ ...u, score: Math.floor(Math.random() * 500) + 100 })).sort((a, b) => b.score - a.score)
                .slice(0, limit);
        }

        function filterCrmDash() {
            const filter = document.getElementById('crmDashFilter')?.value || '';
            const clients = getCrmClients();
            const filtered = filter ? clients.filter(c => (c.stage || 'fresh_leads') === filter) : clients;
            const stageStats = CRM_STAGES.map(s => ({ stage: s, count: filtered.filter(c => (c.stage || 'fresh_leads') === s)
                    .length }));
            const grid = document.querySelector('.crm-stats-grid');
            if (grid) {
                const colors = ['#C4A882', '#BCA587', '#F59E0B', '#10B981', '#3B82F6', '#8B5CF6', '#EC4899', '#06B6D4',
                    '#F97316', '#6366F1', '#84CC16', '#EF4444', '#14B8A6', '#22D3EE', '#A855F7', '#F43F5E', '#64748B',
                    '#78716C', '#FB923C', '#38BDF8', '#E11D48', '#4ADE80', '#FBBF24'
                ];
                grid.innerHTML = stageStats.map((stat, idx) => {
                    const c = colors[idx % colors.length];
                    return `<div class="crm-stat-card" style="border:1px solid var(--crm-card-border);border-radius:12px;padding:14px 12px;text-align:center;border-left:3px solid ${c};cursor:pointer" onclick="switchCrmView('stage','${stat.stage}')"><div class="stat-value" style="font-size:22px;font-weight:800;color:var(--crm-text-primary);line-height:1.2;margin-bottom:4px">${stat.count}</div><div class="stat-label" style="font-size:11px;color:var(--crm-text-muted);font-weight:600;line-height:1.3">${t('crm_stage_'+stat.stage)}</div></div>`;
                }).join('');
            }
            const countEl = document.querySelector('.crm-filter-label .count');
            if (countEl) countEl.textContent = filtered.length;
        }

        // CRM STAGE VIEW
        // ============================================================

            const clients = getCrmClients().filter(c => (c.stage || 'fresh_leads') === stageKey);
            const stageLabel = t('crm_stage_' + stageKey);

                    ${userClients.length === 0 ? `<div style="text-align:center;padding:24px;color:var(--crm-text-muted);font-size:12px"><i class="fas fa-user-plus" style="font-size:20px;margin-bottom:6px;display:block;opacity:.4"></i>${lg?'اسحب عميل هنا':'Drag client here'}</div>` : userClients.map(c => cmgRenderClientCard(c, stageLabels, statusColors, statusLabels, lg)).join('')}

        function cmgRenderClientCard(c, stageLabels, statusColors, statusLabels, lg) {

            const sl = statusLabels[c.status || 'new'];

        // ============================================================
        // CRM CLIENT ACTIONS (Stage, Status, Drag & Drop)
        // ============================================================
        function cmgChangeStage(clientId, newStage) {
            const clients = getCrmClients();
            const idx = clients.findIndex(c => c.id === clientId);
            if (idx < 0) return;
            const oldStage = clients[idx].stage || 'fresh_leads';
            clients[idx].stage = newStage;
            saveCrmClients(clients);
            addCrmActivity(clientId, 'updated', (lang === 'ar' ? 'تم تغيير المرحلة من ' : 'Stage changed from ') + t(
                'crm_stage_' + oldStage) + (lang === 'ar' ? ' إلى ' : ' to ') + t('crm_stage_' + newStage));
            showToast((lang === 'ar' ? 'تم التغيير إلى ' : 'Changed to ') + t('crm_stage_' + newStage));
            renderCrmClientManagement(document.getElementById('crmViewContent'));
        }

        function cmgFilterByStatus(status, chip) {
            document.querySelectorAll('.cmg-status-chip').forEach(c => c.classList.remove('active'));
            if (chip) chip.classList.add('active');
            const clients = getCrmClients();
            document.querySelectorAll('.cmg-client-card').forEach(card => {
                const cid = card.dataset.clientId;
                const c = clients.find(x => x.id === cid);
                if (!c) return;
                const match = !status || c.status === status;
                card.style.display = match ? '' : 'none';
            });
            // Update column counts
            updateCmgColumnCounts();
        }

        function filterCmgBoard() {
            const search = (document.getElementById('cmgSearchInput')?.value || '').toLowerCase();
            const agent = document.getElementById('cmgFilterAgent')?.value || '';
            const clients = getCrmClients();
            document.querySelectorAll('.cmg-client-card').forEach(card => {
                const cid = card.dataset.clientId;
                const c = clients.find(x => x.id === cid);
                if (!c) return;
                const matchSearch = !search || (c.name || '').toLowerCase().includes(search) || (c.phone || '')
                    .includes(search);
                const matchAgent = !agent || c.assignedUser === agent;
                card.style.display = (matchSearch && matchAgent) ? '' : 'none';
            });
            updateCmgColumnCounts();
        }

        function clearCmgFilters() {
            document.getElementById('cmgSearchInput').value = '';
            document.getElementById('cmgFilterAgent').value = '';

        function updateCmgColumnCounts() {
            // Update column header counts based on visible cards

                const total = col.querySelectorAll('.cmg-client-card').length;
                const countEl = col.querySelector('.cmg-column-count');
                if (countEl) countEl.textContent = total - visible;

        function cmgDropClient(e, targetAgent) {
            e.preventDefault();
            const clientId = _crmDragClientId || e.dataTransfer?.getData('text/plain');
            if (!clientId) return;
            _crmDragClientId = null;
            const clients = getCrmClients();
            const idx = clients.findIndex(c => c.id === clientId);
            if (idx < 0) return;
            const oldAgent = clients[idx].assignedUser || '';
            if (oldAgent === targetAgent) return;
            clients[idx].assignedUser = targetAgent;
            saveCrmClients(clients);
            const newAgentUser = targetAgent ? getUserByUsername(targetAgent) : null;
            const newName = newAgentUser ? (newAgentUser.fullName || targetAgent) : (lang === 'ar' ? 'غير معيّن' : 'Unassigned');
            addCrmActivity(clientId, 'updated', (lang === 'ar' ? 'تم التحويل إلى ' : 'Transferred to ') + newName);
            showToast((lang === 'ar' ? 'تم النقل إلى ' : 'Moved to ') + newName);
            renderCrmClientManagement(document.getElementById('crmViewContent'));
        }

        function saveCrmClient(clientId) {
            const name = document.getElementById('crm_name').value.trim();
            if (!name) { alert(lang === 'ar' ? 'أدخل اسم العميل' : 'Enter client name'); return; }
            const clients = getCrmClients();
            const data = {
                name,
                phone: document.getElementById('crm_phone').value.trim(),
                email: document.getElementById('crm_email').value.trim(),
                nationalId: document.getElementById('crm_nationalId').value.trim(),
                source: document.getElementById('crm_source').value,
                status: document.getElementById('crm_status').value,
                stage: document.getElementById('crm_stage')?.value || 'fresh_leads',
                budget: document.getElementById('crm_budget').value || '0',
                assignedUser: document.getElementById('crm_assignedUser')?.value || '',
                preferredProject: document.getElementById('crm_prefProject').value.trim(),
                preferredUnit: document.getElementById('crm_prefUnit').value.trim(),
                address: document.getElementById('crm_address').value.trim(),
                nextFollowUp: document.getElementById('crm_nextFollowUp').value,
                notes: document.getElementById('crm_notes').value.trim(),
            };
            if (clientId) {
                const idx = clients.findIndex(c => c.id === clientId);
                if (idx >= 0) {
                    Object.assign(clients[idx], data);
                    addCrmActivity(clientId, 'updated', t('edit'));
                }
            } else {
                data.id = 'c_' + Date.now();
                data.date = today();
                data.lastContact = new Date().toISOString();
                if (!data.assignedUser && currentUser) {
                    const cu = getUserByUsername(currentUser.username);
                    if (cu && ['sales', 'tl', 'sm', 'marketer', 'ma', 'md'].includes(cu.role)) {
                        data.assignedUser = currentUser.username;
                    }
                }
                clients.push(data);
                addCrmActivity(data.id, 'created', t('crm_addClient'));
            }
            saveCrmClients(clients);
            closeModal();
            showToast(t('crm_saveSuccess'));
            renderCrmClientManagement(document.getElementById('crmViewContent'));
        }

        function filterDealsTable() {
            const search = (document.getElementById('dealsSearch')?.value || '').toLowerCase();
            const status = document.getElementById('dealsFilterStatus')?.value || '';
            document.querySelectorAll('#dealsTableBody tr').forEach(row => {
                const name = row.dataset.name || '';
                const st = row.dataset.status || '';
                const matchSearch = !search || name.includes(search);
                const matchStatus = !status || st === status;
                row.style.display = (matchSearch && matchStatus) ? '' : 'none';
            });
        }

        function dealsExport() {
            const rows = document.querySelectorAll('#dealsTableBody tr');
            if (!rows.length) { showToast(lang === 'ar' ? 'لا توجد بيانات' : 'No data'); return; }
            let csv = '\uFEFF' + (lang === 'ar' ? 'الاسم,الهاتف,المرحلة,الحالة,الميزانية,المسند' :
                'Name,Phone,Stage,Status,Budget,Assigned') + '\n';
            rows.forEach(tr => {
                const cells = [];
                tr.querySelectorAll('td').forEach(td => cells.push('"' + td.textContent.trim().replace(/"/g, '""') +
                    '"'));
                csv += cells.join(',') + '\n';
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'deals_export_' + today() + '.csv';
            a.click();
            URL.revokeObjectURL(url);
            showToast(lang === 'ar' ? 'تم التصدير' : 'Exported');
        }

            h += '</tbody></table>';

        }

        function filterCrmAccounts() { renderCrmAccountsTable(); }

        function openCrmAccountModal() {
            document.getElementById('modalContainer').innerHTML = `<h3><i class="fas fa-user-plus" style="color:var(--primary);margin-left:8px"></i> ${t('crm_acc_newAccount')}</h3>
            <div class="form-row"><div class="form-group"><label>${t('crm_acc_username')}</label><input type="text" id="crmA_user"></div><div class="form-group"><label>${t('crm_acc_password')}</label><input type="password" id="crmA_pass"></div></div>
            <div class="form-row"><div class="form-group"><label>${t('crm_acc_name')}</label><input type="text" id="crmA_fullName"></div><div class="form-group"><label>${t('crm_acc_email')}</label><input type="email" id="crmA_email" placeholder="user@marts-eg.com"></div></div>
            <div class="form-row"><div class="form-group"><label>${t('crm_acc_role')}</label><select id="crmA_role"><option value="tl">${t('tl')}</option><option value="sales">${t('sales')}</option><option value="sm">${t('sm')}</option><option value="head_of_sales">${t('head_of_sales')}</option><option value="super_admin">${t('super_admin')}</option><option value="md">${t('md')}</option><option value="ma">${t('ma')}</option><option value="marketer">${t('marketer')}</option><option value="operations">${t('operations')}</option></select></div></div>
            <h4 style="color:var(--primary);margin:16px 0 8px"><i class="fas fa-shield-alt"></i> ${t('crm_acc_crmPerms')}</h4>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><label style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border-radius:8px;cursor:pointer;font-size:13px"><input type="checkbox" class="crmA_perm" value="crm_view" checked style="width:16px;height:16px;accent-color:var(--primary)"> ${t('crm_acc_view')}</label><label style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border-radius:8px;cursor:pointer;font-size:13px"><input type="checkbox" class="crmA_perm" value="crm_add" checked style="width:16px;height:16px;accent-color:var(--primary)"> ${t('crm_acc_add_perm')}</label><label style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border-radius:8px;cursor:pointer;font-size:13px"><input type="checkbox" class="crmA_perm" value="crm_edit" checked style="width:16px;height:16px;accent-color:var(--primary)"> ${t('crm_acc_edit_perm')}</label><label style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border-radius:8px;cursor:pointer;font-size:13px"><input type="checkbox" class="crmA_perm" value="crm_delete" style="width:16px;height:16px;accent-color:var(--primary)"> ${t('crm_acc_delete_perm')}</label></div>
            <div class="modal-actions"><button class="btn btn-primary" onclick="saveCrmAccount()"><i class="fas fa-save"></i> ${t('crm_acc_save')}</button><button class="btn btn-outline" onclick="closeModal()">${t('crm_acc_cancel')}</button></div>`;
            document.getElementById('modalOverlay').classList.add('active');
        }

        function saveCrmAccount() {
            const username = document.getElementById('crmA_user').value.trim();
            const password = document.getElementById('crmA_pass').value;
            if (!username || !password) { alert(lang === 'ar' ? 'أدخل اسم المستخدم وكلمة المرور' :
                'Enter username and password'); return; }
            const users = STORAGE.get('users', defaultUsers);
            if (users.find(u => u.username === username)) { alert(lang === 'ar' ? 'اسم المستخدم موجود مسبقاً' :
                    'Username already exists'); return; }
            const fullName = document.getElementById('crmA_fullName').value.trim();
            const email = document.getElementById('crmA_email').value.trim() || username + '@marts-eg.com';
            const role = document.getElementById('crmA_role').value;
            const perms = [];
            document.querySelectorAll('.crmA_perm:checked').forEach(cb => perms.push(cb.value));
            users.push({ username, password, role, fullName, email, permissions: perms });
            STORAGE.set('users', users);
            closeModal();
            showToast(t('crm_saveSuccess'));
            renderCrmAccounts(document.getElementById('mainContent'));
        }

        function openCrmAccountEdit(idx) {
            const users = STORAGE.get('users', defaultUsers);
            const u = users[idx];
            if (!u) return;
            document.getElementById('modalContainer').innerHTML = `<h3><i class="fas fa-pen" style="color:var(--primary);margin-left:8px"></i> ${t('crm_acc_editUser')}: ${u.username}</h3>
            <div class="form-row"><div class="form-group"><label>${t('crm_acc_username')}</label><input type="text" value="${u.username}" disabled style="opacity:.6"></div><div class="form-group"><label>${t('crm_acc_name')}</label><input type="text" id="crmA_editName" value="${u.fullName||''}"></div></div>
            <div class="form-row"><div class="form-group"><label>${t('crm_acc_email')}</label><input type="email" id="crmA_editEmail" value="${u.email||u.username+'@marts-eg.com'}"></div><div class="form-group"><label>${t('crm_acc_password')} (${t('crm_acc_optional')})</label><input type="password" id="crmA_editPass"></div></div>
            <div class="form-row"><div class="form-group"><label>${t('crm_acc_role')}</label><select id="crmA_editRole"><option value="tl" ${u.role==='tl'?'selected':''}>${t('tl')}</option><option value="sales" ${u.role==='sales'?'selected':''}>${t('sales')}</option><option value="sm" ${u.role==='sm'?'selected':''}>${t('sm')}</option><option value="head_of_sales" ${u.role==='head_of_sales'?'selected':''}>${t('head_of_sales')}</option><option value="super_admin" ${u.role==='super_admin'?'selected':''}>${t('super_admin')}</option><option value="md" ${u.role==='md'?'selected':''}>${t('md')}</option><option value="ma" ${u.role==='ma'?'selected':''}>${t('ma')}</option><option value="marketer" ${u.role==='marketer'?'selected':''}>${t('marketer')}</option><option value="operations" ${u.role==='operations'?'selected':''}>${t('operations')}</option></select></div></div>
            <div class="modal-actions"><button class="btn btn-primary" onclick="saveCrmAccountEdit(${idx})"><i class="fas fa-save"></i> ${t('crm_acc_save')}</button><button class="btn btn-outline" onclick="closeModal()">${t('crm_acc_cancel')}</button></div>`;
            document.getElementById('modalOverlay').classList.add('active');
        }

        function saveCrmAccountEdit(idx) {
            const users = STORAGE.get('users', defaultUsers);
            users[idx].fullName = document.getElementById('crmA_editName').value.trim();
            users[idx].email = document.getElementById('crmA_editEmail').value.trim() || users[idx].username +
                '@marts-eg.com';
            users[idx].role = document.getElementById('crmA_editRole').value;
            const newPass = document.getElementById('crmA_editPass').value;
            if (newPass && newPass.length >= 4) users[idx].password = newPass;
            STORAGE.set('users', users);
            if (currentUser && users[idx].username === currentUser.username) {
                currentUser.fullName = users[idx].fullName;
                currentUser.role = users[idx].role;
                STORAGE.set('currentUser', currentUser);
            }
            closeModal();
            showToast(t('settings_accountSaved'));
            renderCrmAccounts(document.getElementById('mainContent'));
        }

        function openCrmAccountPerms(idx) {
            const users = STORAGE.get('users', defaultUsers);
            const u = users[idx];
            if (!u) return;
            const p = u.permissions || [];
            const has = (perm) => p.includes(perm) ? 'checked' : '';
            document.getElementById('modalContainer').innerHTML = `<h3><i class="fas fa-shield-alt" style="color:var(--primary);margin-left:8px"></i> ${t('crm_acc_perms')}: ${u.fullName||u.username}</h3>
            <h4 style="color:var(--primary);margin-bottom:12px"><i class="fas fa-address-book"></i> ${t('crm_acc_crmPerms')}</h4>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px"><label style="display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg);border-radius:8px;cursor:pointer;font-size:13px"><input type="checkbox" class="crmA_permCheck" value="crm_view" ${has('crm_view')} style="width:16px;height:16px;accent-color:var(--primary)"> ${t('crm_acc_view')}</label><label style="display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg);border-radius:8px;cursor:pointer;font-size:13px"><input type="checkbox" class="crmA_permCheck" value="crm_add" ${has('crm_add')} style="width:16px;height:16px;accent-color:var(--primary)"> ${t('crm_acc_add_perm')}</label><label style="display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg);border-radius:8px;cursor:pointer;font-size:13px"><input type="checkbox" class="crmA_permCheck" value="crm_edit" ${has('crm_edit')} style="width:16px;height:16px;accent-color:var(--primary)"> ${t('crm_acc_edit_perm')}</label><label style="display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg);border-radius:8px;cursor:pointer;font-size:13px"><input type="checkbox" class="crmA_permCheck" value="crm_delete" ${has('crm_delete')} style="width:16px;height:16px;accent-color:var(--primary)"> ${t('crm_acc_delete_perm')}</label></div>
            <div class="modal-actions"><button class="btn btn-primary" onclick="saveCrmAccountPerms(${idx})"><i class="fas fa-save"></i> ${t('crm_acc_save')}</button><button class="btn btn-outline" onclick="closeModal()">${t('crm_acc_cancel')}</button></div>`;
            document.getElementById('modalOverlay').classList.add('active');
        }

        function saveCrmAccountPerms(idx) {
            const users = STORAGE.get('users', defaultUsers);
            const perms = [];
            document.querySelectorAll('.crmA_permCheck:checked').forEach(cb => perms.push(cb.value));
            users[idx].permissions = perms;
            STORAGE.set('users', users);
            if (currentUser && users[idx].username === currentUser.username) {
                currentUser.permissions = perms;
                STORAGE.set('currentUser', currentUser);
            }
            closeModal();
            showToast(t('settings_permissionsSaved'));
            renderCrmAccounts(document.getElementById('mainContent'));
        }

        function deleteCrmAccount(idx) {
            if (!confirm(t('crm_acc_confirmDelete'))) return;
            const users = STORAGE.get('users', defaultUsers);
            if (users[idx] && users[idx].username === 'owner') return;
            users.splice(idx, 1);
            STORAGE.set('users', users);
            renderCrmAccounts(document.getElementById('mainContent'));
        }

        // ============================================================
        // SALES, EMPLOYEES, ORG CHART, COMMISSIONS, ACCOUNTING, REPORTS
        // (minimal placeholders)
        // ============================================================
        function renderSales(el) {
            el.innerHTML =
                `<div class="topbar"><h1>${t('nav_sales')}</h1></div><div class="card"><div class="empty-state"><i class="fas fa-file-invoice-dollar"></i><p>${t('noData')}</p></div></div>`;
        }

        function renderEmployees(el) {
            el.innerHTML =
                `<div class="topbar"><h1>${t('nav_employees')}</h1></div><div class="card"><div class="empty-state"><i class="fas fa-users"></i><p>${t('noData')}</p></div></div>`;
        }

        function renderOrgChart(el) {
            el.innerHTML =
                `<div class="topbar"><h1>${t('nav_orgChart')}</h1></div><div class="card"><div class="empty-state"><i class="fas fa-sitemap"></i><p>${t('noData')}</p></div></div>`;
        }

        function renderCommissions(el) {
            el.innerHTML =
                `<div class="topbar"><h1>${t('nav_commissions')}</h1></div><div class="card"><div class="empty-state"><i class="fas fa-percent"></i><p>${t('noData')}</p></div></div>`;
        }

        function renderAccounting(el) {
            el.innerHTML =
                `<div class="topbar"><h1>${t('nav_accounting')}</h1></div><div class="card"><div class="empty-state"><i class="fas fa-calculator"></i><p>${t('noData')}</p></div></div>`;
        }

        function renderReports(el) {
            el.innerHTML =
                `<div class="topbar"><h1>${t('nav_reports')}</h1></div><div class="card"><div class="empty-state"><i class="fas fa-chart-bar"></i><p>${t('noData')}</p></div></div>`;
        }

        function renderSearch(el) {
            el.innerHTML =
                `<div class="topbar"><h1>${t('nav_search')}</h1></div><div class="card"><div class="search-box"><input type="text" placeholder="${t('search_hint')}" oninput="doSearch(this.value)"><i class="fas fa-search"></i></div></div><div id="searchResults"></div>`;
        }

        function doSearch(q) {
            const results = document.getElementById('searchResults');
            if (!q || q.length < 2) { results.innerHTML = ''; return; }
            const clients = getCrmClients().filter(c => (c.name || '').toLowerCase().includes(q.toLowerCase()) || (c.phone ||
                '').includes(q) || (c.email || '').toLowerCase().includes(q.toLowerCase()));
            if (!clients.length) { results.innerHTML =
                    '<div class="card"><div class="empty-state"><p>' + t('crm_noResults') +
                    '</p></div></div>'; return; }
            let h = '<div class="card"><h3>' + t('nav_crm') + ' (' + clients.length + ')</h3><div class="table-wrap"><table><thead><tr><th>' +
                t('crm_clientName') + '</th><th>' + t('crm_clientPhone') + '</th><th>' + t('crm_clientEmail') +
                '</th><th>' + t('crm_clientStatus') + '</th></tr></thead><tbody>';
            clients.forEach(c => { h += '<tr><td><strong>' + c.name + '</strong></td><td>' + (c.phone || '-') +
                    '</td><td>' + (c.email || '-') + '</td><td><span class="badge badge-blue">' + t('crm_status_' + c
                        .status) + '</span></td></tr>'; });
            h += '</tbody></table></div></div>';
            results.innerHTML = h;
        }

        // ============================================================
        // SETTINGS
        // ============================================================
        function renderSettings(el) {
            el.innerHTML =
                `<div class="topbar"><h1>${t('nav_settings')}</h1></div>
            <div class="card"><h3>${t('settings_users')}</h3><div class="empty-state"><i class="fas fa-users-cog"></i><p>${t('noData')}</p></div></div>
            <div class="card"><h3>${t('settings_data')}</h3><div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:12px"><button class="btn btn-success btn-sm" onclick="exportAllData()"><i class="fas fa-download"></i> ${t('settings_exportData')}</button><button class="btn btn-danger btn-sm" onclick="clearAllData()"><i class="fas fa-trash"></i> ${t('settings_clearData')}</button></div></div>`;
        }

        function exportAllData() {
            const data = {};
            ['users', 'employees', 'sales', 'treasury', 'salaries', 'partners', 'expenses', 'crm_clients',
                'crm_activities'
            ].forEach(k => { data[k] = STORAGE.get(k); });
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'marts_backup_' + today() + '.json';
            a.click();
            URL.revokeObjectURL(url);
            showToast(lang === 'ar' ? 'تم التصدير' : 'Exported');
        }

        function clearAllData() {
            if (!confirm(t('confirm_delete'))) return;
            safeStorage.clear();
            STORAGE.set('lang', lang);
            initData();
            buildSidebar();
            showPage('dashboard');
            showToast(lang === 'ar' ? 'تم مسح البيانات' : 'Data cleared');
        }

        // ============================================================
        // UTILITY FUNCTIONS
        // ============================================================
        function toggleLang() {
            lang = lang === 'ar' ? 'en' : 'ar';
            STORAGE.set('lang', lang);
            buildSidebar();
            renderPage(currentPage);
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }
        document.getElementById('modalOverlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.style.cssText =
                'position:fixed;top:24px;left:50%;transform:translateX(-50%);background:var(--crm-primary);color:#000;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:10001;box-shadow:0 4px 20px rgba(196,168,130,.3);animation:fadeInToast .3s';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        // ============================================================
        // RESET
        // ============================================================
        function resetAllData() {
            try { localStorage.clear(); } catch (e) {}
            try { sessionStorage.clear(); } catch (e) {}
            mem = {};
            currentUser = null;
            document.getElementById('loginError').textContent = '';
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
            document.getElementById('app').classList.remove('active');
            document.getElementById('loginPage').style.display = 'flex';
            try { initData(); } catch (e) { document.getElementById('loginError').textContent = 'Reset done.'; }
        }

        // ============================================================
        // INIT
        // ============================================================
        try { initData(); } catch (e) { console.error(e); }
        document.getElementById('loginPass').addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
        document.getElementById('loginUser').addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });

        try {
            if (currentUser) {
                const users = STORAGE.get('users', defaultUsers);
                if (users && users.find && users.find(u => u.username === currentUser.username)) showApp();
                else doLogout();
            }
        } catch (e) {
            currentUser = null;
            safeStorage.remove('currentUser');
        }

        // CSS ANIMATION

        const styleSheet = document.createElement('style');
