function filterCrmList(){
  let clients=getVisibleClients();
  if(_crmTeamFilterUser) clients=clients.filter(c=>(c.assignedUser||'')===_crmTeamFilterUser);
  const search=(document.getElementById('crmFilterSearch')?.value||'').trim().toLowerCase();
  const source=document.getElementById('crmFilterSource')?.value||'';
  const status=document.getElementById('crmFilterStatus')?.value||'';
  const stage=document.getElementById('crmFilterStage')?.value||'';
  if(search) clients=clients.filter(c=>(c.name||'').toLowerCase().includes(search)||(c.phone||'').includes(search)||(c.email||'').toLowerCase().includes(search)||(c.nationalId||'').includes(search));
  if(source) clients=clients.filter(c=>c.source===source);
  if(status) clients=clients.filter(c=>c.status===status);
  if(stage) clients=clients.filter(c=>(c.stage||'fresh_leads')===stage);
  const countEl=document.getElementById('crmFilterCount');
  if(countEl) countEl.textContent=clients.length+' '+t('crm_filterResults');
  if(!clients.length){document.getElementById('crmTable').innerHTML='<div class="empty-state"><p>'+t('crm_noResults')+'</p></div>';return;}
  const employees=STORAGE.get('employees',[]);
  const getEmpName=(id)=>{const e=employees.find(x=>x.id===id);return e?e.name:'-';};
  let h='<table><thead><tr><th>'+t('crm_clientName')+'</th><th>'+t('crm_clientPhone')+'</th><th>'+t('crm_clientSource')+'</th><th>'+t('crm_clientStatus')+'</th><th>'+t('crm_stage')+'</th><th>'+t('crm_clientBudget')+'</th><th>'+t('crm_clientAssignedUser')+'</th><th>'+t('crm_clientLastContact')+'</th><th></th></tr></thead><tbody>';
  clients.forEach(c=>{
    const lastAct=getCrmActivities().filter(a=>a.clientId===c.id).sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
    const lastContact=lastAct?new Date(lastAct.date).toLocaleDateString('ar-EG'):'-';
    const assigneeUser=c.assignedUser?getUserByUsername(c.assignedUser):null;
    h+=`<tr>
      <td><strong>${c.name}</strong></td>
      <td>${c.phone||'-'}</td>
      <td><span class="badge badge-blue">${getCrmSourceLabel(c.source)}</span></td>
      <td><span class="crm-status-badge ${getCrmStatusClass(c.status)}">${getCrmStatusLabel(c.status)}</span></td>
      <td><span class="crm-stage-badge ${getCrmStageClass(c.stage||'fresh_leads')}">${getCrmStageLabel(c.stage||'fresh_leads')}</span></td>
      <td>${fmt(c.budget)}</td>
      <td>${assigneeUser?'<span class="badge badge-purple" style="font-size:11px">'+(assigneeUser.fullName||assigneeUser.username)+'</span>':'-'}</td>
      <td>${lastContact}</td>
      <td>
        <button class="btn btn-outline btn-sm" onclick="openCrmClientDetail('${c.id}')" title="${t('crm_history')}"><i class="fas fa-eye"></i></button>
        ${canEditCrm()?`<button class="btn btn-outline btn-sm" onclick="openCrmClientForm('${c.id}')" title="${t('edit')}"><i class="fas fa-pen"></i></button>`:''}
        ${canEditCrm()&&currentUser&&currentUser.role==='owner'?`<button class="btn btn-danger btn-sm" onclick="deleteCrmClient('${c.id}')" title="${t('delete')}"><i class="fas fa-trash"></i></button>`:''}
      </td>
    </tr>`;
  });
  h+='</tbody></table>';
  document.getElementById('crmTable').innerHTML=h;
}

function clearCrmFilters(){
  _crmTeamFilterUser='';
  ['crmFilterSearch','crmFilterSource','crmFilterStatus','crmFilterStage'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  filterCrmList();
}

function renderCrmPipeline(el){
  const clients=getVisibleClients();
  const employees=STORAGE.get('employees',[]);
  const getEmpName=(id)=>{const e=employees.find(x=>x.id===id);return e?e.name:'';};
  const statusColors={new:'#827148',contacted:'#eab308',negotiating:'#a855f7',converted:'#22c55e'};
  let h='<div class="crm-pipeline">';
  CRM_PIPELINE_STATUSES.forEach(s=>{
    const list=clients.filter(c=>c.status===s);
    h+=`<div class="crm-pipeline-col" ondragover="event.preventDefault()" ondrop="dropCrmCard(event,'${s}')">
      <div class="crm-pipeline-col-header">
        <h4 style="color:${statusColors[s]}"><i class="fas fa-circle" style="font-size:8px;margin-left:6px"></i> ${t('crm_status_'+s)}</h4>
        <span class="crm-pipeline-col-count">${list.length}</span>
      </div>`;
    list.forEach(c=>{
      h+=`<div class="crm-pipeline-card" draggable="true" ondragstart="dragCrmCard(event,'${c.id}')" onclick="openCrmClientDetail('${c.id}')">
        <h5>${c.name}</h5>
        <p>${c.phone?`<i class="fas fa-phone" style="margin-left:4px"></i> ${c.phone}`:''}</p>
        <p>${c.assignedTo?`<i class="fas fa-user" style="margin-left:4px"></i> ${getEmpName(c.assignedTo)}`:''}</p>
        ${c.budget?`<span class="crm-card-budget">${fmt(c.budget)}</span>`:''}
      </div>`;
    });
    h+='</div>';
  });
  h+='</div>';
  el.innerHTML=h;
}

let _dragCrmClientId=null;
function dragCrmCard(e,clientId){_dragCrmClientId=clientId;e.dataTransfer.effectAllowed='move';}
function dropCrmCard(e,newStatus){
  e.preventDefault();
  if(!_dragCrmClientId)return;
  const clients=getCrmClients();
  const c=clients.find(x=>x.id===_dragCrmClientId);
  if(c){
    const oldStatus=c.status;
    c.status=newStatus;
    saveCrmClients(clients);
    addCrmActivity(c.id,'status_changed',t('crm_status_'+oldStatus)+' → '+t('crm_status_'+newStatus));
    renderCrmStats();
    renderCrmPipeline(document.getElementById('crmContent'));
  }
  _dragCrmClientId=null;
}

function renderCrmTeam(el){
  const u=getUserByUsername(currentUser.username);
  if(!u){el.innerHTML='<div class="empty-state"><p>'+t('crm_noTeam')+'</p></div>';return;}
  const role=currentUser.role;
  const canManage=currentUser&&(currentUser.role==='owner'||currentUser.role==='super_admin');
  const clients=getVisibleClients();
  const allUsers=getAllUsers();
  const myTeamIds=getTeamUserIds(currentUser.username);
  const teamUsers=allUsers.filter(x=>myTeamIds.includes(x.username)&&x.username!==currentUser.username);
  const totalMembers=teamUsers.length;
  const directMembers=getDirectReports(currentUser.username).length;
  const activeClients=clients.filter(c=>CRM_PIPELINE_STATUSES.includes(c.status)).length;
  const newClients=clients.filter(c=>c.status==='new').length;
  const convertedClients=clients.filter(c=>c.status==='converted').length;

  let h=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px">
    <div class="card" style="border-left:4px solid var(--primary);text-align:center;padding:18px">
      <div style="font-size:26px;font-weight:800;color:var(--primary)">${totalMembers}</div>
      <div style="color:var(--text-light);font-size:12px">${t('crm_teamTotalMembers')}</div>
    </div>
    <div class="card" style="border-left:4px solid var(--accent);text-align:center;padding:18px">
      <div style="font-size:26px;font-weight:800;color:var(--accent)">${directMembers}</div>
      <div style="color:var(--text-light);font-size:12px">${t('crm_teamDirectReports')}</div>
    </div>
    <div class="card" style="border-left:4px solid #C4A830;text-align:center;padding:18px">
      <div style="font-size:26px;font-weight:800;color:var(--success)">${clients.length}</div>
      <div style="color:var(--text-light);font-size:12px">${t('crm_teamClients')}</div>
    </div>
    <div class="card" style="border-left:4px solid var(--info);text-align:center;padding:18px">
      <div style="font-size:26px;font-weight:800;color:var(--info)">${activeClients}</div>
      <div style="color:var(--text-light);font-size:12px">${t('crm_teamActiveClients')}</div>
    </div>
    <div class="card" style="border-left:4px solid var(--warning);text-align:center;padding:18px">
      <div style="font-size:26px;font-weight:800;color:var(--warning)">${newClients}</div>
      <div style="color:var(--text-light);font-size:12px">${t('crm_teamNewClients')}</div>
    </div>
    <div class="card" style="border-left:4px solid var(--secondary);text-align:center;padding:18px">
      <div style="font-size:26px;font-weight:800;color:var(--secondary)">${convertedClients}</div>
      <div style="color:var(--text-light);font-size:12px">${t('crm_teamConverted')}</div>
    </div>
  </div>`;

  function buildTree(parentId,depth,accentColor){
    const children=allUsers.filter(x=>x.parentId===parentId&&myTeamIds.includes(x.username));
    if(!children.length) return '';
    let tree='';
    children.forEach(child=>{
      const childClients=clients.filter(c=>(c.assignedUser||'')===child.username);
      const childTeamIds=getTeamUserIds(child.username);
      const grandKids=allUsers.filter(x=>x.parentId===child.username&&myTeamIds.includes(x.username));
      const indent=depth*24;
      const borderColor=depth===0?accentColor:depth===1?'var(--accent)':'var(--info)';
      tree+=`<div style="display:flex;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);margin-left:${indent}px;border-left:3px solid ${borderColor};background:${depth===0?'rgba(14,113,255,0.03)':'transparent'}">
        <div style="width:34px;height:34px;border-radius:50%;background:${accentColor};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;margin-left:10px;flex-shrink:0">${(child.fullName||child.username).charAt(0)}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:13px">${child.fullName||child.username}</div>
          <div style="font-size:11px;color:var(--text-light)">${t(child.role)} &bull; ${child.username}</div>
        </div>
        <div style="display:flex;gap:6px;align-items:center;flex-shrink:0">
          <span class="badge badge-blue" style="font-size:10px">${childClients.length} ${t('crm_teamClients')}</span>
          ${grandKids.length?`<span class="badge badge-purple" style="font-size:10px">${grandKids.length} ${lang==='ar'?'مباشر':'direct'}</span>`:''}
          <button class="btn btn-outline btn-sm" onclick="filterTeamClient('${child.username}')" title="${lang==='ar'?'عرض العملاء':'View Clients'}"><i class="fas fa-eye"></i></button>
          ${canManage?`<button class="btn btn-outline btn-sm" onclick="openEditTeamMember('${child.username}')" title="${t('crm_teamEdit')}"><i class="fas fa-pen"></i></button>`:''}
        </div>
      </div>`;
      tree+=buildTree(child.username,depth+1,accentColor);
    });
    return tree;
  }

  function buildSection(title,icon,rootUser,accentColor,rootClientId){
    const rootClients=clients.filter(c=>(c.assignedUser||'')===rootUser.username);
    const sectionTeamIds=getTeamUserIds(rootUser.username);
    const sectionUsers=allUsers.filter(x=>sectionTeamIds.includes(x.username)&&x.username!==rootUser.username);
    const sectionClientCount=clients.filter(c=>sectionTeamIds.includes(c.assignedUser||'')).length;
    return `<div class="card" style="margin-bottom:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:2px solid ${accentColor};background:linear-gradient(135deg,${accentColor}08,${accentColor}03)">
        <div style="display:flex;align-items:center;gap:10px">
          <i class="fas ${icon}" style="color:${accentColor};font-size:18px"></i>
          <h3 style="margin:0;font-size:16px">${title}</h3>
          <span class="badge" style="background:${accentColor};color:#fff;font-size:11px">${sectionUsers.length+1} ${lang==='ar'?'عضو':'members'}</span>
          <span class="badge badge-blue" style="font-size:11px">${sectionClientCount} ${t('crm_teamClients')}</span>
        </div>
        ${canManage?`<button class="btn btn-primary btn-sm" onclick="openAddTeamMember('${rootUser.username}')"><i class="fas fa-plus"></i> ${t('crm_teamAddMember')}</button>`:''}
      </div>
      <div style="padding:6px 0">
        <div style="display:flex;align-items:center;padding:10px 16px;border-bottom:1px solid ${accentColor};background:${accentColor};color:#fff;font-weight:700">
          <div style="width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;margin-left:10px">${(rootUser.fullName||rootUser.username).charAt(0)}</div>
          <div style="flex:1">
            <div style="font-weight:700;font-size:13px">${rootUser.fullName||rootUser.username}</div>
            <div style="font-size:11px;opacity:0.8">${t(rootUser.role)} &bull; ${sectionClientCount} ${t('crm_teamClients')}</div>
          </div>
          ${canManage?`<button class="btn btn-sm" style="background:rgba(255,255,255,0.2);color:#fff;border:none" onclick="openEditTeamMember('${rootUser.username}')" title="${t('crm_teamEdit')}"><i class="fas fa-pen"></i></button>`:''}
        </div>
        ${buildTree(rootUser.username,0,accentColor)}
      </div>
    </div>`;
  }

  const salesRoots=allUsers.filter(x=>(x.role==='head_of_sales'||isSalesSide(x.role))&&myTeamIds.includes(x.username)&&!x.parentId);
  const marketingRoots=allUsers.filter(x=>(x.role==='md'||isMarketingSide(x.role))&&myTeamIds.includes(x.username)&&!x.parentId);

  if(salesRoots.length){
    salesRoots.forEach((root,i)=>{
      h+=buildSection(t('crm_teamSales'),' fa-chart-line',root,'#e74c3c','sales_'+i);
    });
  }

  if(marketingRoots.length){
    marketingRoots.forEach((root,i)=>{
      h+=buildSection(t('crm_teamMarketing'),' fa-bullhorn',root,'#9b59b6','marketing_'+i);
    });
  }

  if(!salesRoots.length&&!marketingRoots.length){
    h+=`<div class="card" style="text-align:center;padding:40px"><i class="fas fa-users" style="font-size:48px;color:var(--border);margin-bottom:16px"></i><p style="color:var(--text-light)">${t('crm_noTeam')}</p></div>`;
  }

  el.innerHTML=h;
}

function filterTeamClient(username){
  _crmTeamFilterUser=username;
  const el=document.getElementById('crmContent');
  renderCrmList(el);
}

function openEditTeamMember(username){
  const u=getUserByUsername(username);
  if(!u) return;
  const allUsers=getAllUsers();
  const salesSide=['owner','head_of_sales','sm','tl'];
  const marketingSide=['owner','md','ma'];
  const isSales=isSalesSide(u.role);
  const parentOptions=allUsers.filter(p=>p.username!==username&&(isSales?salesSide.includes(p.role):marketingSide.includes(p.role))).map(p=>`<option value="${p.username}" ${u.parentId===p.username?'selected':''}>${p.fullName||p.username} (${t(p.role)})</option>`).join('');
  const roleOpts=(isSales?['head_of_sales','sm','tl','sales']:['md','ma','marketer']).map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${t(r)}</option>`).join('');

  document.getElementById('modalContainer').innerHTML=`
    <h3><i class="fas fa-pen" style="color:var(--primary);margin-left:8px"></i> ${t('crm_teamEditMember')}: ${u.fullName||u.username}</h3>
    <div class="form-row">
      <div class="form-group"><label>${t('settings_fullName')}</label><input type="text" id="teamEditName" value="${u.fullName||''}"></div>
      <div class="form-group"><label>${t('settings_username')}</label><input type="text" value="${u.username}" disabled style="opacity:.6"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Email</label><input type="email" id="teamEditEmail" value="${u.email||u.username+'@marts-eg.com'}"></div>
      <div class="form-group"><label>${t('crm_acc_role')}</label><select id="teamEditRole">${roleOpts}</select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>${t('crm_teamParent')}</label><select id="teamEditParent"><option value="">--</option>${parentOptions}</select></div>
      <div class="form-group"><label>${t('settings_password')} (${lang==='ar'?'اتركه فارغاً لعدم التغيير':'leave empty to keep'})</label><input type="password" id="teamEditPass"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="saveEditTeamMember('${username}')"><i class="fas fa-save"></i> ${t('crm_teamSave')}</button>
      <button class="btn btn-danger btn-sm" onclick="deleteTeamMember('${username}')"><i class="fas fa-trash"></i> ${t('crm_teamDeleteMember')}</button>
      <button class="btn btn-outline" onclick="closeModal()">${t('crm_teamCancel')}</button>
    </div>`;
  document.getElementById('modalContainer').style.width='600px';
  document.getElementById('modalOverlay').classList.add('active');
}

function saveEditTeamMember(username){
  const users=getAllUsers();
  const idx=users.findIndex(u=>u.username===username);
  if(idx<0) return;
  users[idx].fullName=document.getElementById('teamEditName').value.trim();
  users[idx].email=document.getElementById('teamEditEmail').value.trim()||username+'@marts-eg.com';
  users[idx].role=document.getElementById('teamEditRole').value;
  users[idx].parentId=document.getElementById('teamEditParent').value;
  const newPass=document.getElementById('teamEditPass').value;
  if(newPass&&newPass.length>=4) users[idx].password=newPass;
  STORAGE.set('users',users);
  closeModal();
  const el=document.getElementById('crmAccContent');
  if(el) renderCrmTeam(el);
}

function deleteTeamMember(username){
  if(!confirm(t('crm_teamConfirmDelete'))) return;
  let users=getAllUsers();
  users=users.filter(u=>u.username!==username);
  STORAGE.set('users',users);
  closeModal();
  const el=document.getElementById('crmAccContent');
  if(el) renderCrmTeam(el);
}

function openAddTeamMember(parentUsername){
  const parent=getUserByUsername(parentUsername);
  if(!parent) return;
  const isSales=isSalesSide(parent.role)||parent.role==='head_of_sales';
  const childRoles=isSales?['sm','tl','sales']:['ma','marketer'];
  const roleOpts=childRoles.map(r=>`<option value="${r}">${t(r)}</option>`).join('');

  document.getElementById('modalContainer').innerHTML=`
    <h3><i class="fas fa-user-plus" style="color:var(--primary);margin-left:8px"></i> ${t('crm_teamAddNewMember')} ${lang==='ar'?'إلى':'to'} ${parent.fullName||parent.username}</h3>
    <div class="form-row">
      <div class="form-group"><label>${t('settings_fullName')} *</label><input type="text" id="teamNewName"></div>
      <div class="form-group"><label>${t('settings_username')} *</label><input type="text" id="teamNewUser"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Email</label><input type="email" id="teamNewEmail" placeholder="user@marts-eg.com"></div>
      <div class="form-group"><label>${t('settings_password')} *</label><input type="password" id="teamNewPass"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>${t('crm_acc_role')}</label><select id="teamNewRole">${roleOpts}</select></div>

      <button class="btn btn-primary" onclick="saveAddTeamMember('${parentUsername}')"><i class="fas fa-save"></i> ${t('crm_teamSave')}</button>
      <button class="btn btn-outline" onclick="closeModal()">${t('crm_teamCancel')}</button>
    </div>`;
  document.getElementById('modalContainer').style.width='600px';
  document.getElementById('modalOverlay').classList.add('active');
}

function saveAddTeamMember(parentUsername){
  const username=document.getElementById('teamNewUser').value.trim();
  const password=document.getElementById('teamNewPass').value;
  const fullName=document.getElementById('teamNewName').value.trim();
  if(!username||!password||!fullName){ alert(lang==='ar'?'أدخل جميع الحقول المطلوبة':'Fill all required fields'); return; }
  const users=getAllUsers();
  if(users.find(u=>u.username===username)){ alert(lang==='ar'?'اسم المستخدم موجود مسبقاً':'Username already exists'); return; }
  const role=document.getElementById('teamNewRole').value;
  const email=document.getElementById('teamNewEmail').value.trim()||username+'@marts-eg.com';
  let defaultPerms=[];
  if(role==='sm') defaultPerms=DEFAULT_PERMS_SALES_MANAGER;
  else if(role==='tl') defaultPerms=DEFAULT_PERMS_TEAM_LEADER;
  else if(role==='sales') defaultPerms=DEFAULT_PERMS_SALES;
  else if(role==='md') defaultPerms=DEFAULT_PERMS_MARKETING_DIRECTOR;
  else if(role==='ma') defaultPerms=DEFAULT_PERMS_MARKETING_ASSISTANT;
  else if(role==='marketer') defaultPerms=DEFAULT_PERMS_MARKETER;
  users.push({username,password,role,fullName,email,permissions:defaultPerms,parentId:parentUsername});
  STORAGE.set('users',users);
  closeModal();
  const el=document.getElementById('crmAccContent');
  if(el) renderCrmTeam(el);
}

function renderCrmAccounts(el){

  const withAccounts=clients.filter(c=>c.trialAccount);
  const withoutAccounts=clients.filter(c=>!c.trialAccount);

        <div class="crm-acc-info">
          <h5>${c.name}</h5>
          <p><i class="fas fa-envelope" style="margin-left:4px;color:var(--primary)"></i> ${c.trialEmail}</p>
          <p><i class="fas fa-key" style="margin-left:4px;color:var(--text-light)"></i> <span style="font-family:monospace">${c.trialPassword}</span></p>
        </div>
        <span class="crm-account-card crm-acc-status crm-acc-active">${t('crm_accountActive')}</span>

    withoutAccounts.forEach(c=>{
      h+=`<div class="crm-account-card">
        <div class="crm-acc-avatar" style="background:var(--border);color:var(--text-light)">${c.name.charAt(0)}</div>
        <div class="crm-acc-info"><h5>${c.name}</h5><p>${c.phone||c.email||'-'}</p></div>
        <button class="btn btn-primary btn-sm" onclick="generateCrmTrialAccount('${c.id}')"><i class="fas fa-magic"></i> ${t('crm_generateAccount')}</button>

  if(!clients.length) h+='<div class="empty-state"><p>'+t('crm_noClients')+'</p></div>';
  h+='</div>';
  el.innerHTML=h;

function generateCrmTrialAccount(clientId){
  const clients=getCrmClients();
  const c=clients.find(x=>x.id===clientId);
  if(!c)return;
  c.trialEmail=generateTrialEmail(c.name);
  c.trialPassword=generateTrialPassword();
  c.trialAccount='active';
  c.trialCreated=new Date().toISOString();
  saveCrmClients(clients);
  addCrmActivity(c.id,'account_created',t('crm_accountGenerated')+': '+c.trialEmail);
  alert(t('crm_accountGenerated')+':\n'+t('crm_accountEmail')+': '+c.trialEmail+'\n'+t('crm_accountPassword')+': '+c.trialPassword);
  switchCrmTab('accounts',document.querySelectorAll('.crm-tab')[2]);
}

function saveCrmClient(clientId){
  const name=document.getElementById('crm_name').value.trim();
  if(!name)return alert('!');
  const clients=getCrmClients();
  const data={
    name,phone:document.getElementById('crm_phone').value.trim(),
    email:document.getElementById('crm_email').value.trim(),
    nationalId:document.getElementById('crm_nationalId').value.trim(),
    source:document.getElementById('crm_source').value,
    status:document.getElementById('crm_status').value,
    stage:document.getElementById('crm_stage')?.value||'fresh_leads',
    budget:document.getElementById('crm_budget').value,
    assignedTo:document.getElementById('crm_assigned').value,
    assignedUser:document.getElementById('crm_assignedUser')?.value||'',
    preferredProject:document.getElementById('crm_prefProject').value,
    preferredUnit:document.getElementById('crm_prefUnit')?.value?.trim()||'',
    address:document.getElementById('crm_address').value.trim(),
    nextFollowUp:document.getElementById('crm_nextFollowUp').value,
    notes:document.getElementById('crm_notes').value.trim(),
    campaignName:document.getElementById('crm_campaignName')?.value?.trim()||''
  };
  if(clientId){
    const idx=clients.findIndex(c=>c.id===clientId);
    if(idx>=0){
      Object.assign(clients[idx],data);
      addCrmActivity(clientId,'updated',t('edit'));
    }
  } else {
    data.id='c_'+Date.now();
    data.date=new Date().toISOString().split('T')[0];
    data.lastContact=new Date().toISOString();
    if(!data.assignedUser && currentUser){
      const cu=getUserByUsername(currentUser.username);
      if(cu && ['sales','tl','sm','marketer','ma','md'].includes(cu.role)){
        data.assignedUser=currentUser.username;
      }
    }
    clients.push(data);
    addCrmActivity(data.id,'created',t('crm_addClient'));
  }
  saveCrmClients(clients);
  closeModal();
  renderCrmStats();
  switchCrmTab('list',document.querySelector('.crm-tab'));
}

function deleteCrmClient(clientId){
  if(!confirm(t('crm_deleteConfirm')))return;
  let clients=getCrmClients();
  clients=clients.filter(c=>c.id!==clientId);
  saveCrmClients(clients);
  let acts=getCrmActivities();
  acts=acts.filter(a=>a.clientId!==clientId);
  saveCrmActivities(acts);
  renderCrmStats();
  switchCrmTab('list',document.querySelector('.crm-tab'));
}

function logCrmActivity(clientId,type){
  const labels={call:t('crm_call'),meeting:t('crm_meeting'),email:t('crm_email')};
  const desc=prompt(t('crm_addNote')+': '+labels[type]);
  if(desc===null)return;
  addCrmActivity(clientId,type,labels[type]+': '+(desc||''));
  const clients=getCrmClients();
  const c=clients.find(x=>x.id===clientId);
  if(c) c.lastContact=new Date().toISOString();
  saveCrmClients(clients);
  openCrmClientDetail(clientId);
}

function changeCrmStatus(clientId,newStatus){
  const clients=getCrmClients();
  const c=clients.find(x=>x.id===clientId);
  if(c){
    const oldStatus=c.status;
    c.status=newStatus;
    c.lastContact=new Date().toISOString();
    saveCrmClients(clients);
    addCrmActivity(clientId,'status_changed',t('crm_status_'+oldStatus)+' → '+t('crm_status_'+newStatus));
  }
  openCrmClientDetail(clientId);
  renderCrmStats();
}

function renderCrmAccountsTable(filter){
  const ft = (filter||'').toLowerCase();
  const allUsers = STORAGE.get('users',defaultUsers);
  const crmPerms = ['crm_view','crm_add','crm_edit','crm_delete','crm_manage_accounts'];
  const crmUsers = allUsers.filter(u=>{
    const p = u.permissions||[];
    return crmPerms.some(cp=>p.includes(cp));
  });
  const filtered = ft ? crmUsers.filter(u=>(u.username||'').toLowerCase().includes(ft)||(u.fullName||'').toLowerCase().includes(ft)||(u.email||'').toLowerCase().includes(ft)) : crmUsers;

  let h = '<table><thead><tr><th>'+t('crm_acc_username')+'</th><th>'+t('crm_acc_name')+'</th><th>'+t('crm_acc_email')+'</th><th>'+t('crm_acc_role')+'</th><th>'+t('crm_acc_perms')+'</th><th>'+t('crm_acc_actions')+'</th></tr></thead><tbody>';

  if(filtered.length===0){
    h += '<tr><td colspan="6" style="text-align:center;color:var(--text-light);padding:32px">'+t('crm_acc_noAccounts')+'</td></tr>';
  }

  filtered.forEach((u)=>{
    const origIdx = allUsers.indexOf(u);
    const p = u.permissions||[];
    const email = u.email || u.username+'@marts-eg.com';
    const permBadges = [];
    if(p.includes('crm_view')) permBadges.push('<span class="badge badge-green" style="font-size:10px">'+t('crm_acc_view')+'</span>');
    if(p.includes('crm_add')) permBadges.push('<span class="badge badge-blue" style="font-size:10px">'+t('crm_acc_add_perm')+'</span>');
    if(p.includes('crm_edit')) permBadges.push('<span class="badge badge-yellow" style="font-size:10px">'+t('crm_acc_edit_perm')+'</span>');
    if(p.includes('crm_delete')) permBadges.push('<span class="badge badge-red" style="font-size:10px">'+t('crm_acc_delete_perm')+'</span>');
    if(p.includes('crm_manage_accounts')) permBadges.push('<span class="badge badge-purple" style="font-size:10px">'+t('crm_acc_manage_accounts')+'</span>');

    h += `<tr>
      <td><strong>${u.username}</strong></td>
      <td>${u.fullName||''}</td>
      <td style="font-size:12px;color:var(--text-light)">${email}</td>
      <td><span class="badge badge-blue">${t(u.role)}</span></td>
      <td>${permBadges.join(' ')}</td>
      <td style="display:flex;gap:6px">
        <button class="btn btn-outline btn-sm" onclick="openCrmAccountEdit(${origIdx})"><i class="fas fa-pen"></i></button>
        <button class="btn btn-outline btn-sm" onclick="openCrmAccountPerms(${origIdx})"><i class="fas fa-shield-alt"></i></button>
        ${u.username!=='owner'&&u.username!=='ali.admin'?`<button class="btn btn-danger btn-sm" onclick="deleteCrmAccount(${origIdx})"><i class="fas fa-trash"></i></button>`:''}
      </td>
    </tr>`;
  });
  h += '</tbody></table>';
  document.getElementById('crmAccTable').innerHTML = h;
}

function filterCrmAccounts(){
  const q = document.getElementById('crmAccSearch').value;
  renderCrmAccountsTable(q);
}

function saveIntegConfig(platformId){
  let configs = getIntegrations();
  const idx = configs.findIndex(c=>c.platformId===platformId);
  const enabled = document.querySelector('.integ-card .toggle.on')?.classList.contains('on') || false;
  const autoSync = document.getElementById('integAutoSync')?.classList.contains('on') || false;

  const data = {
    platformId,
    enabled,
    apiKey: document.getElementById('integ_apiKey')?.value || '',
    accessToken: document.getElementById('integ_token')?.value || '',
    accountId: document.getElementById('integ_accountId')?.value || '',
    adAccountId: document.getElementById('integ_adAccountId')?.value || '',
    webhookUrl: `https://marts-eg.com/webhook/${platformId}`,
    autoSync,
    syncInterval: parseInt(document.getElementById('integ_interval')?.value) || 30,
    fieldMapping: {
      name: document.getElementById('integ_map_name')?.value || 'full_name',
      phone: document.getElementById('integ_map_phone')?.value || 'phone_number',
      email: document.getElementById('integ_map_email')?.value || 'email',
      campaign: document.getElementById('integ_map_campaign')?.value || 'campaign_name'
    },
    lastSync: idx>=0?configs[idx].lastSync:null,
    syncCount: idx>=0?configs[idx].syncCount:0,
    syncLog: idx>=0?(configs[idx].syncLog||[]):[]
  };

  if(idx>=0) configs[idx] = {...configs[idx], ...data};
  else configs.push(data);

  saveIntegrations(configs);
  closeModal();
  renderIntegCards();
}

function testIntegConnection(platformId){
  const cfg = getIntegConfig(platformId);
  if(!cfg.apiKey && !cfg.accessToken){
    alert(t('integ_connectionFailed') + ': ' + (lang==='ar'?'أدخل مفتاح API أو Token':'Enter API Key or Token'));
    return;
  }
  // Simulate connection test
  const platform = AD_PLATFORMS.find(p=>p.id===platformId);
  alert(t('integ_connectionSuccess') + '\n' + platform.name + '\n' + (lang==='ar'?'تم اختبار الاتصال بنجاح':'Connection test successful'));
}

function syncIntegLeads(platformId){
  const cfg = getIntegConfig(platformId);
  const platform = AD_PLATFORMS.find(p=>p.id===platformId);
  if(!cfg || (!cfg.apiKey && !cfg.accessToken)){
    alert(lang==='ar'?'قم بربط الحساب أولاً':'Connect the account first');
    return;
  }

  // Simulate API sync
  const now = new Date();
  const logEntry = {
    date: now.toISOString().slice(0,10),
    time: now.toTimeString().slice(0,5),
    count: Math.floor(Math.random()*15)+1,
    status: 'success'
  };

  let configs = getIntegrations();
  configs = configs.map(c => {
    if(c.platformId === platformId){
      c.lastSync = now.toISOString().slice(0,10);
      c.syncCount = (c.syncCount||0) + logEntry.count;
      c.syncLog = [...(c.syncLog||[]), logEntry];
    }
    return c;
  });
  saveIntegrations(configs);

  alert(`${platform.name}\n${t('integ_synced')}: ${logEntry.count}`);
  renderIntegCards();
}

function handleIntegImport(event, platformId){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const wb = XLSX.read(e.target.result, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(ws);

      const platform = AD_PLATFORMS.find(p=>p.id===platformId);
      const cfg = getIntegConfig(platformId);
      const mapping = cfg.fieldMapping || {name:'full_name',phone:'phone_number',email:'email',campaign:'campaign_name'};

      const clients = getCrmClients();
      let imported = 0, duplicated = 0;

      data.forEach(row => {
        const name = row[mapping.name] || row['full_name'] || row['customer_name'] || row['name'] || '';
        const phone = String(row[mapping.phone] || row['phone_number'] || row['phone'] || row['mobile'] || '');
        const email = row[mapping.email] || row['email'] || row['email_address'] || '';
        const campaign = row[mapping.campaign] || row['campaign_name'] || row['campaign'] || '';

        if(!name && !phone && !email) return;

        // Check duplicate by phone or email
        const isDuplicate = clients.some(c =>
          (phone && c.phone === phone) || (email && c.email === email && email !== '')
        );
        if(isDuplicate) { duplicated++; return; }

        const newClient = {
          id: 'c_' + Date.now() + '_' + Math.random().toString(36).substr(2,4),
          name: String(name).trim(),
          phone: phone.trim(),
          email: String(email).trim(),
          source: platformId,
          status: 'new',
          budget: '',
          assignedTo: '',
          preferredProject: '',
          preferredUnit: '',
          address: '',
          nextFollowUp: '',
          notes: campaign ? t('integ_campaignName') + ': ' + campaign : '',
          date: new Date().toISOString().split('T')[0],
          lastContact: new Date().toISOString(),
          campaignName: String(campaign).trim(),
          adPlatform: platformId
        };

        clients.push(newClient);
        addCrmActivity(newClient.id, 'created', t('crm_addClient') + ' (' + platformId + ')');
        imported++;
      });

      saveCrmClients(clients);

      // Update sync count
      let configs = getIntegrations();
      configs = configs.map(c => {
        if(c.platformId === platformId){
          c.lastSync = new Date().toISOString().slice(0,10);
          c.syncCount = (c.syncCount||0) + imported;
          c.syncLog = [...(c.syncLog||[]), {
            date: new Date().toISOString().slice(0,10),
            time: new Date().toTimeString().slice(0,5),
            count: imported,
            status: 'success'
          }];
        }
        return c;
      });
      saveIntegrations(configs);

      let msg = t('integ_importSuccess') + ': ' + imported;
      if(duplicated > 0) msg += '\n' + t('integ_duplicated') + ': ' + duplicated;
      alert(msg);
      closeModal();
      renderIntegCards();
    } catch(err) {
      alert(t('integ_importError') + ': ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
  event.target.value = '';
}

function downloadIntegTemplate(platformId){
  const platform = AD_PLATFORMS.find(p=>p.id===platformId);
  const headers = platform.fields;
  const sampleRow = headers.map((f,i) => {
    if(f.includes('name')) return lang==='ar'?'أحمد محمد':'Ahmed Mohamed';
    if(f.includes('phone')) return '01012345678';
    if(f.includes('email')) return 'lead@example.com';
    if(f.includes('campaign')) return lang==='ar'?'حملة Q1 2026':'Q1 2026 Campaign';
    if(f.includes('ad')) return lang==='ar'?'إعلان 1':'Ad 1';
    if(f.includes('set')) return lang==='ar'?'مجموعة الإعلانات 1':'Ad Set 1';
    if(f.includes('time')||f.includes('date')) return new Date().toISOString().slice(0,10);
    return '';
  });
  const ws = XLSX.utils.aoa_to_sheet([headers, sampleRow, sampleRow.map((v,i)=>headers[i]==='full_name'?(lang==='ar'?'سارة أحمد':'Sara Ahmed'):headers[i]==='phone_number'?'01098765432':v)]);
  ws['!cols'] = headers.map(()=>({wch:20}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,platform.name);
  XLSX.writeFile(wb,'marts_'+platformId+'_leads_template.xlsx');
}

let _integSyncTimers = {};

function previewAvatar(inputId,previewId){
  const inp=document.getElementById(inputId);const prev=document.getElementById(previewId);
  if(inp.files&&inp.files[0]){
    const r=new FileReader();
    r.onload=function(e){resizeImage(e.target.result,200,function(resized){prev.innerHTML='<img src="'+resized+'" alt="avatar">';});};
    r.readAsDataURL(inp.files[0]);
  }
}
function resizeImage(dataUrl,maxSize,cb){
  const img=new Image();
  img.onload=function(){
    const c=document.createElement('canvas');
    const ratio=Math.min(maxSize/img.naturalWidth,maxSize/img.naturalHeight,1);
    c.width=img.naturalWidth*ratio;c.height=img.naturalHeight*ratio;
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const result=c.toDataURL('image/jpeg',0.7);
    if(cb)cb(result);else return result;
  };
  img.src=dataUrl;
}

function saveEditUser(idx) {
  const users = STORAGE.get('users',defaultUsers);
  users[idx].fullName = document.getElementById('editFullName').value.trim();
  users[idx].role = document.getElementById('editRole').value;
  users[idx].email = document.getElementById('editEmail').value.trim() || users[idx].username+'@marts-eg.com';
  const newPass = document.getElementById('editPass').value;
  if(newPass && newPass.length>=4) users[idx].password = newPass;
  const fileInput=document.getElementById('editUserAvatarFile');
  if(fileInput&&fileInput.files&&fileInput.files[0]){
    const reader=new FileReader();
    reader.onload=function(e){
      resizeImage(e.target.result,200,function(resized){
        users[idx].avatar=resized;
        STORAGE.set('users',users);
        if(currentUser&&users[idx].username===currentUser.username){currentUser.avatar=users[idx].avatar;STORAGE.set('currentUser',currentUser);}
        closeModal();renderSettings(document.getElementById('mainContent'));
      });
    };
    reader.readAsDataURL(fileInput.files[0]);
  } else {
    STORAGE.set('users',users);
    if(currentUser&&users[idx].username===currentUser.username){currentUser.fullName=users[idx].fullName;currentUser.role=users[idx].role;STORAGE.set('currentUser',currentUser);}
    closeModal();renderSettings(document.getElementById('mainContent'));
  }
}
function removeEditUserAvatar(idx){

function saveUser() {
  const username = document.getElementById('u_user').value.trim();
  const password = document.getElementById('u_pass').value;
  if(!username||!password) return;
  const users = STORAGE.get('users',defaultUsers);
  if(users.find(u=>u.username===username)) return;
  const role = document.getElementById('u_role').value;
  const email = document.getElementById('u_email').value.trim() || username+'@marts-eg.com';
  let defaultPerms = [];
  if(role==='owner') defaultPerms = DEFAULT_PERMS_OWNER;
  else if(role==='super_admin') defaultPerms = DEFAULT_PERMS_SUPER_ADMIN;
  else if(role==='head_of_sales') defaultPerms = DEFAULT_PERMS_HEAD_OF_SALES;
  else if(role==='sm') defaultPerms = DEFAULT_PERMS_SALES_MANAGER;
  else if(role==='tl') defaultPerms = DEFAULT_PERMS_TEAM_LEADER;
  else if(role==='sales') defaultPerms = DEFAULT_PERMS_SALES;
  else if(role==='md') defaultPerms = DEFAULT_PERMS_MARKETING_DIRECTOR;
  else if(role==='ma') defaultPerms = DEFAULT_PERMS_MARKETING_ASSISTANT;
  else if(role==='marketer') defaultPerms = DEFAULT_PERMS_MARKETER;
  else if(role==='operations') defaultPerms = DEFAULT_PERMS_OPERATIONS;
  else if(role==='accounting') defaultPerms = DEFAULT_PERMS_ACCOUNTING;
  users.push({username,password,role,fullName:document.getElementById('u_fullName').value.trim(),email,permissions:defaultPerms});
  STORAGE.set('users',users); closeModal(); renderSettings(document.getElementById('mainContent'));
}

function deleteUser(idx) {
  if(!confirm(t('confirm_delete'))) return;
  let users = STORAGE.get('users',defaultUsers);
  if(users[idx]&&users[idx].username==='owner') { alert(t('settings_cannotDeleteOwner')); return; }
  users.splice(idx,1); STORAGE.set('users',users);
  renderSettings(document.getElementById('mainContent'));
}

function exportAllData() {
  const data = {};
  ['users','employees','sales','treasury','salaries','partners','expenses','lang'].forEach(k=>{data[k]=STORAGE.get(k);});
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  saveAs(blob,'marts_backup_'+today()+'.json');
}

function importData(event) {
  const file = event.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      Object.keys(data).forEach(k=>{ if(data[k]!==undefined&&data[k]!==null) STORAGE.set(k,data[k]); });
      renderPage(currentPage);
    } catch(err) { alert('Import failed'); }
  };
  reader.readAsText(file); event.target.value='';
}

function clearAllData() {
  if(!confirm(t('confirm_delete'))) return;
  const lg = STORAGE.get('lang','ar');
  safeStorage.clear(); STORAGE.set('lang',lg);
  initData(); buildSidebar(); renderPage(currentPage);
}

function dealsExport(){
  const rows = document.querySelectorAll('.deals-table tbody tr');
  if(!rows.length){
    const toast = document.createElement('div');
    toast.style.cssText = 'position:fixed;top:24px;left:50%;transform:translateX(-50%);background:var(--crm-warning);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:10001';
    toast.textContent = lang==='ar'?'لا توجد بيانات للتصدير':'No data to export';
    document.body.appendChild(toast);
    setTimeout(()=>toast.remove(), 2000);
    return;
  }
  let csv = '\uFEFF';
  const headers = [];
  document.querySelectorAll('.deals-table thead th').forEach(th => headers.push(th.textContent.trim()));
  csv += headers.join(',') + '\n';
  rows.forEach(tr => {
    const cells = [];
    tr.querySelectorAll('td').forEach(td => cells.push('"'+td.textContent.trim().replace(/"/g,'""')+'"'));
    csv += cells.join(',') + '\n';
  });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'deals_export_' + new Date().toISOString().split('T')[0] + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;top:24px;left:50%;transform:translateX(-50%);background:var(--crm-success);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:10001';
  toast.innerHTML = '<i class="fas fa-download" style="margin-left:6px"></i>' + (lang==='ar'?'تم التصدير':'Exported');
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(), 2000);
}

// AI ASSISTANT (Ollama)
// ============================================================
let aiChatOpen = false;
let aiSending = false;

function toggleAiChat() {
  aiChatOpen = !aiChatOpen;
  document.getElementById('aiChatPanel').style.display = aiChatOpen ? 'flex' : 'none';
  if(aiChatOpen) { document.getElementById('aiInput').focus(); loadAiChatHistory(); }
}

function getAiSettings() { return STORAGE.get('ollamaSettings', {url:'http://localhost:11434', model:'llama3.2', enabled:true}); }
function saveAiSettings(s) { STORAGE.set('ollamaSettings', s); }
function getAiChatHistory() { return STORAGE.get('aiChatHistory', []); }
function saveAiChatHistory(h) { STORAGE.set('aiChatHistory', h); }

function loadAiChatHistory() {
  const history = getAiChatHistory();
  const container = document.getElementById('aiChatMessages');
  if(history.length === 0) {
    container.innerHTML = `<div class="ai-msg ai-bot"><div class="ai-msg-content">${t('ai_welcome')}</div></div>`;
    return;
  }
  container.innerHTML = '';
  history.forEach(msg => {
    const div = document.createElement('div');
    div.className = 'ai-msg ' + (msg.role === 'user' ? 'ai-user' : 'ai-bot');
    div.innerHTML = `<div class="ai-msg-content">${formatAiMessage(msg.content)}</div>`;
    container.appendChild(div);
  });
  container.scrollTop = container.scrollHeight;
}

function formatAiMessage(text) {
  return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
}

function addAiMessage(content, role) {
  const container = document.getElementById('aiChatMessages');
  const div = document.createElement('div');
  div.className = 'ai-msg ' + (role === 'user' ? 'ai-user' : 'ai-bot');
  div.innerHTML = `<div class="ai-msg-content">${formatAiMessage(content)}</div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  const history = getAiChatHistory();
  history.push({role, content});
  if(history.length > 50) history.splice(0, history.length - 50);
  saveAiChatHistory(history);
}

function showAiTyping() {
  const container = document.getElementById('aiChatMessages');
  const div = document.createElement('div');
  div.className = 'ai-msg ai-bot';
  div.id = 'aiTyping';
  div.innerHTML = `<div class="ai-msg-content"><div class="ai-typing"><span></span><span></span><span></span></div></div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function removeAiTyping() {
  const el = document.getElementById('aiTyping');
  if(el) el.remove();
}

function clearAiChat() {
  if(!confirm(lang==='ar'?'هل تريد مسح المحادثة؟':'Clear chat history?')) return;
  saveAiChatHistory([]);
  loadAiChatHistory();
}

function buildAiSystemPrompt() {
  if(!currentUser) return '';
  const employees = STORAGE.get('employees', []);
  const sales = STORAGE.get('sales', []);
  const treasury = STORAGE.get('treasury', []);
  const expenses = STORAGE.get('expenses', []);
  const commissions = STORAGE.get('commissions', []);
  const franchises = STORAGE.get('franchises', []);
  const branches = STORAGE.get('branches', []);

  const userEmp = employees.find(e => e.name && (currentUser.fullName || '').includes(e.name));
  const myTeam = userEmp ? employees.filter(e => e.supervisor === userEmp.id) : [];
  const mySales = userEmp ? sales.filter(s => s.salesPersonId === userEmp.id) : [];
  const totalSalesAmount = mySales.reduce((s,x) => s + (x.unitPrice || 0), 0);
  const totalCommission = mySales.reduce((s,x) => s + ((x.unitPrice || 0) * (x.commissionRate || 0) / 100), 0);
  const treasuryBalance = treasury.reduce((s,e) => s + (e.type === 'income' ? e.amount : -e.amount), 0);
  const totalExpenses = expenses.reduce((s,x) => s + (x.amount || 0), 0);

  const salesByPerson = {};
  sales.forEach(s => {
    const emp = employees.find(e => e.id === s.salesPersonId);
    if(emp) {
      if(!salesByPerson[emp.name]) salesByPerson[emp.name] = {count:0, total:0};
      salesByPerson[emp.name].count++;
      salesByPerson[emp.name].total += (s.unitPrice || 0);
    }
  });
  const topPerformers = Object.entries(salesByPerson).sort((a,b) => b[1].total - a[1].total).slice(0,5);

  let prompt = `You are Marts AI Assistant, a helpful assistant for Marts Real Estate CRM system. You speak in the same language as the user (Arabic or English). Be concise and helpful. You have access to the following system data:

**Current User:** ${currentUser.fullName || currentUser.username} (${t(currentUser.role)})

**Employees (${employees.length} total):** ${employees.map(e => `${e.name} (${t(e.role)}, ${e.status}, salary:${e.salary}, target:${e.target})`).join(', ')}

**My Team (${myTeam.length}):** ${myTeam.map(e => e.name).join(', ') || 'None'}

**My Sales (${mySales.length}):** Total value: ${totalSalesAmount} EGP, Total commission: ${totalCommission} EGP

**All Sales (${sales.length} total):** ${sales.map(s => `${s.code}: ${s.client} - ${s.project} - ${s.unitPrice} EGP (${s.date})`).join(', ')}

**Treasury Balance:** ${treasuryBalance} EGP

**Total Expenses:** ${totalExpenses} EGP

**Franchises:** ${franchises.map(f => f.name_ar + ' (' + f.name_en + ')').join(', ')}

**Branches:** ${branches.map(b => b.name_ar).join(', ')}

**Top Performers:** ${topPerformers.map(([name, data]) => `${name}: ${data.count} sales, ${data.total} EGP`).join(', ')}

You can help with:
1. Employee information and team structure
2. Sales data and performance analysis
3. Financial information (treasury, expenses)
4. Navigation help (how to use the system)
5. General questions about the business

Always respond in the same language the user writes in. Be helpful, concise, and use the actual data provided above.`;

  return prompt;
}

function buildQuickActionContext(action) {
  if(!currentUser) return '';
  const employees = STORAGE.get('employees', []);
  const sales = STORAGE.get('sales', []);
  const treasury = STORAGE.get('treasury', []);
  const userEmp = employees.find(e => e.name && (currentUser.fullName || '').includes(e.name));

  switch(action) {
    case 'myTeam': {
      const myTeam = userEmp ? employees.filter(e => e.supervisor === userEmp.id) : [];
      return lang === 'ar'
        ? `اعرض لي فريقي. فريقي الحالي: ${myTeam.length > 0 ? myTeam.map(e => `${e.name} (${t(e.role)})`).join(', ') : 'لا يوجد أعضاء في فريقك'}`
        : `Show my team. Current team: ${myTeam.length > 0 ? myTeam.map(e => `${e.name} (${t(e.role)})`).join(', ') : 'No team members'}`;
    }
    case 'mySales': {
      const mySales = userEmp ? sales.filter(s => s.salesPersonId === userEmp.id) : [];
      const total = mySales.reduce((s,x) => s + (x.unitPrice||0), 0);
      return lang === 'ar'
        ? `اعرض مبيعاتي. مبيعاتي: ${mySales.length} عقد بإجمالي ${total} ج.م`
        : `Show my sales. My sales: ${mySales.length} contracts totaling ${total} EGP`;
    }
    case 'commissions': return lang === 'ar' ? 'اعرض لي عمولاتي المستحقة' : 'Show my commission dues';
    case 'treasury': {
      const balance = treasury.reduce((s,e) => s+(e.type==='income'?e.amount:-e.amount), 0);
      return lang === 'ar' ? `رصيد الخزينة الحالي هو ${balance} ج.م. اشرح لي التفاصيل` : `Current treasury balance is ${balance} EGP. Explain the details`;
    }
    case 'topPerformers': return lang === 'ar' ? 'من هم أفضل المنفذين في المبيعات؟ اعرض الإحصائيات' : 'Who are the top sales performers? Show statistics';
    case 'goToSales': return 'NAVIGATE:showPage(sales)';
    case 'goToEmployees': return 'NAVIGATE:showPage(employees)';
    case 'goToAccounting': return 'NAVIGATE:showPage(accounting)';
    case 'howToAddSale': return lang === 'ar' ? 'اشرح لي خطوات إضافة بيع جديد في النظام' : 'Explain the steps to add a new sale in the system';
    case 'howToAddEmployee': return lang === 'ar' ? 'اشرح لي خطوات إضافة موظف جديد في النظام' : 'Explain the steps to add a new employee in the system';
    default: return '';
  }
}

async function sendAiMessage() {
  if(aiSending) return;
  const input = document.getElementById('aiInput');
  const text = input.value.trim();
  if(!text) return;

  input.value = '';
  addAiMessage(text, 'user');
  aiSending = true;
  document.getElementById('aiSendBtn').disabled = true;
  document.getElementById('aiStatus').textContent = t('ai_thinking');
  showAiTyping();

  const settings = getAiSettings();
  const systemPrompt = buildAiSystemPrompt();

  try {
    const response = await fetch(settings.url + '/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        model: settings.model,
        messages: [
          {role: 'system', content: systemPrompt},
          {role: 'user', content: text}
        ],
        stream: false
      })
    });

    if(!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    removeAiTyping();
    addAiMessage(data.message?.content || 'No response', 'assistant');
  } catch(err) {
    removeAiTyping();
    console.error('AI Error:', err);
    addAiMessage(t('ai_error') + ': ' + err.message, 'assistant');
  } finally {
    aiSending = false;
    document.getElementById('aiSendBtn').disabled = false;
    document.getElementById('aiStatus').textContent = lang === 'ar' ? 'جاهز' : 'Ready';
  }
}

async function aiQuickAction(action) {
  if(action.startsWith('NAVIGATE:')) {
    const page = action.split(':')[1];
    toggleAiChat();
    eval(page);
    return;
  }
  const prompt = buildQuickActionContext(action);
  if(!prompt) return;
  document.getElementById('aiInput').value = prompt;
  await sendAiMessage();
}

async function testOllamaConnection() {
  const url = document.getElementById('aiSetUrl').value.trim();
  const statusEl = document.getElementById('aiConnStatus');
  statusEl.textContent = lang === 'ar' ? 'جاري الاختبار...' : 'Testing...';
  statusEl.style.color = '#888';
  try {
    const response = await fetch(url + '/api/tags', {method:'GET'});
    if(response.ok) {
      const data = await response.json();
      const models = data.models?.map(m => m.name).join(', ') || 'unknown';
      statusEl.innerHTML = '<span style="color:#A5AF79">✓ ' + t('ai_connectionSuccess') + ' (' + models + ')</span>';
    } else {
      statusEl.innerHTML = '<span style="color:#C75B4A">✗ ' + t('ai_connectionFailed') + '</span>';
    }
  } catch(err) {
    statusEl.innerHTML = '<span style="color:#C75B4A">✗ ' + t('ai_connectionFailed') + ': ' + err.message + '</span>';
  }
}
