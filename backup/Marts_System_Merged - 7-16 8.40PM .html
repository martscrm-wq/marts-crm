// ============================================================
function renderAnalysis() {
  const balances = getAccountBalances();
  let totalCurrentAssets = 0, totalFixedAssets = 0, totalCurrentLiab = 0, totalLongTermLiab = 0;
  let totalRevenue = 0, totalContraRevenue = 0, totalExpenses = 0, totalEquity = 0;
  Object.values(balances).forEach(b => {
    if(b.debit === 0 && b.credit === 0) return;
    const net = b.debit - b.credit;
    if(b.type === 'asset' && (b.code.startsWith('11') || b.code === '1')) totalCurrentAssets += net;
    else if(b.type === 'asset') totalFixedAssets += net;
    else if(b.type === 'contra_asset') totalFixedAssets += net;
    else if(b.type === 'liability' && (b.code.startsWith('21') || b.code === '2')) totalCurrentLiab += b.credit - b.debit;
    else if(b.type === 'liability') totalLongTermLiab += b.credit - b.debit;
    else if(b.type === 'revenue' && b.credit > 0) totalRevenue += b.credit;
    else if(b.type === 'contra_revenue' && b.debit > 0) totalContraRevenue += b.debit;
    else if(b.type === 'expense' && b.debit > 0) totalExpenses += b.debit;
    else if(b.type === 'equity') totalEquity += b.credit - b.debit;
  });
  const totalAssets = totalCurrentAssets + totalFixedAssets;
  const totalLiab = totalCurrentLiab + totalLongTermLiab;
  const netRevenue = totalRevenue - totalContraRevenue;
  const netIncome = netRevenue - totalExpenses;
  const grossProfit = netRevenue - totalExpenses * 0.6;
  const hasData = totalAssets > 0 || totalLiab > 0 || netRevenue > 0;

  function ratioBox(label, value, benchmark, goodText, fairText, poorText, detail) {
    const status = value >= benchmark ? 'good' : value >= benchmark * 0.7 ? 'fair' : 'poor';
    const color = status === 'good' ? '#A5AF79' : status === 'fair' ? '#E8A07C' : '#C75B4A';
    const statusText = status === 'good' ? goodText : status === 'fair' ? fairText : poorText;
    return `<div style="background:rgba(0,0,0,0.02);border-radius:8px;padding:16px;border-left:4px solid ${color}">
      <div style="color:#888;font-size:0.85em;margin-bottom:4px">${label}</div>
      <div style="font-size:1.5em;font-weight:700;color:${color}">${typeof value === 'number' ? value.toFixed(2) : value}</div>
      ${detail?'<div style="font-size:0.75em;color:#888;margin-top:4px;border-top:1px dashed #ddd;padding-top:4px">'+detail+'</div>':''}
      <div style="font-size:0.8em;color:${color};margin-top:4px">${statusText}</div>
    </div>`;
  }

  let h = '';
  if(!hasData) { h = '<div class="empty-state"><p>'+t('acc_noAnalysisData')+'</p></div>'; }
  else {
    const currentRatio = totalCurrentLiab > 0 ? totalCurrentAssets / totalCurrentLiab : 0;
    const quickRatio = totalCurrentLiab > 0 ? (totalCurrentAssets * 0.8) / totalCurrentLiab : 0;
    const cashRatio = totalCurrentLiab > 0 ? (totalCurrentAssets * 0.5) / totalCurrentLiab : 0;
    const grossMargin = netRevenue > 0 ? (grossProfit / netRevenue * 100) : 0;
    const netMargin = netRevenue > 0 ? (netIncome / netRevenue * 100) : 0;
    const roa = totalAssets > 0 ? (netIncome / totalAssets * 100) : 0;
    const roe = totalEquity > 0 ? (netIncome / totalEquity * 100) : 0;
    const debtRatio = totalAssets > 0 ? (totalLiab / totalAssets * 100) : 0;
    const debtToEquity = totalEquity > 0 ? (totalLiab / totalEquity) : 0;

    h += '<div class="card" style="margin-bottom:16px;border-left:4px solid #A5AF79"><h3 style="margin-bottom:12px;color:#A5AF79"><i class="fas fa-file-invoice-dollar"></i> '+t('acc_summaryValues')+'</h3>';
    h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">';
    h += `<div style="background:rgba(130,113,72,0.08);border-radius:8px;padding:14px;text-align:center">
      <div style="color:#888;font-size:0.8em;margin-bottom:4px">${t('acc_totalAssets')}</div>
      <div style="font-size:1.4em;font-weight:700;color:#827148">${fmt(totalAssets)}</div>
    </div>`;
    h += `<div style="background:rgba(199,91,74,0.08);border-radius:8px;padding:14px;text-align:center">
      <div style="color:#888;font-size:0.8em;margin-bottom:4px">${t('acc_totalLiabilities')}</div>
      <div style="font-size:1.4em;font-weight:700;color:#C75B4A">${fmt(totalLiab)}</div>
    </div>`;
    h += `<div style="background:rgba(130,113,72,0.08);border-radius:8px;padding:14px;text-align:center">
      <div style="color:#888;font-size:0.8em;margin-bottom:4px">${t('acc_totalEquity')}</div>
      <div style="font-size:1.4em;font-weight:700;color:#827148">${fmt(totalEquity)}</div>
    </div>`;
    h += `<div style="background:rgba(165,175,121,0.08);border-radius:8px;padding:14px;text-align:center">
      <div style="color:#888;font-size:0.8em;margin-bottom:4px">${t('acc_revenueTotal')}</div>
      <div style="font-size:1.4em;font-weight:700;color:#A5AF79">${fmt(netRevenue)}</div>
    </div>`;
    h += `<div style="background:rgba(232,160,124,0.08);border-radius:8px;padding:14px;text-align:center">
      <div style="color:#888;font-size:0.8em;margin-bottom:4px">${t('acc_expenseTotal')}</div>
      <div style="font-size:1.4em;font-weight:700;color:#E8A07C">${fmt(totalExpenses)}</div>
    </div>`;
    h += `<div style="background:${netIncome>=0?'rgba(165,175,121,0.08)':'rgba(199,91,74,0.08)'};border-radius:8px;padding:14px;text-align:center">
      <div style="color:#888;font-size:0.8em;margin-bottom:4px">${t('acc_netIncome')}</div>
      <div style="font-size:1.4em;font-weight:700;color:${netIncome>=0?'#A5AF79':'#C75B4A'}">${fmt(netIncome)}</div>
    </div>`;
    h += '</div></div>';

    h += '<div class="card" style="margin-bottom:16px;border-left:4px solid #827148"><h3 style="margin-bottom:12px;color:#827148"><i class="fas fa-tint"></i> '+t('acc_liquidityRatios')+'</h3>';
    h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">';
    h += ratioBox(t('acc_currentRatio'), currentRatio, 1.5, t('acc_ratioGood'), t('acc_ratioFair'), t('acc_ratioPoor'), t('acc_currentAssets')+': '+fmt(totalCurrentAssets)+'<br>'+t('acc_currentLiabilities')+': '+fmt(totalCurrentLiab));
    h += ratioBox(t('acc_quickRatio'), quickRatio, 1.0, t('acc_ratioGood'), t('acc_ratioFair'), t('acc_ratioPoor'), t('acc_currentAssets')+' × 0.8<br>'+fmt(totalCurrentAssets*0.8)+' ÷ '+fmt(totalCurrentLiab));
    h += ratioBox(t('acc_cashRatio'), cashRatio, 0.5, t('acc_ratioGood'), t('acc_ratioFair'), t('acc_ratioPoor'), t('acc_currentAssets')+' × 0.5<br>'+fmt(totalCurrentAssets*0.5)+' ÷ '+fmt(totalCurrentLiab));
    h += '</div></div>';

    h += '<div class="card" style="margin-bottom:16px;border-left:4px solid #A5AF79"><h3 style="margin-bottom:12px;color:#A5AF79"><i class="fas fa-chart-pie"></i> '+t('acc_profitabilityRatios')+'</h3>';
    h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">';
    h += ratioBox(t('acc_grossProfitMargin')+' (%)', grossMargin, 30, t('acc_ratioGood'), t('acc_ratioFair'), t('acc_ratioPoor'), t('acc_revenueTotal')+': '+fmt(netRevenue)+'<br>'+t('acc_grossProfit')+': '+fmt(grossProfit));
    h += ratioBox(t('acc_netProfitMargin')+' (%)', netMargin, 10, t('acc_ratioGood'), t('acc_ratioFair'), t('acc_ratioPoor'), t('acc_netIncome')+': '+fmt(netIncome)+'<br>'+t('acc_revenueTotal')+': '+fmt(netRevenue));
    h += ratioBox(t('acc_roa')+' (%)', roa, 5, t('acc_ratioGood'), t('acc_ratioFair'), t('acc_ratioPoor'), t('acc_netIncome')+': '+fmt(netIncome)+'<br>'+t('acc_totalAssets')+': '+fmt(totalAssets));
    h += ratioBox(t('acc_roe')+' (%)', roe, 10, t('acc_ratioGood'), t('acc_ratioFair'), t('acc_ratioPoor'), t('acc_netIncome')+': '+fmt(netIncome)+'<br>'+t('acc_totalEquity')+': '+fmt(totalEquity));
    h += '</div></div>';

    h += '<div class="card" style="border-left:4px solid #E8A07C"><h3 style="margin-bottom:12px;color:#E8A07C"><i class="fas fa-balance-scale"></i> '+t('acc_leverageRatios')+'</h3>';
    h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">';
    h += ratioBox(t('acc_debtRatio')+' (%)', debtRatio, 50, t('acc_ratioPoor'), t('acc_ratioFair'), t('acc_ratioGood'), t('acc_totalLiabilities')+': '+fmt(totalLiab)+'<br>'+t('acc_totalAssets')+': '+fmt(totalAssets));
    h += ratioBox(t('acc_debtToEquity'), debtToEquity, 1.0, t('acc_ratioPoor'), t('acc_ratioFair'), t('acc_ratioGood'), t('acc_totalLiabilities')+': '+fmt(totalLiab)+'<br>'+t('acc_totalEquity')+': '+fmt(totalEquity));
    h += '</div></div>';
  }
  document.getElementById('accTab_analysis').innerHTML = renderFranchiseFilterBar() + h;
}

function applyUnifiedFilter() {
  const fromDate = document.getElementById('uf_from')?.value || '';
  const toDate = document.getElementById('uf_to')?.value || '';
  const franchiseId = document.getElementById('uf_franchise')?.value || '';
  const branchId = document.getElementById('uf_branch')?.value || '';
  const category = document.getElementById('uf_category')?.value || '';
  
  const treasury = STORAGE.get('treasury', []);
  const expenses = STORAGE.get('expenses', []);
  const sales = STORAGE.get('sales', []);
  const salaries = STORAGE.get('salaries', []);
  const journalEntries = STORAGE.get('journalEntries', []);
  const franchises = STORAGE.get('franchises', []);
  const branches = STORAGE.get('branches', []);
  const employees = STORAGE.get('employees', []);
  
  function inDateRange(d) {
    if(!d) return true;
    if(fromDate && d < fromDate) return false;
    if(toDate && d > toDate) return false;
    return true;
  }
  function matchFranchise(fId) {
    if(!franchiseId) return true;
    return fId === franchiseId;
  }
  function matchBranch(bId) {
    if(!branchId) return true;
    return bId === branchId;
  }
  
  let filteredTreasury = treasury.filter(e => inDateRange(e.date) && matchFranchise(e.franchiseId) && matchBranch(e.branchId));
  let filteredExpenses = expenses.filter(e => inDateRange(e.date) && (!category || e.category === category));
  let filteredSalaries = salaries.filter(e => inDateRange(e.date));
  let filteredSales = sales.filter(s => inDateRange(s.date));
  let filteredJournal = journalEntries.filter(e => inDateRange(e.date) && matchFranchise(e.franchiseId) && matchBranch(e.branchId));
  
  const totalIncome = filteredTreasury.filter(e => e.type === 'income').reduce((s,e) => s + (e.amount||0), 0);
  const totalExpenses = filteredTreasury.filter(e => e.type === 'expense').reduce((s,e) => s + (e.amount||0), 0) + filteredExpenses.reduce((s,e) => s + (e.amount||0), 0);
  const totalSalaries = filteredSalaries.reduce((s,e) => s + (e.amount||0), 0);
  const totalSalesAmount = filteredSales.reduce((s,e) => s + (e.unitPrice||0), 0);
  const netBalance = totalIncome - totalExpenses - totalSalaries;
  
  let h = `<div class="card" style="margin-bottom:16px">
    <h3 style="margin-bottom:12px"><i class="fas fa-chart-bar"></i> ${t('acc_summary')}</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">
      <div style="background:rgba(165,175,121,0.08);border-radius:8px;padding:16px;text-align:center">
        <div style="color:#888;font-size:0.85em">${t('acc_totalIn')}</div>
        <div style="font-size:1.8em;font-weight:700;color:#A5AF79">${fmt(totalIncome)}</div>
      </div>
      <div style="background:rgba(199,91,74,0.08);border-radius:8px;padding:16px;text-align:center">
        <div style="color:#888;font-size:0.85em">${t('acc_totalOut')}</div>
        <div style="font-size:1.8em;font-weight:700;color:#C75B4A">${fmt(totalExpenses)}</div>
      </div>
      <div style="background:rgba(232,160,124,0.08);border-radius:8px;padding:16px;text-align:center">
        <div style="color:#888;font-size:0.85em">${t('acc_salaries')}</div>
        <div style="font-size:1.8em;font-weight:700;color:#E8A07C">${fmt(totalSalaries)}</div>
      </div>
      <div style="background:rgba(130,113,72,0.08);border-radius:8px;padding:16px;text-align:center">
        <div style="color:#888;font-size:0.85em">${t('acc_revenueTotal')}</div>
        <div style="font-size:1.8em;font-weight:700;color:#827148">${fmt(totalSalesAmount)}</div>
      </div>
      <div style="background:${netBalance>=0?'rgba(130,113,72,0.08)':'rgba(199,91,74,0.08)'};border-radius:8px;padding:16px;text-align:center">
        <div style="color:#888;font-size:0.85em">${t('acc_netBalance')}</div>
        <div style="font-size:1.8em;font-weight:700;color:${netBalance>=0?'#827148':'#C75B4A'}">${fmt(netBalance)}</div>
      </div>
    </div>
  </div>`;
  
  h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(450px,1fr));gap:16px">';
  
  h += '<div class="card"><h4 style="margin-bottom:12px;color:#A5AF79"><i class="fas fa-arrow-circle-down"></i> ${t("acc_totalIn")}</h4>';
  if(filteredTreasury.filter(e => e.type === 'income').length === 0) {
    h += '<div class="empty-state"><p>'+t('noData')+'</p></div>';
  } else {

function applyCashFlowFilter() {
  const fromDate = document.getElementById('cf_from')?.value || '';
  const toDate = document.getElementById('cf_to')?.value || '';
  const franchiseId = document.getElementById('cf_franchise')?.value || '';
  const branchId = document.getElementById('cf_branch')?.value || '';
  
  const treasury = STORAGE.get('treasury', []);
  const expenses = STORAGE.get('expenses', []);
  const sales = STORAGE.get('sales', []);
  const salaries = STORAGE.get('salaries', []);
  const partners = STORAGE.get('partners', []);
  const journalEntries = STORAGE.get('journalEntries', []);
  const franchises = STORAGE.get('franchises', []);
  
  function inDateRange(d) {
    if(!d) return true;
    if(fromDate && d < fromDate) return false;
    if(toDate && d > toDate) return false;
    return true;
  }
  function matchFranchise(fId) {
    if(!franchiseId) return true;
    return fId === franchiseId;
  }
  function matchBranch(bId) {
    if(!branchId) return true;
    return bId === branchId;
  }
  
  let operatingInflow = 0, operatingOutflow = 0;
  let investingInflow = 0, investingOutflow = 0;
  let financingInflow = 0, financingOutflow = 0;
  
  const monthlyData = {};
  
  treasury.filter(e => inDateRange(e.date) && matchFranchise(e.franchiseId) && matchBranch(e.branchId)).forEach(e => {
    const month = (e.date || '').substring(0, 7);
    if(!monthlyData[month]) monthlyData[month] = {inflow:0, outflow:0};
    
    if(e.type === 'income') {
      operatingInflow += e.amount || 0;
      monthlyData[month].inflow += e.amount || 0;
    } else {
      operatingOutflow += e.amount || 0;
      monthlyData[month].outflow += e.amount || 0;
    }
  });
  
  sales.filter(s => inDateRange(s.date) && matchFranchise(s.franchiseId)).forEach(s => {
    const month = (s.date || '').substring(0, 7);
    if(!monthlyData[month]) monthlyData[month] = {inflow:0, outflow:0};
    operatingInflow += s.unitPrice || 0;
    monthlyData[month].inflow += s.unitPrice || 0;
  });
  
  expenses.filter(e => inDateRange(e.date)).forEach(e => {
    const month = (e.date || '').substring(0, 7);
    if(!monthlyData[month]) monthlyData[month] = {inflow:0, outflow:0};
    operatingOutflow += e.amount || 0;
    monthlyData[month].outflow += e.amount || 0;
  });
  
  salaries.filter(e => inDateRange(e.date)).forEach(e => {
    const month = (e.date || '').substring(0, 7);
    if(!monthlyData[month]) monthlyData[month] = {inflow:0, outflow:0};
    operatingOutflow += e.amount || 0;
    monthlyData[month].outflow += e.amount || 0;
  });
  
  partners.filter(e => inDateRange(e.date)).forEach(e => {
    const month = (e.date || '').substring(0, 7);
    if(!monthlyData[month]) monthlyData[month] = {inflow:0, outflow:0};
    financingInflow += e.amount || 0;
    monthlyData[month].inflow += e.amount || 0;
  });
  
  journalEntries.filter(e => inDateRange(e.date) && matchFranchise(e.franchiseId) && matchBranch(e.branchId)).forEach(entry => {
    if(!entry.lines) return;
    entry.lines.forEach(line => {
      const coa = STORAGE.get('chartOfAccounts', []).find(a => a.code === line.code);
      if(!coa) return;
      const month = (entry.date || '').substring(0, 7);
      if(!monthlyData[month]) monthlyData[month] = {inflow:0, outflow:0};
      
      if(coa.code.startsWith('12') && !coa.code.startsWith('120')) {
        if(line.debit > 0) { investingOutflow += line.debit; monthlyData[month].outflow += line.debit; }
        if(line.credit > 0) { investingInflow += line.credit; monthlyData[month].inflow += line.credit; }
      } else if(coa.code.startsWith('22') || coa.code.startsWith('3')) {
        if(line.debit > 0) { financingOutflow += line.debit; monthlyData[month].outflow += line.debit; }
        if(line.credit > 0) { financingInflow += line.credit; monthlyData[month].inflow += line.credit; }
      }
    });
  });
  
  const netOperating = operatingInflow - operatingOutflow;
  const netInvesting = investingInflow - investingOutflow;
  const netFinancing = financingInflow - financingOutflow;
  const netCashFlow = netOperating + netInvesting + netFinancing;
  const totalInflow = operatingInflow + investingInflow + financingInflow;
  const totalOutflow = operatingOutflow + investingOutflow + financingOutflow;
  
  const sortedMonths = Object.entries(monthlyData).sort((a,b) => a[0].localeCompare(b[0]));
  let runningBalance = 0;
  
  let h = `<div class="card" style="margin-bottom:16px">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">
      <div style="background:rgba(165,175,121,0.08);border-radius:8px;padding:16px;text-align:center">
        <div style="color:#7A6E5D;font-size:0.85em">${t('acc_cashInflows')}</div>
        <div style="font-size:1.6em;font-weight:700;color:#A5AF79">${fmt(totalInflow)}</div>
      </div>
      <div style="background:rgba(199,91,74,0.08);border-radius:8px;padding:16px;text-align:center">
        <div style="color:#7A6E5D;font-size:0.85em">${t('acc_cashOutflows')}</div>
        <div style="font-size:1.6em;font-weight:700;color:#C75B4A">${fmt(totalOutflow)}</div>
      </div>
      <div style="background:rgba(130,113,72,0.08);border-radius:8px;padding:16px;text-align:center">
        <div style="color:#7A6E5D;font-size:0.85em">${t('acc_netCashFlow')}</div>
        <div style="font-size:1.6em;font-weight:700;color:${netCashFlow>=0?'#A5AF79':'#C75B4A'}">${fmt(netCashFlow)}</div>
      </div>
      <div style="background:rgba(232,160,124,0.08);border-radius:8px;padding:16px;text-align:center">
        <div style="color:#7A6E5D;font-size:0.85em">${t('acc_cashBalance')}</div>
        <div style="font-size:1.6em;font-weight:700;color:#827148">${fmt(netCashFlow)}</div>
      </div>
    </div>
  </div>`;
  
  h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(450px,1fr));gap:16px">';
  
  h += `<div class="card"><h4 style="margin-bottom:12px;color:#827148"><i class="fas fa-file-alt"></i> ${t('acc_cashFlowStatement')}</h4>`;
  h += '<div class="table-wrap"><table><thead><tr><th>'+t('acc_cashFlow')+'</th><th>'+t('acc_cashInflows')+'</th><th>'+t('acc_cashOutflows')+'</th><th>'+t('acc_netCashFlow')+'</th></tr></thead><tbody>';
  
  h += `<tr style="background:rgba(165,175,121,0.05)"><td style="font-weight:700;color:#827148" colspan="4"><i class="fas fa-cog"></i> ${t('acc_operatingActivities')}</td></tr>`;
  h += `<tr><td style="padding-right:24px">${t('acc_revenueTotal')}</td><td style="direction:ltr;text-align:right;color:#A5AF79">${fmt(operatingInflow)}</td><td style="direction:ltr;text-align:right">-</td><td style="direction:ltr;text-align:right;color:#A5AF79;font-weight:600">${fmt(operatingInflow)}</td></tr>`;
  h += `<tr><td style="padding-right:24px">${t('acc_expenseTotal')}</td><td style="direction:ltr;text-align:right">-</td><td style="direction:ltr;text-align:right;color:#C75B4A">${fmt(operatingOutflow)}</td><td style="direction:ltr;text-align:right;color:#C75B4A;font-weight:600">-${fmt(operatingOutflow)}</td></tr>`;
  h += `<tr style="font-weight:700;background:rgba(165,175,121,0.08)"><td>${t('acc_operatingActivities')}</td><td style="direction:ltr;text-align:right">${fmt(operatingInflow)}</td><td style="direction:ltr;text-align:right">${fmt(operatingOutflow)}</td><td style="direction:ltr;text-align:right;color:${netOperating>=0?'#A5AF79':'#C75B4A'}">${fmt(netOperating)}</td></tr>`;
  
  h += `<tr style="background:rgba(232,160,124,0.05)"><td style="font-weight:700;color:#827148" colspan="4"><i class="fas fa-chart-line"></i> ${t('acc_investingActivities')}</td></tr>`;
  h += `<tr><td style="padding-right:24px">${t('acc_cashInflows')}</td><td style="direction:ltr;text-align:right;color:#A5AF79">${fmt(investingInflow)}</td><td style="direction:ltr;text-align:right">-</td><td style="direction:ltr;text-align:right;color:#A5AF79;font-weight:600">${fmt(investingInflow)}</td></tr>`;
  h += `<tr><td style="padding-right:24px">${t('acc_cashOutflows')}</td><td style="direction:ltr;text-align:right">-</td><td style="direction:ltr;text-align:right;color:#C75B4A">${fmt(investingOutflow)}</td><td style="direction:ltr;text-align:right;color:#C75B4A;font-weight:600">-${fmt(investingOutflow)}</td></tr>`;
  h += `<tr style="font-weight:700;background:rgba(232,160,124,0.08)"><td>${t('acc_investingActivities')}</td><td style="direction:ltr;text-align:right">${fmt(investingInflow)}</td><td style="direction:ltr;text-align:right">${fmt(investingOutflow)}</td><td style="direction:ltr;text-align:right;color:${netInvesting>=0?'#A5AF79':'#C75B4A'}">${fmt(netInvesting)}</td></tr>`;
  
  h += `<tr style="background:rgba(130,113,72,0.05)"><td style="font-weight:700;color:#827148" colspan="4"><i class="fas fa-university"></i> ${t('acc_financingActivities')}</td></tr>`;
  h += `<tr><td style="padding-right:24px">${t('acc_cashInflows')}</td><td style="direction:ltr;text-align:right;color:#A5AF79">${fmt(financingInflow)}</td><td style="direction:ltr;text-align:right">-</td><td style="direction:ltr;text-align:right;color:#A5AF79;font-weight:600">${fmt(financingInflow)}</td></tr>`;
  h += `<tr><td style="padding-right:24px">${t('acc_cashOutflows')}</td><td style="direction:ltr;text-align:right">-</td><td style="direction:ltr;text-align:right;color:#C75B4A">${fmt(financingOutflow)}</td><td style="direction:ltr;text-align:right;color:#C75B4A;font-weight:600">-${fmt(financingOutflow)}</td></tr>`;
  h += `<tr style="font-weight:700;background:rgba(130,113,72,0.08)"><td>${t('acc_financingActivities')}</td><td style="direction:ltr;text-align:right">${fmt(financingInflow)}</td><td style="direction:ltr;text-align:right">${fmt(financingOutflow)}</td><td style="direction:ltr;text-align:right;color:${netFinancing>=0?'#A5AF79':'#C75B4A'}">${fmt(netFinancing)}</td></tr>`;
  
  h += `<tr style="font-weight:800;background:rgba(130,113,72,0.12);border-top:2px solid var(--border)"><td>${t('acc_netCashFlow')}</td><td style="direction:ltr;text-align:right">${fmt(totalInflow)}</td><td style="direction:ltr;text-align:right">${fmt(totalOutflow)}</td><td style="direction:ltr;text-align:right;font-size:1.1em;color:${netCashFlow>=0?'#A5AF79':'#C75B4A'}">${fmt(netCashFlow)}</td></tr>`;
  
  h += '</tbody></table></div></div>';
  
  h += `<div class="card"><h4 style="margin-bottom:12px;color:#827148"><i class="fas fa-calendar-alt"></i> ${t('acc_monthlyCashFlow')}</h4>`;
  if(sortedMonths.length === 0) {
    h += '<div class="empty-state"><p>'+t('noData')+'</p></div>';
  } else {
    h += '<div class="table-wrap"><table><thead><tr><th>'+t('acc_journalDate')+'</th><th>'+t('acc_cashInflows')+'</th><th>'+t('acc_cashOutflows')+'</th><th>'+t('acc_netCashFlow')+'</th><th>'+t('acc_cashBalance')+'</th></tr></thead><tbody>';
    sortedMonths.forEach(([month, data]) => {
      const net = data.inflow - data.outflow;
      runningBalance += net;
      h += `<tr><td>${month}</td><td style="direction:ltr;text-align:right;color:#A5AF79">${fmt(data.inflow)}</td><td style="direction:ltr;text-align:right;color:#C75B4A">${fmt(data.outflow)}</td><td style="direction:ltr;text-align:right;color:${net>=0?'#A5AF79':'#C75B4A'};font-weight:600">${fmt(net)}</td><td style="direction:ltr;text-align:right;font-weight:700;color:${runningBalance>=0?'#827148':'#C75B4A'}">${fmt(runningBalance)}</td></tr>`;
    });
    h += `<tr style="font-weight:800;background:rgba(130,113,72,0.1)"><td>${t('acc_total')}</td><td style="direction:ltr;text-align:right;color:#A5AF79">${fmt(totalInflow)}</td><td style="direction:ltr;text-align:right;color:#C75B4A">${fmt(totalOutflow)}</td><td style="direction:ltr;text-align:right;color:${netCashFlow>=0?'#A5AF79':'#C75B4A'}">${fmt(netCashFlow)}</td><td style="direction:ltr;text-align:right;color:#827148">${fmt(runningBalance)}</td></tr>`;
    h += '</tbody></table></div>';
  }
  h += '</div>';
  
  h += '</div>';
  
  h += `<div class="card" style="margin-top:16px"><h4 style="margin-bottom:12px;color:#827148"><i class="fas fa-chart-bar"></i> ${t('acc_cashFlowAnalysis')}</h4>`;
  h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">';
  
  const operatingRatio = totalInflow > 0 ? (operatingInflow / totalInflow * 100).toFixed(1) : 0;
  const investingRatio = totalOutflow > 0 ? (investingOutflow / totalOutflow * 100).toFixed(1) : 0;
  const financingRatio = totalOutflow > 0 ? (financingOutflow / totalOutflow * 100).toFixed(1) : 0;
  
  function cashFlowBox(label, value, benchmark, goodText, fairText, poorText, detail) {
    const status = value >= benchmark ? 'good' : value >= benchmark * 0.7 ? 'fair' : 'poor';
    const color = status === 'good' ? '#A5AF79' : status === 'fair' ? '#E8A07C' : '#C75B4A';
    const statusText = status === 'good' ? goodText : status === 'fair' ? fairText : poorText;
    return `<div style="background:rgba(0,0,0,0.02);border-radius:8px;padding:16px;border-left:4px solid ${color}">
      <div style="color:#7A6E5D;font-size:0.85em;margin-bottom:4px">${label}</div>
      <div style="font-size:1.4em;font-weight:700;color:${color}">${typeof value === 'number' ? value.toFixed(1)+'%' : value}</div>
      ${detail?'<div style="font-size:0.75em;color:#7A6E5D;margin-top:4px;border-top:1px dashed #E8DFD0;padding-top:4px">'+detail+'</div>':''}
      <div style="font-size:0.8em;color:${color};margin-top:4px">${statusText}</div>
    </div>`;
  }
  
  h += cashFlowBox(t('acc_operatingActivities'), parseFloat(operatingRatio), 60, t('acc_ratioGood'), t('acc_ratioFair'), t('acc_ratioPoor'), t('acc_cashInflows')+': '+fmt(operatingInflow)+'<br>'+t('acc_total')+': '+fmt(totalInflow));
  h += cashFlowBox(t('acc_investingActivities'), parseFloat(investingRatio), 30, t('acc_ratioFair'), t('acc_ratioGood'), t('acc_ratioPoor'), t('acc_cashOutflows')+': '+fmt(investingOutflow)+'<br>'+t('acc_total')+': '+fmt(totalOutflow));
  h += cashFlowBox(t('acc_financingActivities'), parseFloat(financingRatio), 20, t('acc_ratioFair'), t('acc_ratioGood'), t('acc_ratioPoor'), t('acc_cashOutflows')+': '+fmt(financingOutflow)+'<br>'+t('acc_total')+': '+fmt(totalOutflow));
  
  h += '</div></div>';
  
  document.getElementById('cashFlowResults').innerHTML = h;
}

function renderExpenseAnalysis() {
  const franchises = STORAGE.get('franchises', []);
  const branches = STORAGE.get('branches', []);
  const categories = [...new Set(STORAGE.get('expenses', []).map(e => e.category).filter(Boolean))];
  
  let fOpts = `<option value="">${t('acc_filterAll')}</option>`;
  franchises.forEach(f => { fOpts += `<option value="${f.id}">${lang==='ar'?f.name_ar:f.name_en}</option>`; });
  let bOpts = `<option value="">${t('acc_filterAll')}</option>`;
  branches.forEach(b => { const f = franchises.find(fr=>fr.id===b.franchiseId); bOpts += `<option value="${b.id}">${f?(lang==='ar'?f.name_ar:f.name_en)+' - ':''}${lang==='ar'?b.name_ar:b.name_en}</option>`; });
  let catOpts = `<option value="">${t('acc_filterAll')}</option>`;

function applyExpenseFilter() {
  const fromDate = document.getElementById('ea_from')?.value || '';
  const toDate = document.getElementById('ea_to')?.value || '';
  const franchiseId = document.getElementById('ea_franchise')?.value || '';
  const category = document.getElementById('ea_category')?.value || '';
  
  const expenses = STORAGE.get('expenses', []);
  const journalEntries = getFilteredJournalEntries();
  const franchises = STORAGE.get('franchises', []);
  
  function inDateRange(d) {
    if(!d) return true;
    if(fromDate && d < fromDate) return false;
    if(toDate && d > toDate) return false;
    return true;
  }
  function matchFranchise(fId) {
    if(!franchiseId) return true;
    return fId === franchiseId;
  }
  
  const expenseCategories = {};
  const expenseByMonth = {};
  const expenseByFranchise = {};
  let totalExp = 0;
  
  expenses.filter(e => inDateRange(e.date) && (!category || e.category === category)).forEach(e => {
    const cat = e.category || 'Other';
    const amt = e.amount || 0;
    expenseCategories[cat] = (expenseCategories[cat] || 0) + amt;
    totalExp += amt;
    const month = (e.date || '').substring(0, 7);
    if(month) expenseByMonth[month] = (expenseByMonth[month] || 0) + amt;
  });
  
  journalEntries.filter(e => inDateRange(e.date) && matchFranchise(e.franchiseId)).forEach(entry => {
    if(!entry.lines) return;
    entry.lines.forEach(line => {
      const coa = STORAGE.get('chartOfAccounts', []).find(a => a.code === line.code);
      if(coa && (coa.type === 'expense' || coa.code.startsWith('5'))) {
        const amt = line.debit || 0;
        if(amt > 0) {
          if(!category || (lang==='ar'?coa.name_ar:coa.name_en).includes(category)) {
            const catName = lang === 'ar' ? coa.name_ar : coa.name_en;
            expenseCategories[catName] = (expenseCategories[catName] || 0) + amt;
            totalExp += amt;
            const month = (entry.date || '').substring(0, 7);
            if(month) expenseByMonth[month] = (expenseByMonth[month] || 0) + amt;
            if(entry.franchiseId) {
              const f = franchises.find(fr => fr.id === entry.franchiseId);
              const fName = f ? (lang === 'ar' ? f.name_ar : f.name_en) : 'Other';
              expenseByFranchise[fName] = (expenseByFranchise[fName] || 0) + amt;
            }
          }
        }
      }
    });
  });
  
  const sortedCategories = Object.entries(expenseCategories).sort((a, b) => b[1] - a[1]);
  const sortedMonths = Object.entries(expenseByMonth).sort((a, b) => a[0].localeCompare(b[0]));
  const sortedFranchises = Object.entries(expenseByFranchise).sort((a, b) => b[1] - a[1]);
  
  let h = `<div class="card" style="margin-bottom:16px">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px">
      <div style="background:rgba(199,91,74,0.05);border-radius:8px;padding:16px;text-align:center">
        <div style="color:#888;font-size:0.9em">${t('acc_periodTotal')}</div>
        <div style="font-size:2em;font-weight:700;color:#C75B4A">${fmt(totalExp)}</div>
      </div>
      <div style="background:rgba(130,113,72,0.05);border-radius:8px;padding:16px;text-align:center">
        <div style="color:#888;font-size:0.9em">${t('acc_topExpenseCategories')}</div>
        <div style="font-size:2em;font-weight:700;color:#827148">${sortedCategories.length}</div>
      </div>
      <div style="background:rgba(130,113,72,0.05);border-radius:8px;padding:16px;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px">
        <button class="btn btn-success btn-sm" onclick="exportExpenseAnalysis()"><i class="fas fa-file-excel"></i> ${t('acc_exportStatement')}</button>
      </div>
    </div>
  </div>`;
  
  h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:16px">';
  
  h += '<div class="card"><h4 style="margin-bottom:12px;color:#C75B4A"><i class="fas fa-list-ol"></i> '+t('acc_expenseByCategory')+'</h4>';
  if(sortedCategories.length === 0) {
    h += '<div class="empty-state"><p>'+t('noData')+'</p></div>';
  } else {
    h += '<div class="table-wrap"><table><thead><tr><th>'+t('acc_expenseByCategory')+'</th><th>'+t('acc_journalDebit')+'</th><th>%</th></tr></thead><tbody>';
    sortedCategories.forEach(([cat, amt]) => {
      const pct = totalExp > 0 ? (amt / totalExp * 100).toFixed(1) : 0;
      h += `<tr><td>${cat}</td><td style="direction:ltr;text-align:right">${fmt(amt)}</td><td style="direction:ltr;text-align:right">${pct}%</td></tr>`;
    });
    h += '</tbody></table></div>';
  }
  h += '</div>';
  
  h += '<div class="card"><h4 style="margin-bottom:12px;color:#E8A07C"><i class="fas fa-calendar-alt"></i> '+t('acc_expenseByMonth')+'</h4>';
  if(sortedMonths.length === 0) {
    h += '<div class="empty-state"><p>'+t('noData')+'</p></div>';
  } else {
    h += '<div class="table-wrap"><table><thead><tr><th>'+t('acc_expenseByMonth')+'</th><th>'+t('acc_journalDebit')+'</th><th>%</th></tr></thead><tbody>';
    sortedMonths.forEach(([month, amt]) => {
      const pct = totalExp > 0 ? (amt / totalExp * 100).toFixed(1) : 0;
      h += `<tr><td>${month}</td><td style="direction:ltr;text-align:right">${fmt(amt)}</td><td style="direction:ltr;text-align:right">${pct}%</td></tr>`;
    });
    h += '</tbody></table></div>';
  }
  h += '</div>';
  
  if(sortedFranchises.length > 0) {
    h += '<div class="card"><h4 style="margin-bottom:12px;color:#827148"><i class="fas fa-building"></i> '+t('acc_expenseByFranchise')+'</h4>';
    h += '<div class="table-wrap"><table><thead><tr><th>'+t('acc_expenseByFranchise')+'</th><th>'+t('acc_journalDebit')+'</th><th>%</th></tr></thead><tbody>';
    sortedFranchises.forEach(([fName, amt]) => {
      const pct = totalExp > 0 ? (amt / totalExp * 100).toFixed(1) : 0;
      h += `<tr><td>${fName}</td><td style="direction:ltr;text-align:right">${fmt(amt)}</td><td style="direction:ltr;text-align:right">${pct}%</td></tr>`;
    });
    h += '</tbody></table></div>';
    h += '</div>';
  }
  
  h += '</div>';
  document.getElementById('expenseAnalysisResults').innerHTML = h;
}

function exportExpenseAnalysis() {
  const expenses = STORAGE.get('expenses', []);
  const journalEntries = getFilteredJournalEntries();
  const wb = XLSX.utils.book_new();
  
  const expenseCategories = {};
  let totalExp = 0;
  expenses.forEach(e => {
    const cat = e.category || 'Other';
    expenseCategories[cat] = (expenseCategories[cat] || 0) + (e.amount || 0);
    totalExp += (e.amount || 0);
  });
  journalEntries.forEach(entry => {
    if(!entry.lines) return;
    entry.lines.forEach(line => {
      const coa = STORAGE.get('chartOfAccounts', []).find(a => a.code === line.code);
      if(coa && coa.code.startsWith('5') && line.debit > 0) {
        const catName = lang === 'ar' ? coa.name_ar : coa.name_en;
        expenseCategories[catName] = (expenseCategories[catName] || 0) + line.debit;
        totalExp += line.debit;
      }
    });
  });
  
  const rows = Object.entries(expenseCategories).sort((a,b) => b[1]-a[1]).map(([cat, amt]) => [cat, amt, totalExp > 0 ? (amt/totalExp*100).toFixed(1)+'%' : '0%']);
  rows.push(['', '', '']);
  rows.push([t('acc_total'), totalExp, '100%']);
  
  const ws = XLSX.utils.aoa_to_sheet([[t('acc_expenseByCategory'), t('acc_journalDebit'), '%'], ...rows]);
  ws['!cols'] = [{wch:30},{wch:18},{wch:10}];
  XLSX.utils.book_append_sheet(wb, ws, t('acc_expenseAnalysis'));
  XLSX.writeFile(wb, 'marts_expense_analysis_' + today() + '.xlsx');
}

function applyRevenueFilter() {
  const fromDate = document.getElementById('ra_from')?.value || '';
  const toDate = document.getElementById('ra_to')?.value || '';
  const franchiseId = document.getElementById('ra_franchise')?.value || '';
  const branchId = document.getElementById('ra_branch')?.value || '';
  const clientFilter = document.getElementById('ra_client')?.value || '';
  const salesPersonFilter = document.getElementById('ra_salesPerson')?.value || '';
  
  const sales = STORAGE.get('sales', []);
  const journalEntries = getFilteredJournalEntries();
  const franchises = STORAGE.get('franchises', []);
  const employees = STORAGE.get('employees', []);
  
  function inDateRange(d) {
    if(!d) return true;
    if(fromDate && d < fromDate) return false;
    if(toDate && d > toDate) return false;
    return true;
  }
  function matchFranchise(fId) {
    if(!franchiseId) return true;
    return fId === franchiseId;
  }
  function matchBranch(bId) {
    if(!branchId) return true;
    return bId === branchId;
  }
  
  const revenueByClient = {};
  const revenueByProject = {};
  const revenueBySalesPerson = {};
  const revenueByMonth = {};
  const revenueByFranchise = {};
  let totalRev = 0;
  
  sales.filter(s => inDateRange(s.date) && matchFranchise(s.franchiseId) && (!clientFilter || s.client === clientFilter)).forEach(s => {
    const emp = employees.find(e => e.id === s.salesPersonId);
    const spName = emp ? emp.name : 'Unknown';
    if(salesPersonFilter && spName !== salesPersonFilter) return;
    
    const amt = s.unitPrice || 0;
    totalRev += amt;
    
    const client = s.client || 'Unknown';
    revenueByClient[client] = (revenueByClient[client] || 0) + amt;
    
    const project = s.project || 'Unknown';
    revenueByProject[project] = (revenueByProject[project] || 0) + amt;
    
    revenueBySalesPerson[spName] = (revenueBySalesPerson[spName] || 0) + amt;
    
    const month = (s.date || '').substring(0, 7);
    if(month) revenueByMonth[month] = (revenueByMonth[month] || 0) + amt;
    
    if(s.franchiseId) {
      const f = franchises.find(fr => fr.id === s.franchiseId);
      const fName = f ? (lang === 'ar' ? f.name_ar : f.name_en) : 'Other';
      revenueByFranchise[fName] = (revenueByFranchise[fName] || 0) + amt;
    }
  });
  
  journalEntries.filter(e => inDateRange(e.date) && matchFranchise(e.franchiseId) && matchBranch(e.branchId)).forEach(entry => {
    if(!entry.lines) return;
    entry.lines.forEach(line => {
      const coa = STORAGE.get('chartOfAccounts', []).find(a => a.code === line.code);
      if(coa && coa.type === 'revenue' && line.credit > 0) {
        const catName = lang === 'ar' ? coa.name_ar : coa.name_en;
        if(!revenueByClient[catName]) revenueByClient[catName] = 0;
        revenueByClient[catName] += line.credit;
        totalRev += line.credit;
        
        const month = (entry.date || '').substring(0, 7);
        if(month) revenueByMonth[month] = (revenueByMonth[month] || 0) + line.credit;
        
        if(entry.franchiseId) {
          const f = franchises.find(fr => fr.id === entry.franchiseId);
          const fName = f ? (lang === 'ar' ? f.name_ar : f.name_en) : 'Other';
          revenueByFranchise[fName] = (revenueByFranchise[fName] || 0) + line.credit;
        }
      }
    });
  });
  
  const sortedClients = Object.entries(revenueByClient).sort((a, b) => b[1] - a[1]);

  const cfg = ACC_COLUMNS[section];
  if(!cfg) return;
  const data = STORAGE.get(cfg.storage, []);
  const employees = STORAGE.get('employees',[]);

  const rows = data.map(item => {
    return cfg.keys.map(k => {
      if(k === 'empName') {
        const emp = employees.find(e => e.id === item.empId);
        return emp ? emp.name : '-';
      }
      return item[k] !== undefined ? item[k] : '';
    });
  });

  const totalAmount = data.reduce((s,x) => s + (x.amount||0), 0);
  rows.push([]);
  rows.push(['','','الإجمالي', totalAmount]);

  const ws = XLSX.utils.aoa_to_sheet([cfg.headers, ...rows]);
  ws['!cols'] = cfg.headers.map(() => ({wch: 18}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, cfg.label);
  XLSX.writeFile(wb, 'marts_' + section + '_' + today() + '.xlsx');
}

function uploadAccExcel(section) {
  const cfg = ACC_COLUMNS[section];
  if(!cfg) return;
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.xlsx,.xls,.csv';
  input.onchange = function(e) {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        const wb = XLSX.read(ev.target.result, {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(ws, {header:1});
        if(json.length < 2) { alert(t('acc_importError')); return; }

        const employees = STORAGE.get('employees',[]);
        const existing = STORAGE.get(cfg.storage, []);
        let imported = 0;

        for(let i = 1; i < json.length; i++) {
          const row = json[i];
          if(!row || row.length === 0 || (row.length <= 1 && !row[0])) continue;

          const item = {id: uid()};
          cfg.keys.forEach((key, idx) => {
            const val = row[idx];
            if(key === 'empName') {
              const emp = employees.find(e => e.name === val || e.name?.trim() === String(val).trim());
              item.empId = emp ? emp.id : (employees.length > 0 ? employees[0].id : '');
            } else if(key === 'amount') {
              item[key] = parseFloat(val) || 0;
            } else {
              item[key] = val !== undefined ? String(val).trim() : '';
            }
          });

          if(item[cfg.keys[0]] || item.amount) {
            existing.push(item);
            imported++;
          }
        }

        STORAGE.set(cfg.storage, existing);
        alert(t('acc_importSuccess') + ': ' + imported);
        if(section === 'treasury') renderTreasury();
        else if(section === 'salaries') renderSalaries();
        else if(section === 'partners') renderPartners();
        else if(section === 'expenses') renderExpenses();
      } catch(err) {
        alert(t('acc_importError') + ': ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  };
  input.click();
}

function downloadAllAccExcel() {
  const wb = XLSX.utils.book_new();
  const employees = STORAGE.get('employees',[]);

  Object.keys(ACC_COLUMNS).forEach(section => {
    const cfg = ACC_COLUMNS[section];
    const data = STORAGE.get(cfg.storage, []);
    const rows = data.map(item => {
      return cfg.keys.map(k => {
        if(k === 'empName') { const emp = employees.find(e=>e.id===item.empId); return emp?emp.name:'-'; }
        return item[k] !== undefined ? item[k] : '';
      });
    });
    const totalAmount = data.reduce((s,x) => s+(x.amount||0), 0);
    rows.push([]);
    rows.push(['','','الإجمالي', totalAmount]);
    const ws = XLSX.utils.aoa_to_sheet([cfg.headers, ...rows]);
    ws['!cols'] = cfg.headers.map(()=>({wch:18}));
    XLSX.utils.book_append_sheet(wb, ws, cfg.label);
  });

  // Summary sheet
  const treasury = STORAGE.get('treasury',[]);
  const salaries = STORAGE.get('salaries',[]);
  const partners = STORAGE.get('partners',[]);
  const expenses = STORAGE.get('expenses',[]);
  const tBalance = treasury.reduce((s,e)=>s+(e.type==='income'?e.amount:-e.amount),0);
  const tSalaries = salaries.reduce((s,x)=>s+(x.amount||0),0);
  const tPartners = partners.reduce((s,x)=>s+(x.amount||0),0);
  const tExpenses = expenses.reduce((s,x)=>s+(x.amount||0),0);
  const summary = [
    ['الملخص', 'المبلغ'],
    ['رصيد الخزينة', tBalance],
    ['إجمالي الرواتب', tSalaries],
    ['إجمالي الشركاء', tPartners],
    ['إجمالي المصروفات', tExpenses],
    [],
    ['الخزينة - الصافي', tBalance - tSalaries - tPartners - tExpenses]
  ];
  const wsS = XLSX.utils.aoa_to_sheet(summary);
  wsS['!cols'] = [{wch:20},{wch:15}];
  XLSX.utils.book_append_sheet(wb, wsS, 'الملخص');

  XLSX.writeFile(wb, 'marts_all_accounts_' + today() + '.xlsx');
}

function generateReport() {

  if(from) sales = sales.filter(s=>s.date>=from);
  if(to) sales = sales.filter(s=>s.date<=to);

  window._rptData = sales;
  document.getElementById('rptActions').style.display = sales.length > 0 ? 'flex' : 'none';

  const total = sales.reduce((s,x)=>s+(x.unitPrice||0),0);
  const totalComm = sales.reduce((s,x)=>s+(x.unitPrice||0)*(x.commissionRate||0)/100,0);
  const employees = STORAGE.get('employees',[]);
  const getEmpName = (id) => { const e=employees.find(x=>x.id===id); return e?e.name:'-'; };

  let h = `<div class="stats-grid">
    <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-dollar-sign"></i></div><div class="stat-info"><h4>${fmt(total)}</h4><p>${t('dash_totalSales')} (${sales.length})</p></div></div>

    <div class="stat-card"><div class="stat-icon yellow"><i class="fas fa-file-invoice-dollar"></i></div><div class="stat-info"><h4>${sales.length}</h4><p>${t('nav_sales')}</p></div></div>
    <div class="stat-card"><div class="stat-icon red"><i class="fas fa-chart-line"></i></div><div class="stat-info"><h4>${sales.length>0?fmt(total/sales.length):fmt(0)}</h4><p>${lang==='ar'?'متوسط سعر البيع':'Avg Sale Price'}</p></div></div>
  </div>`;

  if(sales.length > 0) {
    // Charts row
    h += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px">
      <div class="card"><h3>${t('report_monthlySales')}</h3><div style="position:relative;height:280px"><canvas id="chartMonthly"></canvas></div></div>
      <div class="card"><h3>${t('report_byProject')}</h3><div style="position:relative;height:280px"><canvas id="chartProject"></canvas></div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px">
      <div class="card"><h3>${t('report_byUnitType')}</h3><div style="position:relative;height:280px"><canvas id="chartUnitType"></canvas></div></div>
      <div class="card"><h3>${t('report_bySalesPerson')}</h3><div style="position:relative;height:280px"><canvas id="chartPerson"></canvas></div></div>
    </div>`;

    // Table
    h += '<div class="card" id="rptTableCard"><div class="table-wrap"><table><thead><tr><th>'+t('sale_code')+'</th><th>'+t('sale_date')+'</th><th>'+t('sale_client')+'</th><th>'+t('sale_project')+'</th><th>'+t('sale_unitType')+'</th><th>'+t('sale_price')+'</th><th>'+t('sale_commissionRate')+'</th><th>'+t('sale_commissionAmount')+'</th><th>'+t('sale_salesPerson')+'</th></tr></thead><tbody>';
    sales.forEach(s=>{h+=`<tr><td>${s.code}</td><td>${fmtDate(s.date)}</td><td>${s.client}</td><td>${s.project}</td><td>${s.unitType}</td><td>${fmt(s.unitPrice)}</td><td>${s.commissionRate}%</td><td>${fmt((s.unitPrice||0)*(s.commissionRate||0)/100)}</td><td>${getEmpName(s.salesPersonId)}</td></tr>`;});
    h+='</tbody></table></div></div>';
  } else {

function renderRptCharts(sales) {
  const chartColors = ['#827148','#A5AF79','#E8A07C','#C75B4A','#6B5C3A','#A5AF79cc','#E8A07Ccc','#827148cc','#C75B4Acc','#6B5C3Acc'];

  // 1. Monthly Sales
  const monthMap = {};
  sales.forEach(s => {
    const m = s.date ? s.date.slice(0,7) : 'Unknown';
    monthMap[m] = (monthMap[m]||0) + (s.unitPrice||0);
  });
  const monthLabels = Object.keys(monthMap).sort();
  const monthData = monthLabels.map(m=>monthMap[m]);
  new Chart(document.getElementById('chartMonthly'), {
    type:'bar',
    data:{labels:monthLabels.map(m=>{const [y,mo]=m.split('-');return mo+'/'+y.slice(2);}),datasets:[{label:t('sale_price'),data:monthData,backgroundColor:chartColors.map(c=>c+'cc'),borderColor:chartColors,borderWidth:2,borderRadius:8}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{callback:v=>fmt(v),color:'#666'},grid:{color:'rgba(130,113,72,.1)'}},x:{grid:{display:false},ticks:{color:'#666'}}}}
  });

  // 2. By Project
  const projMap = {};
  sales.forEach(s => { const p=s.project||'Other'; projMap[p]=(projMap[p]||0)+(s.unitPrice||0); });
  const projLabels = Object.keys(projMap);
  const projData = projLabels.map(p=>projMap[p]);
  new Chart(document.getElementById('chartProject'), {
    type:'doughnut',
    data:{labels:projLabels,datasets:[{data:projData,backgroundColor:chartColors.slice(0,projLabels.length),borderWidth:3,borderColor:'#1A1A1A'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{padding:12,font:{size:12},color:'#E8DCC8'}}}}
  });

  // 3. By Unit Type
  const unitMap = {};
  sales.forEach(s => { const u=s.unitType||'Other'; unitMap[u]=(unitMap[u]||0)+(s.unitPrice||0); });
  const unitLabels = Object.keys(unitMap);
  const unitData = unitLabels.map(u=>unitMap[u]);
  new Chart(document.getElementById('chartUnitType'), {
    type:'pie',
    data:{labels:unitLabels,datasets:[{data:unitData,backgroundColor:chartColors.slice(0,unitLabels.length).map(c=>c+'dd'),borderWidth:2,borderColor:'#1A1A1A'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{padding:12,font:{size:12},color:'#E8DCC8'}}}}
  });

  // 4. By Sales Person
  const employees = STORAGE.get('employees',[]);
  const empMap = {};
  sales.forEach(s => {
    const e = employees.find(x=>x.id===s.salesPersonId);
    const name = e ? e.name : '-';
    empMap[name] = (empMap[name]||0) + (s.unitPrice||0);
  });
  const empLabels = Object.keys(empMap);
  const empData = empLabels.map(e=>empMap[e]);
  new Chart(document.getElementById('chartPerson'), {
    type:'bar',
    data:{labels:empLabels,datasets:[{label:t('sale_price'),data:empData,backgroundColor:chartColors.slice(0,empLabels.length).map(c=>c+'bb'),borderColor:chartColors.slice(0,empLabels.length),borderWidth:2,borderRadius:8}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{callback:v=>fmt(v),color:'#666'},grid:{color:'rgba(130,113,72,.1)'}},y:{grid:{display:false},ticks:{color:'#666'}}}}
  });
}

    (e.name||'').toLowerCase().includes(q)||
    (e.nationalId||'').includes(q)||
    (e.personalPhone||'').includes(q)||
    (e.workPhone||'').includes(q)
  );
  const matchedSales = sales.filter(s=>
    (s.client||'').toLowerCase().includes(q)||
    (s.code||'').toLowerCase().includes(q)||
    (s.clientPhone||'').includes(q)||
    (s.project||'').toLowerCase().includes(q)
  );
  const matchedClients = getCrmClients().filter(c=>

    h+='</tbody></table></div></div>';
  }
  if(matchedSales.length>0) {
    h+='<div class="card"><h3>'+t('nav_sales')+' ('+matchedSales.length+')</h3><div class="table-wrap"><table><thead><tr><th>'+t('sale_code')+'</th><th>'+t('sale_client')+'</th><th>'+t('sale_project')+'</th><th>'+t('sale_unitType')+'</th><th>'+t('sale_price')+'</th><th>'+t('sale_date')+'</th></tr></thead><tbody>';
    matchedSales.forEach(s=>{h+=`<tr><td>${s.code}</td><td>${s.client}</td><td>${s.project}</td><td>${s.unitType}</td><td>${fmt(s.unitPrice)}</td><td>${fmtDate(s.date)}</td></tr>`;});
    h+='</tbody></table></div></div>';
  }
  if(matchedClients.length>0) {
    h+='<div class="card"><h3>'+t('nav_crm')+' ('+matchedClients.length+')</h3><div class="table-wrap"><table><thead><tr><th>'+t('crm_clientName')+'</th><th>'+t('crm_clientPhone')+'</th><th>'+t('crm_clientEmail')+'</th><th>'+t('crm_clientSource')+'</th><th>'+t('crm_clientStatus')+'</th></tr></thead><tbody>';

    h+='</tbody></table></div></div>';
  }
  if(!matchedEmps.length&&!matchedSales.length&&!matchedClients.length) h='<div class="card"><div class="empty-state"><p>'+t('noData')+'</p></div></div>';
  document.getElementById('searchResults').innerHTML=h;
}

function saveCrmClients(c){ STORAGE.set('crm_clients',c); }
function getCrmActivities(){ return STORAGE.get('crm_activities',[]); }

function generateTrialEmail(name){
  const slug = name.toLowerCase().replace(/[^a-z0-9\u0600-\u06FF]+/g,'').substring(0,12);
  const rand = Math.floor(1000+Math.random()*9000);
  return slug+rand+'@marts-eg.com';
}
function generateTrialPassword(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789@#$';
  let p='';for(let i=0;i<12;i++) p+=chars.charAt(Math.floor(Math.random()*chars.length));
  return p;
}
function addCrmActivity(clientId,type,desc){
  const acts=getCrmActivities();
  acts.push({id:'ca_'+Date.now(),clientId,type,desc,date:new Date().toISOString(),by:currentUser?currentUser.username:'system'});
  saveCrmActivities(acts);
}
function getCrmStatusLabel(s){ return t('crm_status_'+s); }
function getCrmSourceLabel(s){
  const map={facebook:'crm_sourceFacebook',instagram:'crm_sourceInstagram',referral:'crm_sourceReferral',walkin:'crm_sourceWalkIn',website:'crm_sourceWebsite',ad:'crm_sourceAd',other:'crm_sourceOther',meta:'crm_sourceMeta',google:'crm_sourceGoogle',x:'crm_sourceX',linkedin:'crm_sourceLinkedin',snapchat:'crm_sourceSnapchat',tiktok:'crm_sourceTiktok'};
  return t(map[s]||'crm_sourceOther');
}
function getCrmStatusClass(s){ return 'crm-status-'+s; }
function getCrmStageLabel(s){ return t('crm_stage_'+s); }
function getCrmStageClass(s){ return 'crm-stage-'+s; }
function changeCrmStage(clientId,newStage){
  const clients=getCrmClients();
  const c=clients.find(x=>x.id===clientId);
  if(c){
    const oldStage=c.stage||'fresh_leads';
    c.stage=newStage;
    c.lastContact=new Date().toISOString();
    saveCrmClients(clients);
    addCrmActivity(clientId,'status_changed',t('crm_stage_'+oldStage)+' → '+t('crm_stage_'+newStage));
  }
  openCrmClientDetail(clientId);
  renderCrmStats();
}

function switchCrmView(view, stageKey){
  document.querySelectorAll('.crm-nav-item').forEach(n => n.classList.remove('active'));
  if(view !== 'stage'){
    const navItem = Array.from(document.querySelectorAll('.crm-nav-item')).find(n => n.textContent.trim().toLowerCase().includes(view));
    if(navItem) navItem.classList.add('active');
  } else {
    const navItem = Array.from(document.querySelectorAll('.crm-nav-item')).find(n => n.textContent.trim().toLowerCase().includes('dashboard'));
    if(navItem) navItem.classList.add('active');
  }
  const content = document.getElementById('crmViewContent');
  if(view === 'dashboard') renderCrmDashboardView(content);
  else if(view === 'workspace') renderCrmWorkspaceView(content);
  else if(view === 'deals') renderCrmDealsView(content);
  else if(view === 'marketing') renderCrmMarketingView(content);
  else if(view === 'inventory') renderCrmInventoryView(content);
  else if(view === 'reports') renderCrmReportsView(content);
  else if(view === 'stage' && stageKey) renderCrmStageView(content, stageKey);
  else if(view === 'clientMgmt') renderCrmClientManagement(content);
  else content.innerHTML = `<div class="empty-state" style="padding:80px 20px"><i class="fas fa-tools" style="font-size:48px;color:var(--crm-text-muted)"></i><p style="margin-top:16px;color:var(--crm-text-muted)">${lang==='ar'?'قريباً':'Coming soon'}</p></div>`;
}

function updateCrmDateTime(){
  const el = document.getElementById('crmDateTime');
  if(el){
    const now = new Date();
    el.textContent = now.toLocaleDateString(lang==='ar'?'ar-EG':'en-US', {weekday:'long',year:'numeric',month:'long',day:'numeric'}) 
      + ' • ' + now.toLocaleTimeString(lang==='ar'?'ar-EG':'en-US', {hour:'2-digit',minute:'2-digit'});
  }
}

function getTopAgents(limit){
  const users = getAllUsers().filter(u => ['sales','tl','sm','marketer','ma','md'].includes(u.role));
  return users
    .map(u => ({
      ...u,
      score: Math.floor(Math.random() * 500) + 100 // simulated score
    }))
    .sort((a,b) => b.score - a.score)
    .slice(0, limit);
}

function getActivityIcon(type){
  const icons = {call:'fa-phone',meeting:'fa-handshake',email:'fa-envelope',note:'fa-sticky-note',created:'fa-user-plus',updated:'fa-pen',status_changed:'fa-arrow-right'};
  return icons[type] || 'fa-circle';
}

function initCrmDonutCharts(calls, messages, meetings, tasks, events, notes){
  // Activities Donut
  const actCtx = document.getElementById('crmDonutActivities');
  if(actCtx && !actCtx.chart){
    actCtx.chart = new Chart(actCtx, {
      type:'doughnut',
      data:{
        labels:[lang==='ar'?'مكالمات':'Calls',lang==='ar'?'رسائل':'Messages',lang==='ar'?'اجتماعات':'Meetings'],
        datasets:[{data:[calls,messages,meetings],backgroundColor:['var(--crm-success)','var(--crm-info)','var(--crm-warning)'],borderWidth:0,hoverOffset:4}]
      },
      options:{
        responsive:true,maintainAspectRatio:true,cutout:'70%',
        plugins:{legend:{display:false},tooltip:{enabled:true}},
        animation:{animateRotate:true,animateScale:true}
      }
    });
  }
  // TENS Donut
  const tensCtx = document.getElementById('crmDonutTENS');
  if(tensCtx && !tensCtx.chart){
    tensCtx.chart = new Chart(tensCtx, {
      type:'doughnut',
      data:{
        labels:[lang==='ar'?'مهام':'Tasks',lang==='ar'?'فعاليات':'Events',lang==='ar'?'ملاحظات':'Notes'],
        datasets:[{data:[tasks,events,notes],backgroundColor:['var(--crm-purple)','var(--crm-pink)','var(--crm-teal)'],borderWidth:0,hoverOffset:4}]
      },
      options:{
        responsive:true,maintainAspectRatio:true,cutout:'70%',
        plugins:{legend:{display:false},tooltip:{enabled:true}},
        animation:{animateRotate:true,animateScale:true}
      }
    });
  }
}

function showCrmTab(tabName, btn){
  document.querySelectorAll('.crm-tab-btn').forEach(b => {
    b.classList.remove('active');
    b.setAttribute('aria-selected','false');
  });
  btn.classList.add('active');
  btn.setAttribute('aria-selected','true');
  document.querySelectorAll('.crm-tab-pane').forEach(p => p.style.display = 'none');
  document.getElementById('crmTab'+tabName.charAt(0).toUpperCase()+tabName.slice(1)).style.display = 'block';
}

function filterCrmDashboard(){
  const leadFilter = (document.getElementById('crmFilterLeads')?.value || '').trim();
  const teamFilter = (document.getElementById('crmFilterTeam')?.value || '').trim();
  const agentFilter = (document.getElementById('crmFilterAgent')?.value || '').trim();
  const clients = getVisibleClients().filter(c => {
    if(leadFilter && (c.stage || 'fresh_leads') !== leadFilter) return false;
    if(agentFilter && c.assignedUser !== agentFilter) return false;
    if(teamFilter){
      const u = c.assignedUser ? getUserByUsername(c.assignedUser) : null;
      if(!u) return false;
      if(teamFilter === 'sales' && !['sales','tl','sm'].includes(u.role)) return false;
      if(teamFilter === 'marketing' && !['marketer','ma','md'].includes(u.role)) return false;
    }
    return true;
  });
  const stages = CRM_STAGES;
  const stageColors=['#827148','#827148','#F59E0B','#10B981','#3B82F6','#8B5CF6','#EC4899','#06B6D4','#F97316','#6366F1','#84CC16','#EF4444','#14B8A6','#22D3EE','#A855F7','#F43F5E','#64748B','#78716C','#FB923C','#38BDF8','#E11D48','#4ADE80','#FBBF24'];
  const stageStats = stages.map((s, idx) => ({
    stage: s,
    count: clients.filter(c => (c.stage || 'fresh_leads') === s).length,
    color: stageColors[idx % stageColors.length],
    change: Math.floor(Math.random() * 15) - 5
  }));
  const statsGrid = document.querySelector('.crm-stats-grid');
  if(statsGrid){
    statsGrid.innerHTML = stageStats.map(stat => {
      const changeClass = stat.change > 0 ? 'positive' : stat.change < 0 ? 'negative' : 'neutral';
      const changeSign = stat.change > 0 ? '+' : '';
      return `<div class="crm-stat-card clickable" onclick="switchCrmView('stage','${stat.stage}')" style="border-left:3px solid ${stat.color};cursor:pointer"><div class="stat-value">${stat.count}<span class="stat-change ${changeClass}">${changeSign}${stat.change}%</span></div><div class="stat-label">${t('crm_stage_'+stat.stage)}</div></div>`;
    }).join('');
  }
  const filterLabel = document.querySelector('.crm-filter-label .count');
  if(filterLabel) filterLabel.textContent = clients.length;
  const activities = getCrmActivities().slice(-8).reverse();
  const actList = document.querySelector('.crm-activity-list');
  if(actList){
    const recentActivities = activities.map(a => ({
      type: a.type, title: a.desc, clientId: a.clientId,
      meta: `${a.by || ''} • ${new Date(a.date).toLocaleDateString('ar-EG')}`,
      time: new Date(a.date).toLocaleTimeString('ar-EG', {hour:'2-digit',minute:'2-digit'})
    }));
    actList.innerHTML = recentActivities.length ? recentActivities.map(a => `<li class="crm-activity-item" onclick="${a.clientId ? `openCrmClientForm('${a.clientId}')` : ''}" style="${a.clientId ? 'cursor:pointer' : ''}"><div class="crm-activity-icon ${a.type}"><i class="fas ${getActivityIcon(a.type)}"></i></div><div class="crm-activity-content"><div class="crm-activity-title">${a.title}</div><div class="crm-activity-meta">${a.meta}</div></div><span class="crm-activity-time">${a.time}</span></li>`).join('') : `<li class="crm-activity-item" style="justify-content:center;padding:24px;color:var(--crm-text-muted)"><i class="fas fa-inbox" style="font-size:24px;margin-left:8px"></i> ${lang==='ar'?'لا توجد أنشطة حديثة':'No recent activities'}</li>`;
  }
}

function filterStagePage(){
  const search = (document.getElementById('stagePgSearch')?.value || '').toLowerCase();
  const status = document.getElementById('stagePgStatus')?.value || '';
  const agent = document.getElementById('stagePgAgent')?.value || '';
  document.querySelectorAll('#stagePgList .stage-client-row').forEach(row => {
    const name = row.dataset.name || '';
    const phone = row.dataset.phone || '';
    const st = row.dataset.status || '';
    const ag = row.dataset.agent || '';
    const matchSearch = !search || name.includes(search) || phone.includes(search);
    const matchStatus = !status || st === status;
    const matchAgent = !agent || ag === agent;
    row.style.display = (matchSearch && matchStatus && matchAgent) ? '' : 'none';
  });
}

function filterTransferList(){

  document.querySelectorAll('#transferAgentList .transfer-agent-item').forEach(row => {

function confirmTransferClient(clientId, newAgentUsername){
  const clients = getCrmClients();
  const idx = clients.findIndex(c => c.id === clientId);
  if(idx < 0) return;
  const client = clients[idx];
  const oldAgent = client.assignedUser || '';
  const oldAgentUser = oldAgent ? getUserByUsername(oldAgent) : null;
  const newAgentUser = getUserByUsername(newAgentUsername);
  const oldName = oldAgentUser ? (oldAgentUser.fullName || oldAgent) : (lang==='ar'?'غير معيّن':'Unassigned');
  const newName = newAgentUser ? (newAgentUser.fullName || newAgentUsername) : newAgentUsername;

  client.assignedUser = newAgentUsername;
  clients[idx] = client;
  saveCrmClients(clients);

  addCrmActivity(clientId, 'updated', (lang==='ar'?'تم التحويل من ':'Transferred from ') + oldName + (lang==='ar'?' إلى ':' to ') + newName);

  const modal = document.getElementById('transferClientModal');
  if(modal) modal.remove();

  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#10B981;color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;font-weight:600;z-index:10001;box-shadow:0 4px 20px rgba(165,175,121,.3);animation:fadeInToast .3s';
  toast.innerHTML = `<i class="fas fa-check-circle" style="margin-left:8px"></i>${lang==='ar'?'تم تحويل العميل إلى':'Client transferred to'} ${newName}`;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);

  const content = document.getElementById('crmViewContent');
  if(content) renderCrmStageView(content, client.stage || 'fresh_leads');
}

let cmgDragClientId = null;
function cmgDragStart(e, clientId){
  cmgDragClientId = clientId;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', clientId);
  e.target.style.opacity = '0.5';
  setTimeout(()=>{ if(e.target) e.target.style.opacity = ''; }, 0);
}

function cmgDropClient(e, targetAgent){
  e.preventDefault();
  e.currentTarget.style.background = '';
  const clientId = cmgDragClientId || e.dataTransfer.getData('text/plain');
  if(!clientId) return;
  cmgDragClientId = null;
  const clients = getCrmClients();
  const idx = clients.findIndex(c => c.id === clientId);
  if(idx < 0) return;
  const oldAgent = clients[idx].assignedUser || '';
  if(oldAgent === targetAgent) return;
  clients[idx].assignedUser = targetAgent;
  saveCrmClients(clients);
  const newAgentUser = targetAgent ? getUserByUsername(targetAgent) : null;
  const newName = newAgentUser ? (newAgentUser.fullName||targetAgent) : (lang==='ar'?'غير معيّن':'Unassigned');
  addCrmActivity(clientId, 'updated', (lang==='ar'?'تم التحويل إلى ':'Transferred to ') + newName);
  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#10B981;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:10001;box-shadow:0 4px 20px rgba(165,175,121,.3);animation:fadeInToast .3s';
  toast.innerHTML = `<i class="fas fa-check-circle" style="margin-left:6px"></i>${lang==='ar'?'تم النقل إلى':'Moved to'} ${newName}`;
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(), 2500);
  renderCrmClientManagement(document.getElementById('crmViewContent'));
}

function cmgChangeStage(clientId, newStage){
  const clients = getCrmClients();
  const idx = clients.findIndex(c => c.id === clientId);
  if(idx < 0) return;
  const oldStage = clients[idx].stage || 'fresh_leads';
  clients[idx].stage = newStage;
  saveCrmClients(clients);
  addCrmActivity(clientId, 'updated', (lang==='ar'?'تم تغيير المرحلة من ':'Stage changed from ') + t('crm_stage_'+oldStage) + (lang==='ar'?' إلى ':' to ') + t('crm_stage_'+newStage));
  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;top:24px;left:50%;transform:translateX(-50%);background:var(--crm-info);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:10001;box-shadow:0 4px 20px rgba(130,113,72,.3);animation:fadeInToast .3s';
  toast.innerHTML = `<i class="fas fa-check-circle" style="margin-left:6px"></i>${t('crm_stage_'+newStage)}`;
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(), 2500);
}

function cmgFilterByStatus(status){
  document.querySelectorAll('.cmg-status-chip').forEach(c=>c.classList.remove('active'));
  event.target.classList.add('active');
  document.querySelectorAll('.cmg-client-card').forEach(card=>{
    const clientId = card.dataset.clientId;
    const clients = getCrmClients();
    const c = clients.find(x=>x.id===clientId);
    if(!c) return;
    const match = !status || c.status === status;
    card.style.display = match ? '' : 'none';
  });
}

function filterCmgBoard(){
  const search = (document.getElementById('cmgSearchInput')?.value||'').toLowerCase();
  const agent = document.getElementById('cmgSearchAgent')?.value||'';
  document.querySelectorAll('.cmg-client-card').forEach(card=>{
    const clientId = card.dataset.clientId;
    const clients = getCrmClients();
    const c = clients.find(x=>x.id===clientId);
    if(!c) return;
    const matchSearch = !search || (c.name||'').toLowerCase().includes(search) || (c.phone||'').includes(search);
    const matchAgent = !agent || c.assignedUser === agent;
    card.style.display = (matchSearch && matchAgent) ? '' : 'none';
  });
}

function wsToggle(el){
  el.classList.toggle('on');

function wsChipFilter(el, filter){
  el.parentElement.querySelectorAll('.ws-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  const lg = lang==='ar';
  const labels = {late:lg?'متأخر':'Late', today:lg?'اليوم':'Today', tomorrow:lg?'غداً':'Tomorrow', upcoming:lg?'القادمة':'Upcoming'};
  wsToast(labels[filter] || filter);
}

function wsToggleFilters(){
  const panel = document.querySelector('.ws-filters-card');
  if(panel) panel.style.display = panel.style.display === 'none' ? '' : 'none';
}

function wsCloseFilters(){
  const panel = document.querySelector('.ws-filters-card');
  if(panel) panel.style.display = 'none';
}

function wsClearFilters(){
  document.querySelectorAll('.ws-filters-card select').forEach(s => s.value = '');
  document.querySelectorAll('.ws-filters-card input[type="date"]').forEach(d => d.value = '');
  wsToast(lang==='ar'?'تم مسح الفلاتر':'Filters cleared');

function wsExport(type){
  const rows = document.querySelectorAll('.ws-row');
  if(!rows.length){
    wsToast(lang==='ar'?'لا توجد بيانات':'No data');
    return;
  }
  let csv = '\uFEFF' + (lang==='ar'?'الاسم,المرحلة,الميزانية,المشروع':'Name,Stage,Budget,Project') + '\n';
  rows.forEach(r => {
    const name = r.querySelector('.ws-row-name')?.textContent || '';
    const stage = r.querySelector('.ws-pill')?.textContent?.trim() || '';
    const budget = r.querySelector('.ws-row-desc')?.textContent || '';
    csv += `"${name}","${stage}","${budget}",""\n`;
  });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'workspace_' + type + '_' + new Date().toISOString().split('T')[0] + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  wsToast((lang==='ar'?'تم التصدير: ':'Exported: ') + type);
}

  document.querySelectorAll('.ws-row-checkbox input').forEach(cb => cb.checked = select);

function wsSearchRows(query){
  const q = query.toLowerCase();
  document.querySelectorAll('.ws-row').forEach(row => {
    const text = row.textContent.toLowerCase();
    row.style.display = text.includes(q) ? '' : 'none';
  });

function wsCallClient(id){
  const clients = getCrmClients();
  const c = clients.find(x=>x.id===id);
  if(c && c.phone){
    wsToast((lang==='ar'?'الاتصال بـ ':'Calling ') + c.name);
  } else {
    wsToast(lang==='ar'?'لا يوجد رقم':'No phone number');
  }
}

function wsRejectClient(id){
  const clients = getCrmClients();
  const idx = clients.findIndex(x=>x.id===id);
  if(idx >= 0){
    clients[idx].status = 'cancelled';
    saveCrmClients(clients);
    addCrmActivity(id, 'status_changed', lang==='ar'?'تم رفض العميل من Workspace':'Client rejected from Workspace');
    wsToast(lang==='ar'?'تم رفض العميل':'Client rejected');
    renderCrmWorkspaceView(document.getElementById('crmViewContent'));
  }
}

function wsWhatsAppClient(phone){
  if(phone){
    wsToast('WhatsApp: ' + phone);
  } else {
    wsToast(lang==='ar'?'لا يوجد رقم':'No phone number');
  }
}

function wsToast(msg){
  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;top:24px;left:50%;transform:translateX(-50%);background:var(--crm-primary);color:#000;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:10001;box-shadow:0 4px 20px rgba(130,113,72,.3);animation:fadeInToast .3s';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(), 2500);
}

function renderCrmStats(){
  const clients=getVisibleClients();
  const total=clients.length;
  const newC=clients.filter(c=>c.status==='new').length;
  const converted=clients.filter(c=>c.status==='converted').length;
  const rate=total>0?Math.round(converted/total*100):0;
  const pipelineVal=clients.filter(c=>CRM_PIPELINE_STATUSES.includes(c.status)).reduce((s,c)=>s+(parseFloat(c.budget)||0),0);
  const hotCases=clients.filter(c=>(c.stage||'')==='hot_cases').length;
  const doneDeals=clients.filter(c=>(c.stage||'')==='done_deal').length;
  const scheduled=clients.filter(c=>(c.stage||'')==='scheduled_meeting'||(c.stage||'')==='rotation_scheduled').length;
  document.getElementById('crmStats').innerHTML=`
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-users"></i></div><div class="stat-info"><h4>${total}</h4><p>${t('crm_totalClients')}</p></div></div>
      <div class="stat-card"><div class="stat-icon yellow"><i class="fas fa-user-plus"></i></div><div class="stat-info"><h4>${newC}</h4><p>${t('crm_newClients')}</p></div></div>
      <div class="stat-card"><div class="stat-icon green"><i class="fas fa-user-check"></i></div><div class="stat-info"><h4>${converted}</h4><p>${t('crm_convertedClients')}</p></div></div>
      <div class="stat-card"><div class="stat-icon purple"><i class="fas fa-chart-line"></i></div><div class="stat-info"><h4>${rate}%</h4><p>${t('crm_conversionRate')}</p></div></div>
      <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-coins"></i></div><div class="stat-info"><h4>${fmt(pipelineVal)}</h4><p>${t('crm_pipelineValue')}</p></div></div>
      <div class="stat-card"><div class="stat-icon red"><i class="fas fa-fire"></i></div><div class="stat-info"><h4>${hotCases}</h4><p>${lang==='ar'?'حالات ساخنة':'Hot Cases'}</p></div></div>
      <div class="stat-card"><div class="stat-icon green"><i class="fas fa-check-circle"></i></div><div class="stat-info"><h4>${doneDeals}</h4><p>${t('crm_stage_done_deal')}</p></div></div>
