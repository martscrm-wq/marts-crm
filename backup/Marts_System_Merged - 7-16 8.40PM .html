  renderPage('sales');
}

function getRulesHash() {
  const roles = getAllRoles();
  return JSON.stringify(roles.map(r=>({id:r.id,type:r.type,rate:r.rate,tiers:r.tiers,defaultTarget:r.defaultTarget})));
}

function applyRulesToSale(saleId) {
  let sales = STORAGE.get('sales',[]);
  const sale = sales.find(s=>s.id===saleId);
  if(!sale) return;
  const employees = STORAGE.get('employees',[]);
  const spEmp = employees.find(e=>e.id===sale.salesPersonId);
  if(!spEmp) return;
  const roleCfg = getRoleConfig(spEmp.role);
  if(!roleCfg) return;

  let newRate = sale.commissionRate;
  if(roleCfg.type === 'fixed') {
    newRate = 3.5;
  } else if(roleCfg.type === 'per_million') {
    newRate = 3.5;
  } else if(roleCfg.type === 'sales_tier') {
    const monthStart = new Date(sale.date);
    monthStart.setDate(1);
    const monthStartStr = monthStart.toISOString().slice(0,10);
    const monthSales = sales.filter(s=>s.date>=monthStartStr && s.date<=sale.date && s.salesPersonId===sale.salesPersonId && s.id!==saleId);
    const totalSold = monthSales.reduce((s,x)=>s+(x.unitPrice||0),0) + (sale.unitPrice||0);
    const target = roleCfg.defaultTarget || 10000000;
    const ach = Math.min(100, (totalSold/target)*100);
    newRate = ach <= 50 ? roleCfg.tiers[0].rate/1000 : ach <= 80 ? roleCfg.tiers[1].rate/1000 : roleCfg.tiers[2].rate/1000;
  }

  sales = sales.map(s => {
    if(s.id === saleId) {
      return {...s, commissionRate: newRate, commRuleHash: getRulesHash()};
    }
    return s;
  });
  STORAGE.set('sales', sales);
  alert(t('comm_updated'));
  renderPage('sales');
}

function applyRulesToAll() {
  if(!confirm(t('comm_applyConfirm'))) return;
  let sales = STORAGE.get('sales',[]);
  const employees = STORAGE.get('employees',[]);
  const currentHash = getRulesHash();
  let updated = 0;

  sales = sales.map(s => {
    if(s.commRuleHash === currentHash) return s;
    const spEmp = employees.find(e=>e.id===s.salesPersonId);
    if(!spEmp) return {...s, commRuleHash: currentHash};
    const roleCfg = getRoleConfig(spEmp.role);
    if(!roleCfg) return {...s, commRuleHash: currentHash};

    let newRate = s.commissionRate;
    if(roleCfg.type === 'fixed') {
      newRate = 3.5;
    } else if(roleCfg.type === 'per_million') {
      newRate = 3.5;
    } else if(roleCfg.type === 'sales_tier') {
      const monthStart = new Date(s.date);
      monthStart.setDate(1);
      const monthStartStr = monthStart.toISOString().slice(0,10);
      const monthSales = sales.filter(x=>x.date>=monthStartStr && x.date<=s.date && x.salesPersonId===s.salesPersonId && x.id!==s.id);
      const totalSold = monthSales.reduce((a,x)=>a+(x.unitPrice||0),0) + (s.unitPrice||0);
      const target = roleCfg.defaultTarget || 10000000;
      const ach = Math.min(100, (totalSold/target)*100);
      newRate = ach <= 50 ? roleCfg.tiers[0].rate/1000 : ach <= 80 ? roleCfg.tiers[1].rate/1000 : roleCfg.tiers[2].rate/1000;
    }

    updated++;
    return {...s, commissionRate: newRate, commRuleHash: currentHash};
  });

  STORAGE.set('sales', sales);
  alert(t('comm_applied') + ': ' + updated);
  renderCommRules();
}

function filterEmpList() {
  let employees = STORAGE.get('employees',[]);
  const search = (document.getElementById('empFilterSearch')?.value||'').trim().toLowerCase();
  const role = document.getElementById('empFilterRole')?.value || '';
  const status = document.getElementById('empFilterStatus')?.value || '';
  const salaryFrom = parseFloat(document.getElementById('empFilterSalaryFrom')?.value) || 0;
  const salaryTo = parseFloat(document.getElementById('empFilterSalaryTo')?.value) || Infinity;

  if(search) {
    employees = employees.filter(e =>
      (e.name||'').toLowerCase().includes(search)
      || (e.nationalId||'').toLowerCase().includes(search)
      || (e.personalPhone||'').includes(search)
      || (e.workPhone||'').includes(search)
      || (e.address||'').toLowerCase().includes(search)
      || getRoleLabel(e.role).toLowerCase().includes(search)
    );
  }
  if(role) employees = employees.filter(e=>e.role===role);
  if(status) employees = employees.filter(e=>e.status===status);
  if(salaryFrom>0) employees = employees.filter(e=>(e.salary||0)>=salaryFrom);
  if(salaryTo<Infinity) employees = employees.filter(e=>(e.salary||0)<=salaryTo);

  const countEl = document.getElementById('empFilterCount');
  if(countEl) countEl.textContent = employees.length + ' ' + t('emp_filterResults');

  if(employees.length===0) { document.getElementById('empTable').innerHTML='<div class="empty-state"><p>'+t('emp_filterNoResult')+'</p></div>'; return; }
  const allSales = STORAGE.get('sales',[]);
  let h='<table><thead><tr><th>'+t('emp_name')+'</th><th>'+t('emp_role')+'</th><th>'+t('emp_nationalId')+'</th><th>'+t('emp_personalPhone')+'</th><th>'+t('emp_workPhone')+'</th><th>'+t('emp_address')+'</th><th>'+t('emp_salary')+'</th><th>'+t('emp_target')+'</th><th>'+t('emp_achievement')+'</th><th>'+t('emp_status')+'</th><th>'+t('emp_files')+'</th><th></th></tr></thead><tbody>';
  employees.forEach(emp => {
    const files = emp.files || [];
    const fileBadge = files.length > 0
      ? `<span class="badge badge-green" style="cursor:pointer" onclick="openEmpFiles('${emp.id}')"><i class="fas fa-paperclip"></i> ${files.length}</span>`
      : `<span class="badge badge-yellow">${t('emp_noFiles')}</span>`;
    const empSales = allSales.filter(s => s.salesPersonId === emp.id);
    const totalSalesAmount = empSales.reduce((sum, s) => sum + (s.unitPrice || 0), 0);
    const target = emp.target || 0;
    let achievementPct = 0;
    if(target > 0) {
      achievementPct = Math.round((totalSalesAmount / target) * 100);
    }
    let achColor = 'var(--danger)';
    let achBg = 'rgba(217,79,79,.12)';
    if(target === 0) { achColor = 'var(--text-light)'; achBg = 'rgba(0,0,0,.05)'; }
    else if(achievementPct >= 100) { achColor = 'var(--success)'; achBg = 'rgba(76,175,80,.12)'; }
    else if(achievementPct >= 70) { achColor = 'var(--accent)'; achBg = 'rgba(130,113,72,.12)'; }
    else if(achievementPct >= 40) { achColor = '#827148'; achBg = 'rgba(218,165,32,.12)'; }
    const achLabel = target > 0 ? achievementPct + '%' : '-';
    h+=`<tr>
      <td><strong>${emp.name}</strong></td>
      <td><span class="badge badge-blue">${getRoleLabel(emp.role)}</span></td>
      <td>${emp.nationalId||'-'}</td><td>${emp.personalPhone||'-'}</td><td>${emp.workPhone||'-'}</td>
      <td>${emp.address||'-'}</td><td>${fmt(emp.salary)}</td><td>${fmt(emp.target)}</td>
      <td><span style="display:inline-flex;align-items:center;gap:6px"><span style="background:${achBg};color:${achColor};padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700">${achLabel}</span>${target>0?'<span style="font-size:11px;color:var(--text-light)">'+fmt(totalSalesAmount)+'</span>':''}</span></td>
      <td><span class="badge ${emp.status==='active'?'badge-green':'badge-red'}">${emp.status==='active'?t('emp_active'):t('emp_inactive')}</span></td>
      <td>${fileBadge}</td>

    </tr>`;
  });
  h+='</tbody></table>';
  document.getElementById('empTable').innerHTML=h;
}

function createAutoJournalEntry(type, data) {
  const journalEntries = STORAGE.get('journalEntries', []);
  const lines = [];
  
  if(type === 'new_employee') {
    lines.push({code:'5310', debit: data.amount || 0, credit: 0});
    lines.push({code:'2150', debit: 0, credit: data.amount || 0});
  } else if(type === 'new_sale') {
    lines.push({code:'1140', debit: data.amount || 0, credit: 0});
    lines.push({code:'4100', debit: 0, credit: data.amount || 0});
  } else if(type === 'new_expense') {
    lines.push({code:'5330', debit: data.amount || 0, credit: 0});
    lines.push({code:'1120', debit: 0, credit: data.amount || 0});
  } else if(type === 'treasury_income') {
    lines.push({code:'1120', debit: data.amount || 0, credit: 0});
    lines.push({code:'4100', debit: 0, credit: data.amount || 0});
  } else if(type === 'treasury_expense') {
    lines.push({code:'5330', debit: data.amount || 0, credit: 0});
    lines.push({code:'1120', debit: 0, credit: data.amount || 0});
  } else if(type === 'salary_payment') {
    lines.push({code:'5310', debit: data.amount || 0, credit: 0});
    lines.push({code:'1120', debit: 0, credit: data.amount || 0});
  }
  
  if(lines.length > 0) {
    journalEntries.push({
      id: uid(),
      date: data.date || today(),
      ref: data.ref || 'AUTO-' + uid(),
      desc: data.desc || '',
      franchiseId: data.franchiseId || '',
      branchId: data.branchId || '',
      status: 'approved',
      autoGenerated: true,
      sourceType: type,
      lines: lines
    });
    STORAGE.set('journalEntries', journalEntries);
  }
}

function handleEmpFileSelect(event) {
  const files = event.target.files;
  if(!files.length) return;
  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = function(e) {
      window._pendingEmpFiles = window._pendingEmpFiles || [];
      window._pendingEmpFiles.push({
        name: file.name,
        size: file.size,
        type: file.type,
        date: today(),
        data: e.target.result
      });
      renderEmpFilesList();
    };
    reader.readAsDataURL(file);
  });
  event.target.value = '';
}

function renderEmpFilesList() {
  const container = document.getElementById('empFilesList');
  if(!container) return;
  const files = window._pendingEmpFiles || [];
  if(files.length === 0) { container.innerHTML = '<p style="color:var(--text-light);font-size:13px">'+t('emp_noFiles')+'</p>'; return; }
  let h = '<table style="font-size:13px"><thead><tr><th>'+t('emp_fileName')+'</th><th>'+t('emp_fileSize')+'</th><th>'+t('emp_fileDate')+'</th><th></th></tr></thead><tbody>';
  files.forEach((f, i) => {
    const sizeKB = (f.size/1024).toFixed(1);
    const sizeStr = sizeKB > 1024 ? (sizeKB/1024).toFixed(1)+' MB' : sizeKB+' KB';
    const icon = f.type.includes('pdf') ? 'fa-file-pdf' : f.type.includes('image') ? 'fa-file-image' : 'fa-file-word';
    h += `<tr>
      <td><i class="fas ${icon}" style="color:var(--danger);margin-left:6px"></i> ${f.name}</td>
      <td>${sizeStr}</td>
      <td>${fmtDate(f.date)}</td>
      <td>
        <a href="${f.data}" download="${f.name}" class="btn btn-outline btn-sm" style="padding:4px 10px;font-size:12px"><i class="fas fa-download"></i></a>
        <button class="btn btn-danger btn-sm" style="padding:4px 10px;font-size:12px" onclick="removeEmpFile(${i})"><i class="fas fa-trash"></i></button>
      </td>
    </tr>`;
  });
  h += '</tbody></table>';
  container.innerHTML = h;
}

function downloadEmpTemplate() {

    [lang==='ar'?'دليل استخدام قالب إضافة الموظفين':'Employee Import Template Guide'],
    [''],
    [lang==='ar'?'الأعمدة المطلوبة (الاسم م obrigatório):':'Required columns (name is mandatory):'],
    [lang==='ar'?'- الاسم (اسم الموظف) - مطلوب':'- name (employee name) - REQUIRED'],
    [lang==='ar'?'- الدور الوظيفي (استخدم الكود من القائمة أدناه)':'- role (use code from list below)'],
    [lang==='ar'?'- رقم البطاقة الوطنية':'- nationalId'],
    [lang==='ar'?'- الهاتف الشخصي':'- personalPhone'],
    [lang==='ar'?'- رقم العمل':'- workPhone'],
    [lang==='ar'?'- العنوان':'- address'],
    [lang==='ar'?'- الراتب الأساسي (رقم)':'- salary (number)'],
    [lang==='ar'?'- الهدف البيعي (رقم)':'- target (number)'],
    [lang==='ar'?'- نسبة KPI (رقم من 0 إلى 100)':'- kpi (number 0-100)'],
    [lang==='ar'?'- تاريخ البدء (YYYY-MM-DD)':'- startDate (YYYY-MM-DD)'],
    [lang==='ar'?'- الحالة (active أو inactive)':'- status (active or inactive)'],
    [lang==='ar'?'- المشرف (id للمشرف)':'- supervisor (supervisor employee id)'],
    [''],
    [lang==='ar'?'الأدوار المتاحة:':'Available roles:'],
  ];
  roles.forEach(r => { info.push([r.id + ' = ' + r.ar + ' / ' + r.en]); });
  info.push(['']);
  info.push([lang==='ar'?'ملاحظات:':'Notes:']);
  info.push([lang==='ar'?'- يمكنك إضافة أعمدة إضافية وسيتم تجاهلها':'- You can add extra columns and they will be ignored']);
  info.push([lang==='ar'?'- أي صف بدون اسم سيتم تجاهله':'- Any row without a name will be skipped']);

  const sampleRows = roles.slice(0,3).map((r,i) => [
    (lang==='ar'?'موظف تجريبي':'Sample Employee') + ' ' + (i+1),
    r.id,
    '2900101123456' + i,
    '0101234567' + i,
    '0101111111' + i,
    lang==='ar'?'العنوان':'Address',
    8000 + (i*2000),
    10000000,
    75 + (i*5),
    '2025-01-' + (10+i),
    'active',
    ''
  ]);

  const wsInfo = XLSX.utils.aoa_to_sheet(info);
  wsInfo['!cols'] = [{wch:60}];
  const wsData = XLSX.utils.aoa_to_sheet([headers, ...sampleRows]);
  wsData['!cols'] = headers.map(()=>({wch:18}));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsInfo, lang==='ar'?'الدليل':'Guide');
  XLSX.utils.book_append_sheet(wb, wsData, 'Employees');
  XLSX.writeFile(wb, 'employees_template.xlsx');
}

function importEmpExcel(event) {
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const wb = XLSX.read(e.target.result, {type:'array'});
      const wsName = wb.SheetNames.find(s => s.toLowerCase() === 'employees') || wb.SheetNames[wb.SheetNames.length - 1];
      const ws = wb.Sheets[wsName];
      const data = XLSX.utils.sheet_to_json(ws);
      let employees = STORAGE.get('employees', []);
      let added = 0;
      let skipped = 0;
      data.forEach(row => {
        const name = (row.name || row['الاسم'] || '').trim();
        if(!name) { skipped++; return; }
        const roleVal = String(row.role || row['الدور'] || 'property_consultant').trim();
        const allRoles = getAllRoles();
        const matchedRole = allRoles.find(r => r.id === roleVal || r.ar === roleVal || r.en.toLowerCase() === roleVal.toLowerCase());
        employees.push({
          id: uid(),
          role: matchedRole ? matchedRole.id : 'property_consultant',
          name: name,
          nationalId: String(row.nationalId || row['البطاقة'] || ''),
          personalPhone: String(row.personalPhone || row['الهاتف'] || row.phone || ''),
          workPhone: String(row.workPhone || row['رقم العمل'] || ''),
          address: row.address || row['العنوان'] || '',
          salary: parseFloat(row.salary || row['الراتب']) || 0,
          target: parseFloat(row.target || row['الهدف']) || 0,
          kpi: parseFloat(row.kpi || row['KPI']) || 0,
          startDate: row.startDate || row['تاريخ البدء'] || '',
          status: (row.status || row['الحالة'] || 'active').toLowerCase(),
          supervisor: row.supervisor || row['المشرف'] || '',
          files: []
        });
        added++;
      });
      STORAGE.set('employees', employees);
      alert((lang==='ar'?'تم استيراد ':'Imported ') + added + (lang==='ar'?' موظف بنجاح':' employees successfully') + (skipped > 0 ? ('\n' + (lang==='ar'?'تم تجاهل ':'Skipped ') + skipped + (lang==='ar'?' صف (بدون اسم)':' rows (no name)')) : ''));
      renderHrTabContent();
    } catch(err) { alert('Import error: ' + err.message); }
  };
  reader.readAsArrayBuffer(file);
  event.target.value = '';
}

function deleteAllEmployees() {
  const count = STORAGE.get('employees', []).length;
  if(count === 0) { alert(lang==='ar'?'لا يوجد موظفين':'No employees to delete'); return; }

    : 'Are you sure you want to delete ALL employees (' + count + ')?\n\nThis action cannot be undone!';

  const confirmMsg2 = lang==='ar'
    ? 'تأكيد أخير: اكتب "حذف" للتأكيد'

function filterHrEmpList() {
  let employees = STORAGE.get('employees',[]);
  const search = (document.getElementById('empFilterSearch')?.value||'').trim().toLowerCase();
  const role = document.getElementById('empFilterRole')?.value || '';
  const status = document.getElementById('empFilterStatus')?.value || '';
  const salaryFrom = parseFloat(document.getElementById('empFilterSalaryFrom')?.value) || 0;
  const salaryTo = parseFloat(document.getElementById('empFilterSalaryTo')?.value) || Infinity;
  if(search) employees = employees.filter(e => (e.name||'').toLowerCase().includes(search)||(e.nationalId||'').toLowerCase().includes(search)||(e.personalPhone||'').includes(search)||(e.workPhone||'').includes(search));
  if(role) employees = employees.filter(e=>e.role===role);
  if(status) employees = employees.filter(e=>e.status===status);
  if(salaryFrom>0) employees = employees.filter(e=>(e.salary||0)>=salaryFrom);
  if(salaryTo<Infinity) employees = employees.filter(e=>(e.salary||0)<=salaryTo);
  const countEl = document.getElementById('empFilterCount');
  if(countEl) countEl.textContent = employees.length + ' ' + t('emp_filterResults');
  if(employees.length===0) { document.getElementById('hrEmpTable').innerHTML='<div class="empty-state"><p>'+t('emp_filterNoResult')+'</p></div>'; return; }
  let h='<table><thead><tr><th>'+t('emp_name')+'</th><th>'+t('emp_role')+'</th><th>'+t('emp_nationalId')+'</th><th>'+t('emp_personalPhone')+'</th><th>'+t('emp_salary')+'</th><th>'+t('emp_target')+'</th><th>'+t('emp_kpi')+'</th><th>'+t('emp_status')+'</th><th></th></tr></thead><tbody>';
  employees.forEach(emp => {
    h+=`<tr>
      <td><strong>${emp.name}</strong></td>
      <td><span class="badge badge-blue">${getRoleLabel(emp.role)}</span></td>
      <td>${emp.nationalId||'-'}</td><td>${emp.personalPhone||'-'}</td>
      <td>${fmt(emp.salary)}</td><td>${fmt(emp.target)}</td>
      <td>${emp.kpi?emp.kpi+'%':'-'}</td>
      <td><span class="badge ${emp.status==='active'?'badge-green':'badge-red'}">${emp.status==='active'?t('emp_active'):t('emp_inactive')}</span></td>
      <td>${canEdit()?`<button class="btn btn-outline btn-sm" onclick="openEmpForm('${emp.id}')"><i class="fas fa-pen"></i></button> <button class="btn btn-danger btn-sm" onclick="deleteEmp('${emp.id}')"><i class="fas fa-trash"></i></button>`:''}</td>
    </tr>`;
  });
  h+='</tbody></table>';
  document.getElementById('hrEmpTable').innerHTML=h;
}

function clearHrEmpFilters() {
  ['empFilterSearch','empFilterRole','empFilterStatus','empFilterSalaryFrom','empFilterSalaryTo'].forEach(id=>{const el=document.getElementById(id);if(el){el.value='';if(el.tagName==='INPUT')el.value='';if(el.tagName==='SELECT')el.selectedIndex=0;}});

function renderHrEmpOrg(el) {
  const employees = STORAGE.get('employees',[]);
  el.innerHTML = `<div class="card" style="overflow-x:auto"><div class="org-tree" id="orgTree" ondragover="event.preventDefault()" ondrop="orgTreeDrop(event)"></div></div>`;

  if(employees.length===0) { document.getElementById('orgTree').innerHTML='<div class="empty-state"><p>'+t('noData')+'</p></div>'; return; }

  const roots = employees.filter(e=>!e.supervisor||!employees.find(x=>x.id===e.supervisor));
  const childMap = {};
  employees.forEach(e=>{ if(e.supervisor){ if(!childMap[e.supervisor]) childMap[e.supervisor]=[]; childMap[e.supervisor].push(e); }});

  const avClass = (role) => {
    if(['property_advisor','property_consultant','senior_property_consultant','team_leader','sales_manager','sales_director'].includes(role)) return 'av-sales';
    if(['marketing_director','marketing_assistant'].includes(role)) return 'av-marketing';
    if(['hr_manager','hr_agent'].includes(role)) return 'av-hr';
    if(['operation_director','operation'].includes(role)) return 'av-ops';
    if(['accountant','collector'].includes(role)) return 'av-acct';
    if(role==='ceo') return 'av-exec';
    return 'av-default';
  };

  function buildNode(emp) {
    const children = childMap[emp.id]||[];
    let html = `<div class="org-branch"><div class="org-node" draggable="${canEdit()?'true':'false'}" data-emp-id="${emp.id}" ondragstart="orgNodeDrag(event,'${emp.id}')" ondragover="event.preventDefault();this.style.borderColor='var(--primary)'" ondragleave="this.style.borderColor=''" ondrop="orgNodeDrop(event,'${emp.id}')">
      <div class="org-node-header">
        <div class="org-avatar ${avClass(emp.role)}">${getInitials(emp.name)}</div>
        <div class="org-node-name">${emp.name}${emp.status!=='active'?' <i class="fas fa-ban" style="color:var(--danger);font-size:10px"></i>':''}</div>
        <div class="org-node-role">${getRoleLabel(emp.role)}</div>
      </div>
      <div class="org-node-info"><span><i class="fas fa-money-bill-wave"></i> ${fmt(emp.salary)}</span></div>
      <div class="org-node-actions">
        ${canEdit()?`<button onclick="event.stopPropagation();openEmpForm('${emp.id}')" title="Edit"><i class="fas fa-pen"></i></button><button onclick="event.stopPropagation();showOrgAddChild('${emp.id}')" title="Add subordinate"><i class="fas fa-user-plus"></i></button><button onclick="event.stopPropagation();deleteOrgEmp('${emp.id}')" title="Delete" style="color:var(--danger)"><i class="fas fa-trash"></i></button>`:''}
      </div>
    </div>`;
    if(children.length>0) { html+='<div class="org-connector"></div><div class="org-level">'; children.forEach(c=>{html+=buildNode(c);}); html+='</div>'; }
    html+='</div>'; return html;
  }

  let tree=`<div class="org-branch"><div class="org-node root">
    <div class="org-node-header"><div class="org-avatar av-root"><i class="fas fa-building"></i></div>
    <div class="org-node-name">Marts</div><div class="org-node-role">${t('nav_orgChart')}</div></div>
    <div class="org-node-info"><span><i class="fas fa-users"></i> ${employees.length}</span><span><i class="fas fa-check-circle"></i> ${employees.filter(e=>e.status==='active').length}</span></div>
  </div><div class="org-connector"></div><div class="org-level">`;
  roots.forEach(r=>{tree+=buildNode(r);});
  tree+='</div></div>';
  document.getElementById('orgTree').innerHTML=tree;
}

let _dragEmpId = null;
function orgNodeDrag(e, id) { _dragEmpId = id; e.dataTransfer.effectAllowed = 'move'; }
function orgNodeDrop(e, targetId) {
  e.preventDefault();
  e.currentTarget.style.borderColor = '';
  if(!_dragEmpId || _dragEmpId === targetId) return;
  if(!confirm(t('confirm_delete'))) return;
  let employees = STORAGE.get('employees',[]);
  const emp = employees.find(x=>x.id===_dragEmpId);
  const target = employees.find(x=>x.id===targetId);
  if(!emp || !target) return;
  emp.supervisor = targetId;
  STORAGE.set('employees', employees);
  renderOrgChart(document.getElementById('mainContent'));
}
function orgTreeDrop(e) {
  e.preventDefault();
  if(!_dragEmpId) return;
  if(!confirm(t('confirm_delete'))) return;
  let employees = STORAGE.get('employees',[]);
  const emp = employees.find(x=>x.id===_dragEmpId);
  if(!emp) return;
  emp.supervisor = null;
  STORAGE.set('employees', employees);
  renderOrgChart(document.getElementById('mainContent'));
}

function openKpiRuleForm(ruleId) {
  const kpiRules = STORAGE.get('kpiRules', []);
  const existing = ruleId ? kpiRules.find(r => r.id === ruleId) : null;
  document.getElementById('modalContainer').innerHTML = `<h3>${existing?(lang==='ar'?'تعديل قاعدة KPI':'Edit KPI Rule'):(lang==='ar'?'إضافة قاعدة KPI':'Add KPI Rule')}</h3>
    <div class="form-group"><label>${lang==='ar'?'اسم القاعدة':'Rule Name'}</label><input type="text" id="kpi_name" value="${existing?existing.name:''}"></div>
    <div class="form-row"><div class="form-group"><label>${lang==='ar'?'النوع':'Type'}</label><select id="kpi_type"><option value="percentage" ${existing&&existing.type==='percentage'?'selected':''}>${lang==='ar'?'نسبة %':'Percentage %'}</option><option value="fixed" ${existing&&existing.type==='fixed'?'selected':''}>${lang==='ar'?'قيمة ثابتة':'Fixed Value'}</option></select></div>
    <div class="form-group"><label>${lang==='ar'?'القيمة':'Value'}</label><input type="number" id="kpi_value" value="${existing?existing.value:''}" min="0" step="0.1"></div></div>
    <div class="form-group"><label>${lang==='ar'?'الوصف':'Description'}</label><textarea id="kpi_desc" rows="3">${existing?existing.description||'':''}</textarea></div>
    <div class="modal-actions"><button class="btn btn-primary" onclick="saveKpiRule('${ruleId||''}')"><i class="fas fa-save"></i> ${t('save')}</button><button class="btn btn-outline" onclick="closeModal()">${t('cancel')}</button></div>`;
  document.getElementById('modalOverlay').classList.add('active');
}

function saveKpiRule(ruleId) {
  const kpiRules = STORAGE.get('kpiRules', []);
  const data = {
    id: ruleId || uid(),
    name: document.getElementById('kpi_name').value.trim(),
    type: document.getElementById('kpi_type').value,
    value: parseFloat(document.getElementById('kpi_value').value)||0,
    description: document.getElementById('kpi_desc').value.trim()
  };
  if(ruleId) {
    const idx = kpiRules.findIndex(r => r.id === ruleId);
    if(idx >= 0) kpiRules[idx] = data;
  } else {
    kpiRules.push(data);
  }
  STORAGE.set('kpiRules', kpiRules);
  closeModal();
  renderHrTabContent();
}

function deleteKpiRule(ruleId) {
  if(!confirm(lang==='ar'?'هل أنت متأكد من حذف هذه القاعدة؟':'Are you sure you want to delete this rule?')) return;
  let kpiRules = STORAGE.get('kpiRules', []);
  kpiRules = kpiRules.filter(r => r.id !== ruleId);
  STORAGE.set('kpiRules', kpiRules);
  renderHrTabContent();
}

function removeJaExp(idx) { const blocks = document.querySelectorAll('.ja-exp-block'); if(blocks[idx]) blocks[idx].remove(); }

function calculateJaAge() {
  const dob = document.getElementById('jaDob');
  const ageEl = document.getElementById('jaAge');
  if(!dob||!ageEl||!dob.value) return;
  const b = new Date(dob.value), now = new Date();
  let a = now.getFullYear()-b.getFullYear();
  if(now.getMonth()<b.getMonth()||(now.getMonth()===b.getMonth()&&now.getDate()<b.getDate())) a--;
  ageEl.value = a;
}

function collectJaFormData() {
  const form = document.getElementById('jaFormEl');
  if(!form) return null;
  const fd = new FormData(form);
  const data = {};
  for(const [k,v] of fd.entries()) data[k] = v;
  const blocks = document.querySelectorAll('.ja-exp-block');
  data.experiences = [];
  blocks.forEach((b,i) => {
    const exp = {};
    ['company','title','from','to','salary','reason'].forEach(f => {
      const el = b.querySelector(`[name="exp${i}_${f}"]`);
      if(el) exp[f] = el.value;
    });
    if(exp.company||exp.title) data.experiences.push(exp);
  });
  const cvFile = form.querySelector('[name="cvFile"]');
  data.hasCv = cvFile && cvFile.files && cvFile.files.length > 0;
  data.cvFileName = data.hasCv ? cvFile.files[0].name : '';
  return data;
}

function saveJaDraft() {
  const data = collectJaFormData();
  if(data) { STORAGE.set('jaDraft', data); alert(lang==='ar'?'تم الحفظ مبدئياً!':'Draft saved!'); }
}

function clearJaForm() {
  if(!confirm(lang==='ar'?'هل تريد مسح جميع الحقول؟':'Clear all fields?')) return;
  STORAGE.remove('jaDraft');
  renderHrTabContent();
}

function submitJaForm(e) {
  e.preventDefault();
  const data = collectJaFormData();
  if(!data) return false;
  const fullName = data.fullName || '';
  const phone = data.phone || '';
  if(!fullName||!phone||!data.position) { alert(lang==='ar'?'أكمل جميع الحقول الإلزامية (*)':'Please fill all required fields (*)'); return false; }
  const applications = STORAGE.get('jobApplications', []);
  const appData = {
    id: uid(), date: today(), status: 'pending', interviewDate: '', interviewNotes: '',
    name: fullName, phone, email: data.email||'', position: data.position,
    address: data.address||'', dob: data.dob||'', age: data.age||'',
    hasCar: data.hasCar||'no', university: data.university||'', degree: data.degree||'',
    eduFrom: data.eduFrom||'', eduTo: data.eduTo||'', graduated: data.graduated||'',

    hearAbout: data.hearAbout||'', expectedSalary: data.expectedSalary||'',
    startDate: data.startDate||'', references: [1,2,3,4].map(n => ({name:data['ref'+n+'_name']||'',title:data['ref'+n+'_title']||'',phone:data['ref'+n+'_phone']||'',relation:data['ref'+n+'_relation']||''})),

function saveJaReview(appId) {
  const apps = STORAGE.get('jobApplications', []);
  const idx = apps.findIndex(a => a.id === appId);
  if(idx < 0) return;
  const oldStatus = apps[idx].status;
  apps[idx].status = document.getElementById('ja_rStatus').value;
  apps[idx].interviewDate = document.getElementById('ja_rInterview').value;
  apps[idx].interviewNotes = document.getElementById('ja_rNotes').value.trim();
  if(apps[idx].status !== oldStatus) {
    const sl = {accepted:(lang==='ar'?'مقبول':'Accepted'),rejected:(lang==='ar'?'مرفوض':'Rejected'),interview:(lang==='ar'?'تم جدولة مقابلة':'Interview Scheduled')};
    addNotification({type:'job_status',title:(lang==='ar'?'تحديث حالة الطلب':'Application Status Update'),message:apps[idx].name+': '+(sl[apps[idx].status]||apps[idx].status),date:today()});
  }
  STORAGE.set('jobApplications', apps);
  closeModal();
  renderHrTabContent();
}

function deleteJaApp(appId) {
  if(!confirm(lang==='ar'?'هل أنت متأكد من حذف هذا الطلب؟':'Delete this application?')) return;
  let apps = STORAGE.get('jobApplications', []);
  apps = apps.filter(a => a.id !== appId);
  STORAGE.set('jobApplications', apps);
  renderHrTabContent();
}

function openLawForm(type, lawId) {
  const storageKey = type === 'labor' ? 'laborLaws' : 'socialInsuranceLaws';
  const laws = STORAGE.get(storageKey, []);
  const existing = lawId ? laws.find(l => l.id === lawId) : null;
  const isLabor = type === 'labor';
  document.getElementById('modalContainer').innerHTML = `<h3>${existing?(lang==='ar'?'تعديل البند':'Edit Article'):(lang==='ar'?'إضافة بند جديد':'Add New Article')} - ${isLabor?(lang==='ar'?'قانون العمل':'Labor Law'):(lang==='ar'?'التأمينات':'Insurance')}</h3>
    <div class="form-group"><label>${lang==='ar'?'عنوان البند':'Article Title'}*</label><input type="text" id="law_title" value="${existing?existing.title:''}"></div>
    <div class="form-group"><label>${lang==='ar'?'محتوى البند':'Content'}*</label><textarea id="law_content" rows="6">${existing?existing.content:''}</textarea></div>
    <div class="form-group"><label>${lang==='ar'?'العقوبات والغرامات':'Penalties'}</label><textarea id="law_penalty" rows="3">${existing?existing.penalty||'':''}</textarea></div>
    <div class="form-group"><label>${lang==='ar'?'المادة القانونية':'Legal Article Number'}</label><input type="text" id="law_articleNum" value="${existing?existing.articleNum||'':''}" placeholder="${lang==='ar'?'مثال: المادة 34':'e.g., Article 34'}"></div>
    <div class="modal-actions"><button class="btn btn-primary" onclick="saveLaw('${type}','${lawId||''}')"><i class="fas fa-save"></i> ${t('save')}</button><button class="btn btn-outline" onclick="closeModal()">${t('cancel')}</button></div>`;
  document.getElementById('modalOverlay').classList.add('active');
}

function openLaborLawForm(lawId) { openLawForm('labor', lawId); }

function saveLaw(type, lawId) {
  const storageKey = type === 'labor' ? 'laborLaws' : 'socialInsuranceLaws';
  const laws = STORAGE.get(storageKey, []);
  const data = {
    id: lawId || uid(),
    title: document.getElementById('law_title').value.trim(),
    content: document.getElementById('law_content').value.trim(),
    penalty: document.getElementById('law_penalty').value.trim(),
    articleNum: document.getElementById('law_articleNum').value.trim()
  };
  if(!data.title || !data.content) { alert(lang==='ar'?'أكمل العنوان والمحتوى':'Title and content are required'); return; }
  if(lawId) {
    const idx = laws.findIndex(l => l.id === lawId);
    if(idx >= 0) laws[idx] = data;
  } else {
    laws.push(data);
  }
  STORAGE.set(storageKey, laws);
  closeModal();

function renderRuleTester() {
  const container = document.getElementById('commTab_tester');
  const roles = getAllRoles();
  const lg = lang==='ar';

  const fixedTests = [
    {roleId:'hr_manager', contracts:3},
    {roleId:'operation_director', contracts:2},
    {roleId:'accountant', contracts:5}
  ];
  const perMillionTests = [
    {roleId:'ceo', price:5000000},
    {roleId:'marketing_director', price:3000000},
    {roleId:'marketing_assistant', price:8000000}
  ];
  const tierTests = [
    {roleId:'property_consultant', price:3000000, monthSales:0, desc:lg?'بيعة واحدة فقط':'Single sale only'},
    {roleId:'senior_property_consultant', price:10000000, monthSales:0, desc:lg?'بيعة واحدة فقط':'Single sale only'},
    {roleId:'team_leader', price:7000000, monthSales:0, desc:lg?'بيعة واحدة فقط':'Single sale only'}
  ];

  function calcFixed(roleId, contracts) {
    const cfg = getRoleConfig(roleId);
    if(!cfg) return {rate:0, total:0};
    return {rate:cfg.rate, total:cfg.rate * contracts};
  }
  function calcPerMillion(roleId, price) {
    const cfg = getRoleConfig(roleId);
    if(!cfg) return {rate:0, total:0};
    const millions = price / 1000000;
    return {rate:cfg.rate, total:cfg.rate * millions, millions};
  }
  function calcTier(roleId, price, monthSales) {
    const cfg = getRoleConfig(roleId);
    if(!cfg || !cfg.tiers) return {rate:0, total:0, ach:0, tierIdx:0};
    const target = cfg.defaultTarget || 10000000;
    const total = monthSales + price;
    const ach = Math.min(100, (total / target) * 100);
    let tierIdx = 0;
    if(ach > 80) tierIdx = 2;
    else if(ach > 50) tierIdx = 1;
    const tierRate = cfg.tiers[tierIdx].rate / 1000;
    return {rate:tierRate, total:price * tierRate / 100, ach, tierIdx, target};
  }

  function testResultCard(title, icon, color, examples) {
    let h = `<div style="background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:24px;border-right:5px solid ${color}">`;

    h += `<div style="display:grid;gap:16px">`;
    examples.forEach((ex, idx) => {
      const pass = ex.computed === ex.expected;
      const passColor = pass ? 'var(--success)' : 'var(--danger)';
      const passText = pass ? t('tester_pass') : t('tester_fail');
      h += `<div style="background:var(--bg);border-radius:12px;padding:16px;border:2px solid ${passColor}">`;
      h += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">`;
      h += `<span style="font-weight:800;font-size:14px">${t('tester_example')} ${idx+1}: ${ex.roleLabel}</span>`;
      h += `<span style="background:${passColor};color:#000;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:700">${passText}</span>`;
      h += `</div>`;
      h += `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;font-size:13px">`;
      ex.inputs.forEach(inp => {
        h += `<div><span style="color:var(--text-light)">${inp.label}:</span> <b>${inp.value}</b></div>`;
      });
      h += `<div style="border-top:2px dashed var(--border);padding-top:8px;margin-top:4px"><span style="color:var(--text-light)">${t('tester_formula')}:</span> <span style="color:var(--accent);font-weight:700">${ex.formula}</span></div>`;
      h += `<div style="border-top:2px dashed var(--border);padding-top:8px;margin-top:4px"><span style="color:var(--text-light)">${t('tester_expected')}:</span> <b>${fmt(ex.expected)}</b></div>`;
      h += `<div style="border-top:2px solid ${passColor};padding-top:8px;margin-top:4px"><span style="color:var(--text-light)">${t('tester_result')}:</span> <b style="color:${passColor}">${fmt(ex.computed)}</b></div>`;
      h += `</div></div>`;
    });
    h += `</div></div>`;
    return h;
  }

  let html = `<div style="padding:20px"><div class="topbar"><h1><i class="fas fa-flask"></i> ${t('tester_tab')}</h1></div>`;
  html += `<div style="background:var(--card);border-radius:var(--radius);padding:16px 24px;margin-bottom:24px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;border-right:5px solid var(--accent)">
    <i class="fas fa-info-circle" style="color:var(--accent);font-size:20px"></i>
    <span style="font-size:14px">${lg?'أمثلة تفاعلية للتحقق من صحة حساب العمولات حسب كل نوع قاعدة. البيانات قابلة للتعديل والنتائج تتحدث فوراً.':'Interactive examples to verify commission calculations for each rule type. Data is editable and results update instantly.'}</span>
  </div>`;

  const fixedExamples = fixedTests.map(ex => {
    const cfg = getRoleConfig(ex.roleId);
    const r = calcFixed(ex.roleId, ex.contracts);
    return {
      roleLabel: cfg ? (lg ? cfg.ar : cfg.en) : ex.roleId,
      inputs: [{label:t('tester_contracts'), value:ex.contracts}],

  html += testResultCard(t('tester_salesTier'), 'fa-chart-line', 'var(--warning)', tierExamples);

  // Resale team examples

  const resaleTests = [

function runTesterCalc() {
  const el = document.getElementById('testerCalcResult');
  if(!el) return;
  const roleId = document.getElementById('testerCalcRole').value;
  const price = parseFloat(document.getElementById('testerCalcPrice').value)||0;
  const contracts = parseInt(document.getElementById('testerCalcContracts').value)||1;
  const cfg = getRoleConfig(roleId);
  const lg = lang==='ar';
  if(!cfg) { el.innerHTML=''; return; }

  let result = '', formula = '', rate = 0, commission = 0;

  if(cfg.type === 'fixed') {
    rate = cfg.rate;
    commission = rate * contracts;
    formula = `${fmt(rate)} ${t('tester_perContract')} × ${contracts} = ${fmt(commission)}`;
  } else if(cfg.type === 'per_million') {
    rate = cfg.rate;
    const millions = price / 1000000;
    commission = rate * millions;
    formula = `${fmt(rate)} × ${millions.toFixed(1)} ${t('tester_perMillionLabel')} = ${fmt(commission)}`;
  } else if(cfg.type === 'sales_tier') {
    const target = cfg.defaultTarget || 10000000;
    const ach = Math.min(100, (price / target) * 100);
    let tierIdx = 0;
    if(ach > 80) tierIdx = 2;
    else if(ach > 50) tierIdx = 1;
    rate = cfg.tiers[tierIdx].rate / 1000;
    commission = price * rate / 100;
    const tierLabels = [t('tester_tier1'), t('tester_tier2'), t('tester_tier3')];
    formula = `${lg?'الهدف':'Target'}: ${fmt(target)} | ${lg?'الإنجاز':'Ach'}: ${ach.toFixed(1)}% → ${tierLabels[tierIdx]} → ${(rate*100).toFixed(1)}% × ${fmt(price)} = ${fmt(commission)}`;
  }

  el.innerHTML = `<div style="background:var(--bg);border-radius:12px;padding:16px;border:2px solid var(--primary)">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px;font-size:14px">
      <div><span style="color:var(--text-light)">${t('tester_role')}:</span> <b>${cfg?(lg?cfg.ar:cfg.en):''}</b> <span class="badge badge-blue">${cfg.type}</span></div>
      <div><span style="color:var(--text-light)">${t('tester_currentRate')}:</span> <b>${cfg.type==='sales_tier'?(cfg.tiers.map(t2=>(t2.rate/10).toFixed(0)+'%').join(' / ')):cfg.rate+(cfg.type==='fixed'?' '+t('tester_perContract'):' '+t('tester_perMillionLabel'))}</b></div>
    </div>
    <div style="font-size:14px;color:var(--accent);font-weight:700;margin-bottom:8px">${t('tester_formula')}: ${formula}</div>
    <div style="font-size:22px;font-weight:900;color:var(--primary)">${t('tester_commission')}: ${fmt(commission)}</div>
  </div>`;
}

  const type = document.getElementById('ruleType').value;

function saveRule(existingId) {
  const ar = document.getElementById('ruleAr').value.trim();
  const en = document.getElementById('ruleEn').value.trim();
  if(!ar||!en) return;

  const roles = getAllRoles();
  const type = existingId ? roles.find(r=>r.id===existingId).type : document.getElementById('ruleType').value;
  const id = existingId || 'role_' + Date.now();

  const newRole = {id, ar, en, type, defaultTarget:0};

  if(type === 'fixed') {
    newRole.rate = parseFloat(document.getElementById('ruleFixedRate').value)||0;
  } else if(type === 'per_million') {
    newRole.rate = parseFloat(document.getElementById('ruleMillionRate').value)||0;
  } else if(type === 'sales_tier') {
    newRole.defaultTarget = parseFloat(document.getElementById('ruleTarget').value)||0;
    newRole.tiers = [];
    for(let i=1;i<=3;i++){
      newRole.tiers.push({
        min: parseInt(document.getElementById('tier'+i+'Min').value)||0,
        max: parseInt(document.getElementById('tier'+i+'Max').value)||100,
        rate: parseFloat(document.getElementById('tier'+i+'Rate').value)||0
      });
    }
  }

  const idx = roles.findIndex(r=>r.id===id);
  if(idx>=0) roles[idx] = newRole; else roles.push(newRole);
  STORAGE.set('empRoles', roles);
  closeModal(); alert(t('comm_ruleSaved'));
  renderCommRules();
}

function deleteRule(roleId) {
  if(!confirm(t('confirm_delete'))) return;
  let roles = getAllRoles();
  roles = roles.filter(r=>r.id!==roleId);
  STORAGE.set('empRoles', roles);
  closeModal(); alert(t('comm_ruleDeleted'));
  renderCommRules();
}

function renderCompanyDue() {
  const sales = STORAGE.get('sales',[]);
  const employees = STORAGE.get('employees',[]);
  const container = document.getElementById('commTab_companyDue');

  // Expiry alerts
  const expiring = sales.filter(s => {
    if(s.bookingType!=='contract'||!s.date) return false;
    const expiry = addDays(s.date, s.payoutDays||30);
    const daysLeft = daysBetween(today(), expiry);
    return daysLeft >= 0 && daysLeft <= 2;
  });
  let alertHtml = '';
  expiring.forEach(s => {
    const expiry = addDays(s.date, s.payoutDays||30);
    alertHtml += `<div class="alert alert-warning"><i class="fas fa-exclamation-triangle"></i> ${t('comm_expiringSoon')}: <b>${s.code}</b> - ${s.client} (${fmtDate(expiry)})</div>`;
  });

  const contracts = sales.filter(s=>s.bookingType==='contract').map(s => {
    const expiry = addDays(s.date, s.payoutDays||30);
    const daysLeft = daysBetween(today(), expiry);
    const companyComm = (s.unitPrice||0)*(s.commissionRate||0)/100;
    const isFull = s.commissionRate >= 3.5;
    const resaleTeam = s.saleType==='resale' ? getResaleTeam() : [];
    const resaleTotal = resaleTeam.reduce((sum,r)=> sum + companyComm * r.pct / 100, 0);
    return {...s, expiry, daysLeft, companyComm, isFull, resaleTotal};
  }).sort((a,b)=>new Date(a.expiry)-new Date(b.expiry));

  if(contracts.length===0) { container.innerHTML=alertHtml+'<div class="card"><div class="empty-state"><p>'+t('noData')+'</p></div></div>'; return; }

  let h = alertHtml + '<div class="card"><div class="table-wrap"><table><thead><tr><th>'+t('comm_saleCode')+'</th><th>'+t('comm_dueDate')+'</th><th>'+t('comm_client')+'</th><th>'+t('comm_unitType')+'</th><th>'+t('sale_price')+'</th><th>'+t('sale_commissionRate')+'</th><th>'+t('comm_companyAmount')+'</th><th>'+t('comm_resaleTeam')+'</th><th>'+t('comm_daysLeft')+'</th><th>'+t('sale_commissionCondition')+'</th></tr></thead><tbody>';
  contracts.forEach(s => {
    const daysClass = s.daysLeft<=0?'badge-red':(s.daysLeft<=2?'badge-yellow':'badge-green');
    const resaleBadge = s.saleType==='resale' ? `<span style="color:#B76E79;font-weight:700">${fmt(s.resaleTotal)}</span>` : '-';
    h+=`<tr>
      <td><strong>${s.code}</strong></td><td>${fmtDate(s.expiry)}</td><td>${s.client}</td><td>${s.unitType}</td>
      <td>${fmt(s.unitPrice)}</td><td>${s.commissionRate}%</td><td>${fmt(s.companyComm)}</td>
      <td>${resaleBadge}</td>
      <td><span class="badge ${daysClass}">${s.daysLeft<=0?'متأخر':s.daysLeft+' يوم'}</span></td>
      <td><span class="badge ${s.isFull?'badge-green':'badge-red'}">${s.isFull?t('sale_fullPayout'):t('sale_halfPayout')}</span></td>
    </tr>`;
  });
  h+='</tbody></table></div></div>';
  container.innerHTML=h;
}

function renderEmpPayouts() {
  const sales = STORAGE.get('sales',[]);
  const employees = STORAGE.get('employees',[]);
  const container = document.getElementById('commTab_empPayout');

  const contracts = sales.filter(s=>s.bookingType==='contract');
  const millions = (price) => price / 1000000;
  const isHalf = (s) => s.commissionRate <= 3.0 && s.commissionRate < 3.5;
  const multiplier = (s) => isHalf(s) ? 0.5 : 1.0;

  // Calculate per-employee commissions
  const empCommissions = {};
  contracts.forEach(s => {
    const addComm = (empId, role, amount) => {
      if(!empId) return;
      if(!empCommissions[empId]) empCommissions[empId]={total:0,details:[]};
      empCommissions[empId].total += amount;
      empCommissions[empId].details.push({saleCode:s.code,role,amount});
    };

    // Sales roles
    ['salesPersonId','teamLeaderId','salesManagerId','headOfSalesId'].forEach(field => {
      const empId = s[field];
      const emp = employees.find(e=>e.id===empId);
      if(!emp) return;
      const cfg = getRoleConfig(emp.role);
      if(!cfg||cfg.type!=='sales_tier') return;

      let target = cfg.defaultTarget;
      if(['team_leader','sales_manager','sales_director'].includes(emp.role)) {
        const teamEmps = employees.filter(e=>e.supervisor===emp.id||e.teamLeaderId===emp.id||e.salesManagerId===emp.id);
        target = teamEmps.reduce((sum,e)=>sum+(e.target||cfg.defaultTarget),0) || cfg.defaultTarget;
      }
      if(target<=0) return;

      const monthSales = contracts.filter(x=>x.date&&x.date.slice(0,7)===s.date.slice(0,7));
      const totalSold = monthSales.reduce((sum,x)=>sum+(x.unitPrice||0),0);
      const ach = Math.min(100, (totalSold/target)*100 * multiplier(s));
      let tierRate = cfg.tiers[0].rate;
      if(ach>50) tierRate = cfg.tiers[1].rate;
      if(ach>80) tierRate = cfg.tiers[2].rate;
      const amt = tierRate * millions(s.unitPrice) * multiplier(s);
      addComm(empId, emp.role, amt);
    });

    // Fixed per-contract roles
    employees.filter(e=>['hr_manager','hr_agent','accountant','collector','office_boy','operation_director','operation'].includes(e.role)).forEach(emp => {
      const cfg = getRoleConfig(emp.role);
      if(cfg && cfg.rate > 0) addComm(emp.id, emp.role, cfg.rate);
    });

    // Per-million roles
    employees.filter(e=>['ceo','marketing_director','marketing_assistant'].includes(e.role)).forEach(emp => {
      const cfg = getRoleConfig(emp.role);
      if(cfg && cfg.rate > 0) addComm(emp.id, emp.role, cfg.rate * millions(s.unitPrice));
    });

    // Resale team: % of company commission on resale sales only
    if(s.saleType === 'resale') {
      const resaleTeam = getResaleTeam();
      const companyComm = (s.unitPrice||0) * (s.commissionRate||0) / 100;
      resaleTeam.forEach(rule => {
        const empId = s[rule.saleField];
        if(!empId || rule.pct <= 0) return;
        const amt = companyComm * rule.pct / 100;
        addComm(empId, rule.roleId, amt);
      });
    }
  });

  // Determine payout date (1st or 15th)
  const payoutDay = 15;
  const nextPayout = (() => {
    const now = new Date();
    const d15 = new Date(now.getFullYear(), now.getMonth(), 15);
    const d1 = new Date(now.getFullYear(), now.getMonth()+1, 1);
    return now.getDate() <= 15 ? d15.toISOString().slice(0,10) : d1.toISOString().slice(0,10);
  })();

  if(Object.keys(empCommissions).length===0) { container.innerHTML='<div class="card"><div class="empty-state"><p>'+t('noData')+'</p></div></div>'; return; }

  let h = `<div class="card"><h3>${t('comm_payoutSchedule')}: <span class="badge badge-blue">${t('comm_payoutDay')} ${payoutDay} / 1</span> | ${t('sale_expiry')}: <b>${fmtDate(nextPayout)}</b></h3>`;
  h+='<div class="table-wrap"><table><thead><tr><th>'+t('comm_empName')+'</th><th>'+t('comm_empRole')+'</th><th>'+t('comm_amount')+'</th><th>'+t('sale_commissionCondition')+'</th></tr></thead><tbody>';
  Object.keys(empCommissions).sort((a,b)=>empCommissions[b].total-empCommissions[a].total).forEach(empId => {
    const emp = employees.find(e=>e.id===empId);
    if(!emp) return;
    const data = empCommissions[empId];
    h+=`<tr><td><strong>${emp.name}</strong></td><td>${getRoleLabel(emp.role)}</td><td><strong>${fmt(data.total)}</strong></td><td><span class="badge badge-green">${t('comm_pending')}</span></td></tr>`;
  });
  h+='</tbody></table></div></div>';
  container.innerHTML=h;
}

function onAccFilterBranchChange() {

function refreshCurrentAccTab() {
  const activeTab = ACC_TABS.find(t => {

function filterExpenses() {
  let expenses = STORAGE.get('expenses',[]);
  if(accFilterFranchise) expenses = expenses.filter(e => e.franchiseId === accFilterFranchise);
  if(accFilterBranch) expenses = expenses.filter(e => e.branchId === accFilterBranch);
  const from = document.getElementById('expenseFrom')?.value;
  const to = document.getElementById('expenseTo')?.value;
  if(from) expenses = expenses.filter(e=>e.date>=from);
  if(to) expenses = expenses.filter(e=>e.date<=to);
  let h = '';
  if(expenses.length===0) { h='<div class="empty-state"><p>'+t('noData')+'</p></div>'; }
  else {
    const franchises = STORAGE.get('franchises',[]);
    const branches = STORAGE.get('branches',[]);
    h='<div class="table-wrap"><table><thead><tr><th>'+t('acc_category')+'</th><th>'+t('acc_amount')+'</th><th>'+t('acc_date')+'</th><th>'+t('acc_journalFranchise')+'</th><th>'+t('acc_journalBranch')+'</th><th>'+t('acc_description')+'</th></tr></thead><tbody>';
    expenses.forEach(e=>{
      const f = franchises.find(fr=>fr.id===e.franchiseId);
      const b = branches.find(br=>br.id===e.branchId);
      h+=`<tr><td>${e.category}</td><td>${fmt(e.amount)}</td><td>${fmtDate(e.date)}</td><td>${f?(lang==='ar'?f.name_ar:f.name_en):'-'}</td><td>${b?(lang==='ar'?b.name_ar:b.name_en):'-'}</td><td>${e.desc}</td></tr>`;
    });
    h+='</tbody></table></div>';
  }
  document.getElementById('expenseTable').innerHTML=h;

function renderCoa() {
  const coa = STORAGE.get('chartOfAccounts',[]);
  let h = renderFranchiseFilterBar();
  h += `<div class="card"><div class="flex-between mb-16"><h3><i class="fas fa-sitemap"></i> ${t('acc_coa')}</h3>
  <div style="display:flex;gap:8px;flex-wrap:wrap">

  </div></div></div>
  <div id="coaTree"></div>`;
  document.getElementById('accTab_coa').innerHTML = h;
  renderCoaTree(coa);
}

function renderCoaTree(coa) {
  const types = [
    {type:'asset',icon:'fa-university',color:'#827148'},
    {type:'liability',icon:'fa-file-invoice-dollar',color:'#C75B4A'},
    {type:'equity',icon:'fa-balance-scale',color:'#827148'},
    {type:'revenue',icon:'fa-chart-line',color:'#A5AF79'},
    {type:'expense',icon:'fa-receipt',color:'#E8A07C'}
  ];
  const typeLabels = {asset:t('acc_asset'),liability:t('acc_liability'),equity:t('acc_equity'),revenue:t('acc_revenue'),expense:t('acc_expenseAcc')};
  let h = '';
  types.forEach(({type,icon,color}) => {
    const topAccounts = coa.filter(a => a.type === type && !a.parent);
    if(topAccounts.length === 0) return;
    h += `<div class="card" style="margin-bottom:12px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid ${color}">
      <i class="fas ${icon}" style="color:${color};font-size:18px"></i>
      <strong style="color:${color};font-size:16px">${typeLabels[type]}</strong>
    </div>`;
    topAccounts.forEach(top => {
      h += renderCoaNode(top, coa, 0);
    });
    h += '</div>';
  });
  if(!h) h = '<div class="empty-state"><p>'+t('acc_noAccounts')+'</p></div>';
  document.getElementById('coaTree').innerHTML = h;
}

function renderCoaNode(account, coa, depth) {
  const children = coa.filter(a => a.parent === account.code);
  const hasChildren = children.length > 0;
  const indent = depth * 24;
  const typeColors = {asset:'#827148',liability:'#C75B4A',equity:'#827148',revenue:'#A5AF79',expense:'#E8A07C',contra_asset:'#94a3b8',contra_revenue:'#94a3b8'};
  const col = typeColors[account.type] || '#666';
  const bal = getCoaBalance(account.code);
  let h = `<div style="display:flex;align-items:center;padding:8px 12px;margin-left:${indent}px;border-left:3px solid ${col};margin-bottom:2px;background:rgba(0,0,0,0.02);border-radius:0 4px 4px 0">
    <span style="min-width:70px;font-weight:700;color:${col};font-family:monospace">${account.code}</span>
    <span style="flex:1;margin:0 8px"><strong>${lang==='ar'?account.name_ar:account.name_en}</strong> <small style="color:#888">(${lang==='ar'?account.name_en:account.name_ar})</small></span>
    <span style="min-width:120px;text-align:right;font-weight:600;direction:ltr">${fmt(bal)}</span>
    <span style="margin-left:8px">
      ${hasChildren?'':'<button class="btn btn-outline btn-sm" style="padding:2px 6px" onclick="openCoaModal(\''+account.code+'\')"><i class="fas fa-edit"></i></button>'}
      ${canAccounting()?'<button class="btn btn-outline btn-sm" style="padding:2px 6px;color:#C75B4A;border-color:#C75B4A" onclick="deleteCoaAccount(\''+account.code+'\')"><i class="fas fa-trash"></i></button>':''}
    </span>
  </div>`;
  children.forEach(child => { h += renderCoaNode(child, coa, depth + 1); });
  return h;
}

function getCoaBalance(code) {
  const entries = getFilteredJournalEntries();
  let totalDr = 0, totalCr = 0;
  entries.forEach(e => {
    if(!e.lines) return;
    e.lines.forEach(l => {
      if(l.code === code) {
        totalDr += parseFloat(l.debit) || 0;
        totalCr += parseFloat(l.credit) || 0;
      }
    });
  });
  return totalDr - totalCr;
}

function openCoaModal(editCode) {
  const coa = STORAGE.get('chartOfAccounts', []);
  const existing = editCode ? coa.find(a => a.code === editCode) : null;
  const types = ['asset','liability','equity','revenue','expense','contra_asset','contra_revenue'];
  const typeOpts = types.map(tp => `<option value="${tp}" ${existing&&existing.type===tp?'selected':''}>${t('acc_'+tp.replace('contra_',''))}</option>`).join('');
  const parentOpts = coa.filter(a => a.code !== editCode).map(a => `<option value="${a.code}" ${existing&&existing.parent===a.code?'selected':''}>${a.code} - ${lang==='ar'?a.name_ar:a.name_en}</option>`).join('');
  document.getElementById('modalContainer').innerHTML = `<h3>${existing?t('acc_editAccount'):t('acc_addAccount')}</h3>
  <div class="form-row"><div class="form-group"><label>${t('acc_accountCode')}</label><input type="text" id="coa_code" value="${existing?existing.code:''}" ${existing?'readonly':''}></div>
  <div class="form-group"><label>${t('acc_accountType')}</label><select id="coa_type">${typeOpts}</select></div></div>
  <div class="form-row"><div class="form-group"><label>${t('acc_accountNameAr')}</label><input type="text" id="coa_nameAr" value="${existing?existing.name_ar:''}"></div>
  <div class="form-group"><label>${t('acc_accountNameEn')}</label><input type="text" id="coa_nameEn" value="${existing?existing.name_en:''}"></div></div>
  <div class="form-row"><div class="form-group"><label>${t('acc_parentAccount')}</label><select id="coa_parent"><option value="">---</option>${parentOpts}</select></div></div>
  <div class="modal-actions"><button class="btn btn-primary" onclick="saveCoaAccount('${editCode||''}')"><i class="fas fa-save"></i> ${t('save')}</button><button class="btn btn-outline" onclick="closeModal()">${t('cancel')}</button></div>`;
  document.getElementById('modalOverlay').classList.add('active');
}

function saveCoaAccount(editCode) {
  const coa = STORAGE.get('chartOfAccounts', []);
  const code = document.getElementById('coa_code').value.trim();
  const nameAr = document.getElementById('coa_nameAr').value.trim();
  const nameEn = document.getElementById('coa_nameEn').value.trim();
  const type = document.getElementById('coa_type').value;
  const parent = document.getElementById('coa_parent').value || null;
  if(!code || !nameAr || !nameEn) { alert(lang==='ar'?'أكمل جميع الحقول المطلوبة':'Fill all required fields'); return; }
  if(editCode) {
    const idx = coa.findIndex(a => a.code === editCode);
    if(idx >= 0) { coa[idx].name_ar = nameAr; coa[idx].name_en = nameEn; coa[idx].type = type; coa[idx].parent = parent; }
  } else {
    if(coa.find(a => a.code === code)) { alert(lang==='ar'?'رقم الحساب مكرر':'Account code already exists'); return; }
    coa.push({code, name_ar:nameAr, name_en:nameEn, type, parent, level:parent?3:1});
  }
  STORAGE.set('chartOfAccounts', coa);
  closeModal(); renderCoa();
}

function deleteCoaAccount(code) {
  if(!confirm(t('confirm_delete'))) return;
  let coa = STORAGE.get('chartOfAccounts', []);
  coa = coa.filter(a => a.code !== code && a.parent !== code);
  STORAGE.set('chartOfAccounts', coa);
  renderCoa();
}

function renderJournal() {

  </div></div></div>
  <div id="journalTable"></div>`;
  document.getElementById('accTab_journal').innerHTML = h;

function renderJournalTable(entries) {
  if(entries.length === 0) {
    document.getElementById('journalTable').innerHTML = '<div class="empty-state"><p>'+t('noData')+'</p></div>';
    return;
  }
  const sorted = [...entries].sort((a,b) => (b.date||'').localeCompare(a.date||''));
  const franchises = STORAGE.get('franchises',[]);
  const branches = STORAGE.get('branches',[]);
  let h = '<div class="table-wrap"><table><thead><tr><th>'+t('acc_journalDate')+'</th><th>'+t('acc_journalRef')+'</th><th>'+t('acc_journalDesc')+'</th><th>'+t('acc_journalFranchise')+'</th><th>'+t('acc_journalBranch')+'</th><th>'+t('acc_journalDebit')+'</th><th>'+t('acc_journalCredit')+'</th><th>'+t('acc_status')+'</th></tr></thead><tbody>';
  sorted.forEach(e => {
    const totalDr = (e.lines||[]).reduce((s,l) => s+(parseFloat(l.debit)||0), 0);
    const totalCr = (e.lines||[]).reduce((s,l) => s+(parseFloat(l.credit)||0), 0);
    const balanced = Math.abs(totalDr - totalCr) < 0.01;
    const f = franchises.find(fr=>fr.id===e.franchiseId);
    const b = branches.find(br=>br.id===e.branchId);
    h += `<tr style="cursor:pointer" onclick="openJournalModal('${e.id}')">
      <td>${fmtDate(e.date)}</td>
      <td><strong>${e.ref||''}</strong></td>
      <td>${e.desc||''}</td>
      <td><span style="color:#827148;font-size:0.85em">${f?(lang==='ar'?f.name_ar:f.name_en):(e.franchiseId?t('acc_noFranchise'):'-')}</span></td>
      <td><span style="color:#827148;font-size:0.85em">${b?(lang==='ar'?b.name_ar:b.name_en):'-'}</span></td>
      <td style="color:#C75B4A;font-weight:600;direction:ltr;text-align:right">${fmt(totalDr)}</td>
      <td style="color:#A5AF79;font-weight:600;direction:ltr;text-align:right">${fmt(totalCr)}</td>
      <td><span class="badge ${balanced?'badge-green':'badge-red'}">${balanced?t('acc_journalBalanced'):t('acc_journalUnbalanced')}</span></td>
    </tr>`;
    (e.lines||[]).forEach(l => {
      const acct = STORAGE.get('chartOfAccounts',[]).find(a => a.code === l.code);
      h += `<tr style="background:rgba(0,0,0,0.03)">
        <td></td><td style="font-family:monospace">${l.code}</td>
        <td style="padding-right:24px">${acct?(lang==='ar'?acct.name_ar:acct.name_en):l.code}</td>
        <td></td><td></td>
        <td style="direction:ltr;text-align:right;color:#C75B4A">${l.debit?fmt(l.debit):''}</td>
        <td style="direction:ltr;text-align:right;color:#A5AF79">${l.credit?fmt(l.credit):''}</td>
        <td></td></tr>`;
    });
  });
  h += '</tbody></table></div>';
  document.getElementById('journalTable').innerHTML = h;
}

function clearJournalDebit(i) { const v=parseFloat(document.getElementById('jl_cr_'+i).value); if(v>0){document.getElementById('jl_dr_'+i).value=0;} }

let journalLineCount = 0;
function addJournalLine() {
  const coa = STORAGE.get('chartOfAccounts', []);
  const acctOpts = coa.map(a => `<option value="${a.code}">${a.code} - ${lang==='ar'?a.name_ar:a.name_en}</option>`).join('');
  const linesDiv = document.getElementById('journalLines');
  const i = linesDiv.children.length;
  const div = document.createElement('div');
  div.className = 'form-row';
  div.style.cssText = 'align-items:end;gap:8px;margin-bottom:4px';
  div.id = 'jLine'+i;
  div.innerHTML = `<div class="form-group" style="flex:2;display:flex;gap:4px;align-items:end"><div style="flex:1"><select id="jl_code_${i}" style="width:100%"><option value="">${t('acc_selectAccount')}</option>${acctOpts}</select></div>
    <button class="btn btn-primary btn-sm" style="margin-bottom:1px;padding:6px 8px" onclick="quickAddSubAccount(${i})" title="${t('acc_addAccount')}"><i class="fas fa-plus"></i></button></div>
    <div class="form-group" style="flex:1"><input type="number" id="jl_dr_${i}" min="0" step="0.01" value="0" onchange="clearJournalCredit(${i})"></div>
    <div class="form-group" style="flex:1"><input type="number" id="jl_cr_${i}" min="0" step="0.01" value="0" onchange="clearJournalDebit(${i})"></div>
    <button class="btn btn-outline btn-sm" style="color:#C75B4A" onclick="this.closest('.form-row').remove()"><i class="fas fa-times"></i></button>`;
  linesDiv.appendChild(div);

function saveQuickAddSubAccount() {
  const code = document.getElementById('qa_code').value.trim();
  const type = document.getElementById('qa_type').value;
  const nameAr = document.getElementById('qa_nameAr').value.trim();
  const nameEn = document.getElementById('qa_nameEn').value.trim();
  if(!code || !nameAr || !nameEn) { alert(lang==='ar'?'أكمل جميع الحقول':'Fill all fields'); return; }

  const coa = STORAGE.get('chartOfAccounts', []);
  if(coa.find(a => a.code === code)) { alert(lang==='ar'?'رقم الحساب مكرر':'Account code already exists'); return; }

  const currentVal = document.getElementById('jl_code_'+quickAddLineIndex)?.value || '';
  const currentAcct = coa.find(a => a.code === currentVal);
  const parentCode = currentAcct ? currentAcct.code : null;
  const level = parentCode ? 3 : 1;

  coa.push({code, name_ar:nameAr, name_en:nameEn, type, parent:parentCode, level});
  STORAGE.set('chartOfAccounts', coa);

  refreshJournalAccountDropdowns();

  const newSelect = document.getElementById('jl_code_'+quickAddLineIndex);
  if(newSelect) newSelect.value = code;

  closeModal();
}

function refreshJournalAccountDropdowns() {
  const coa = STORAGE.get('chartOfAccounts', []);
  const acctOpts = coa.map(a => `<option value="${a.code}">${a.code} - ${lang==='ar'?a.name_ar:a.name_en}</option>`).join('');
  const linesDiv = document.getElementById('journalLines');
  if(!linesDiv) return;
  for(let i = 0; i < linesDiv.children.length; i++) {
    const sel = document.getElementById('jl_code_'+i);
    if(sel) {
      const currentVal = sel.value;
      sel.innerHTML = `<option value="">${t('acc_selectAccount')}</option>${acctOpts}`;
      sel.value = currentVal;
    }
  }
}

function saveJournalEntry(editId) {
  const date = document.getElementById('je_date').value;
  const ref = document.getElementById('je_ref').value.trim();
  const desc = document.getElementById('je_desc').value.trim();
  const franchiseId = document.getElementById('je_franchise')?.value || '';
  const branchId = document.getElementById('je_branch')?.value || '';
  const linesDiv = document.getElementById('journalLines');
  const lines = [];
  let totalDr = 0, totalCr = 0;

  for(let i = 0; i < linesDiv.children.length; i++) {
    const code = document.getElementById('jl_code_'+i)?.value || '';
    const dr = parseFloat(document.getElementById('jl_dr_'+i)?.value) || 0;
    const cr = parseFloat(document.getElementById('jl_cr_'+i)?.value) || 0;
    if(code && (dr > 0 || cr > 0)) {
      lines.push({code, debit: dr, credit: cr});
      totalDr += dr; totalCr += cr;
    }
  }

  if(lines.length < 2) { alert(lang==='ar'?'يجب إدخال سطرين على الأقل':'At least 2 lines required'); return; }
  if(Math.abs(totalDr - totalCr) > 0.01) { alert(t('acc_journalUnbalanced')); return; }

  const entries = STORAGE.get('journalEntries', []);
  if(editId) {
    const idx = entries.findIndex(e => e.id === editId);
    if(idx >= 0) entries[idx] = {id: editId, date, ref, desc, franchiseId, branchId, lines};
  } else {
    entries.push({id: uid(), date, ref, desc, franchiseId, branchId, lines});
  }
  STORAGE.set('journalEntries', entries);
  closeModal(); renderJournal();
}

function deleteJournalEntry(id) {
  if(!confirm(t('confirm_delete'))) return;
  let entries = STORAGE.get('journalEntries', []);
  entries = entries.filter(e => e.id !== id);
  STORAGE.set('journalEntries', entries);
  closeModal(); renderJournal();
}

function getAccountBalances() {
  const coa = STORAGE.get('chartOfAccounts', []);
  const entries = getFilteredJournalEntries();
  const balances = {};
  coa.forEach(a => { balances[a.code] = {code:a.code, name_ar:a.name_ar, name_en:a.name_en, type:a.type, debit:0, credit:0}; });
  entries.forEach(e => {
    (e.lines||[]).forEach(l => {
      if(!balances[l.code]) {
        const acct = coa.find(a => a.code === l.code);
        balances[l.code] = {code:l.code, name_ar:acct?acct.name_ar:l.code, name_en:acct?acct.name_en:l.code, type:acct?acct.type:'asset', debit:0, credit:0};
      }
      balances[l.code].debit += parseFloat(l.debit) || 0;
      balances[l.code].credit += parseFloat(l.credit) || 0;
    });
  });
  return balances;
}

function renderTrialBalance() {
  const balances = getAccountBalances();
  const codes = Object.keys(balances).sort();
  let totalDr = 0, totalCr = 0;
  let h = '';
  if(codes.length === 0) {
    h = '<div class="empty-state"><p>'+t('acc_noDataFinancials')+'</p></div>';
  } else {
    h = '<div class="table-wrap"><table><thead><tr><th>'+t('acc_accountCode')+'</th><th>'+t('acc_accountNameAr')+'</th><th>'+t('acc_journalDebit')+'</th><th>'+t('acc_journalCredit')+'</th><th>'+t('acc_balance')+'</th></tr></thead><tbody>';
    codes.forEach(code => {
      const b = balances[code];
      const bal = b.debit - b.credit;
      totalDr += b.debit; totalCr += b.credit;
      if(b.debit === 0 && b.credit === 0) return;
      h += `<tr>
        <td style="font-family:monospace;font-weight:700">${b.code}</td>
        <td>${lang==='ar'?b.name_ar:b.name_en}</td>
        <td style="direction:ltr;text-align:right">${b.debit?fmt(b.debit):'-'}</td>
        <td style="direction:ltr;text-align:right">${b.credit?fmt(b.credit):'-'}</td>
        <td style="direction:ltr;text-align:right;font-weight:700;color:${bal>=0?'#A5AF79':'#C75B4A'}">${fmt(Math.abs(bal))} ${bal>=0?(lang==='ar'?'مدين':'Dr'):(lang==='ar'?'دائن':'Cr')}</td>

  }
  document.getElementById('finTab_trialBalance').innerHTML = h;

function renderIncomeStatement() {
  const balances = getAccountBalances();
  const codes = Object.keys(balances).sort();
  let totalRevenue = 0, totalContraRevenue = 0, totalExpenses = 0;
  const revenueItems = [], contraRevenueItems = [], expenseItems = [];
  codes.forEach(code => {
    const b = balances[code];
    if(b.debit === 0 && b.credit === 0) return;
    const net = b.debit - b.credit;
    if(b.type === 'revenue' && b.credit > 0) { totalRevenue += b.credit; revenueItems.push(b); }
    if(b.type === 'contra_revenue' && b.debit > 0) { totalContraRevenue += b.debit; contraRevenueItems.push(b); }
    if(b.type === 'expense' && b.debit > 0) { totalExpenses += b.debit; expenseItems.push(b); }
  });
  const netRevenue = totalRevenue - totalContraRevenue;
  const netIncome = netRevenue - totalExpenses;
  let h = '';
  if(codes.length === 0) { h = '<div class="empty-state"><p>'+t('acc_noDataFinancials')+'</p></div>'; }
  else {
    h = '<div class="table-wrap" style="max-width:600px;margin:0 auto"><table style="width:100%">';
    h += `<tr><td colspan="2" style="text-align:center;font-size:18px;font-weight:700;padding:16px;border-bottom:2px solid var(--border)">${t('acc_incomeStatement')}</td></tr>`;
    h += `<tr><td style="padding:12px 8px;font-weight:700;border-bottom:1px solid var(--border);color:#A5AF79" colspan="2">${t('acc_revenueTotal')}</td></tr>`;
    revenueItems.forEach(r => { h += `<tr><td style="padding:4px 24px">${lang==='ar'?r.name_ar:r.name_en}</td><td style="direction:ltr;text-align:right;padding:4px 8px">${fmt(r.credit)}</td></tr>`; });
    contraRevenueItems.forEach(r => { h += `<tr><td style="padding:4px 24px;color:#C75B4A">${lang==='ar'?r.name_ar:r.name_en}</td><td style="direction:ltr;text-align:right;padding:4px 8px;color:#C75B4A">-${fmt(r.debit)}</td></tr>`; });
    h += `<tr><td style="padding:8px;border-top:1px solid var(--border);font-weight:700">${t('acc_revenueTotal')}</td><td style="direction:ltr;text-align:right;padding:8px;font-weight:700;border-top:1px solid var(--border)">${fmt(netRevenue)}</td></tr>`;
    h += `<tr><td style="padding:12px 8px;font-weight:700;border-bottom:1px solid var(--border);border-top:1px solid var(--border);color:#C75B4A" colspan="2">${t('acc_expenseTotal')}</td></tr>`;
    expenseItems.forEach(e => { h += `<tr><td style="padding:4px 24px">${lang==='ar'?e.name_ar:e.name_en}</td><td style="direction:ltr;text-align:right;padding:4px 8px">${fmt(e.debit)}</td></tr>`; });

      <span style="color:${netIncome>=0?'#A5AF79':'#C75B4A'}">${t('acc_netIncome')}: <strong>${fmt(netIncome)}</strong></span></td></tr>`;

}

function renderBalanceSheet() {
  const balances = getAccountBalances();
  const codes = Object.keys(balances).sort();
  let ca = 0, fa = 0, cl = 0, ltl = 0, equity = 0;
  const caItems = [], faItems = [], clItems = [], ltlItems = [], eqItems = [];
  codes.forEach(code => {
    const b = balances[code];
    if(b.debit === 0 && b.credit === 0) return;
    const net = b.debit - b.credit;
    if(b.type === 'asset' && (b.code.startsWith('11') || b.code === '1')) { ca += net; caItems.push(b); }
    else if(b.type === 'asset' && net !== 0) { fa += net; faItems.push(b); }
    else if(b.type === 'contra_asset') { fa += net; faItems.push(b); }
    else if(b.type === 'liability' && (b.code.startsWith('21') || b.code === '2')) { cl += b.credit - b.debit; clItems.push(b); }
    else if(b.type === 'liability' && (b.credit - b.debit) !== 0) { ltl += b.credit - b.debit; ltlItems.push(b); }
    else if(b.type === 'equity' && (b.credit - b.debit) !== 0) { equity += b.credit - b.debit; eqItems.push(b); }
  });
  const totalAssets = ca + fa;
  const totalLiab = cl + ltl;
  const totalLE = totalLiab + equity;
  let h = '';
  if(codes.length === 0) { h = '<div class="empty-state"><p>'+t('acc_noDataFinancials')+'</p></div>'; }
  else {
    h = '<div class="table-wrap" style="max-width:600px;margin:0 auto"><table style="width:100%">';
    h += `<tr><td colspan="2" style="text-align:center;font-size:18px;font-weight:700;padding:16px;border-bottom:2px solid var(--border)">${t('acc_balanceSheet')}</td></tr>`;
    h += `<tr><td colspan="2" style="padding:12px 8px;font-weight:700;color:#827148;border-bottom:1px solid var(--border)">${t('acc_totalAssets')}</td></tr>`;
    h += `<tr><td style="padding:8px 24px;font-weight:600">${t('acc_currentAssets')}</td><td style="direction:ltr;text-align:right;padding:4px 8px">${fmt(ca)}</td></tr>`;
    caItems.forEach(a => { h += `<tr><td style="padding:4px 40px;font-size:0.9em">${lang==='ar'?a.name_ar:a.name_en}</td><td style="direction:ltr;text-align:right;padding:4px 8px;font-size:0.9em">${fmt(a.debit-a.credit)}</td></tr>`; });
    h += `<tr><td style="padding:8px 24px;font-weight:600">${t('acc_fixedAssets')}</td><td style="direction:ltr;text-align:right;padding:4px 8px">${fmt(fa)}</td></tr>`;
    faItems.forEach(a => { h += `<tr><td style="padding:4px 40px;font-size:0.9em">${lang==='ar'?a.name_ar:a.name_en}</td><td style="direction:ltr;text-align:right;padding:4px 8px;font-size:0.9em">${fmt(a.debit-a.credit)}</td></tr>`; });
    h += `<tr><td style="padding:8px;font-weight:700;border-top:2px solid var(--border);background:rgba(130,113,72,0.05)" colspan="2">${t('acc_totalAssets')}: <strong style="direction:ltr">${fmt(totalAssets)}</strong></td></tr>`;
    h += `<tr><td colspan="2" style="padding:12px 8px;font-weight:700;color:#C75B4A;border-bottom:1px solid var(--border);border-top:2px solid var(--border)">${t('acc_totalLiabilities')}</td></tr>`;
    clItems.forEach(a => { h += `<tr><td style="padding:4px 24px">${lang==='ar'?a.name_ar:a.name_en}</td><td style="direction:ltr;text-align:right;padding:4px 8px">${fmt(a.credit-a.debit)}</td></tr>`; });
    ltlItems.forEach(a => { h += `<tr><td style="padding:4px 24px">${lang==='ar'?a.name_ar:a.name_en}</td><td style="direction:ltr;text-align:right;padding:4px 8px">${fmt(a.credit-a.debit)}</td></tr>`; });
    h += `<tr><td style="padding:8px;font-weight:700;border-top:1px solid var(--border)">${t('acc_totalLiabilities')}: <strong style="direction:ltr">${fmt(totalLiab)}</strong></td></tr>`;
    h += `<tr><td colspan="2" style="padding:12px 8px;font-weight:700;color:#827148;border-bottom:1px solid var(--border);border-top:1px solid var(--border)">${t('acc_totalEquity')}</td></tr>`;
    eqItems.forEach(a => { h += `<tr><td style="padding:4px 24px">${lang==='ar'?a.name_ar:a.name_en}</td><td style="direction:ltr;text-align:right;padding:4px 8px">${fmt(a.credit-a.debit)}</td></tr>`; });
    h += `<tr><td style="padding:8px;font-weight:700;border-top:1px solid var(--border)">${t('acc_totalEquity')}: <strong style="direction:ltr">${fmt(equity)}</strong></td></tr>`;
    h += `<tr><td style="padding:16px 8px;font-size:16px;font-weight:700;border-top:3px double var(--border);background:${Math.abs(totalAssets-totalLE)<0.01?'rgba(165,175,121,0.1)':'rgba(199,91,74,0.1)'}" colspan="2">
      ${Math.abs(totalAssets-totalLE)<0.01?'<span style="color:#A5AF79">✓ '+t('acc_journalBalanced')+'</span>':'<span style="color:#C75B4A">'+t('acc_journalUnbalanced')+'</span>'}
      &nbsp; Assets: ${fmt(totalAssets)} | L+E: ${fmt(totalLE)}</td></tr>`;
    h += '</table></div>';
  }
  document.getElementById('finTab_balanceSheet').innerHTML = h;
}
