function hasPermission(permId) {
  if(!currentUser) return false;
  if(currentUser.role === 'owner') return true;
  const users = STORAGE.get('users',defaultUsers);
  const u = users.find(x=>x.username===currentUser.username);
  if(!u || !u.permissions) {
    if(currentUser.role === 'operations') return DEFAULT_PERMS_OPERATIONS.includes(permId);
    if(currentUser.role === 'accounting') return DEFAULT_PERMS_ACCOUNTING.includes(permId);
    if(currentUser.role === 'head_of_sales') return DEFAULT_PERMS_HEAD_OF_SALES.includes(permId);
    if(currentUser.role === 'sm') return DEFAULT_PERMS_SALES_MANAGER.includes(permId);
    if(currentUser.role === 'tl') return DEFAULT_PERMS_TEAM_LEADER.includes(permId);
    if(currentUser.role === 'sales') return DEFAULT_PERMS_SALES.includes(permId);
    if(currentUser.role === 'md') return DEFAULT_PERMS_MARKETING_DIRECTOR.includes(permId);
    if(currentUser.role === 'ma') return DEFAULT_PERMS_MARKETING_ASSISTANT.includes(permId);
    if(currentUser.role === 'marketer') return DEFAULT_PERMS_MARKETER.includes(permId);
    return false;
  }
  return u.permissions.includes(permId);
}

function getAllUsers(){ return STORAGE.get('users',defaultUsers); }
function getUserByUsername(un){ return getAllUsers().find(u=>u.username===un); }
function getChildren(username){ return getAllUsers().filter(u=>u.parentId===username); }
function getTeamUserIds(username){
  const ids=[username];
  const kids=getChildren(username);
  kids.forEach(k=>{ ids.push(...getTeamUserIds(k.username)); });
  return ids;
}
function getDirectReports(username){ return getChildren(username); }
function isSalesSide(role){ return ['head_of_sales','sm','tl','sales'].includes(role); }
function isMarketingSide(role){ return ['md','ma','marketer'].includes(role); }
function getVisibleClientIds(){
  if(!currentUser) return [];
  const u=getUserByUsername(currentUser.username);
  if(!u) return [];
  const role=currentUser.role;
  if(role==='owner'||role==='super_admin'||role==='operations'||role==='accounting') return null;
  const teamIds=getTeamUserIds(currentUser.username);
  return teamIds;
}
function getVisibleClients(){
  const all=getCrmClients();
  const visibleIds=getVisibleClientIds();
  if(visibleIds===null) return all;
  return all.filter(c=>{
    const assignee=c.assignedUser||c.assignedTo||'';
    return visibleIds.includes(assignee);
  });
}
function getMyDirectReports(){ return currentUser?getDirectReports(currentUser.username):[]; }
function getMyTeam(){ return currentUser?getTeamUserIds(currentUser.username):[]; }
function canSeeClient(client){
  const visibleIds=getVisibleClientIds();
  if(visibleIds===null) return true;
  const assignee=client.assignedUser||client.assignedTo||'';
  return visibleIds.includes(assignee);
}

// ============================================================
// AUTH
// ============================================================
function doLogin() {
  try {
    const u = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value;
    if(!u || !p) {
      document.getElementById('loginError').textContent = lang==='ar'?'أدخل اسم المستخدم وكلمة المرور':'Enter username and password';
      return;
    }
    const users = STORAGE.get('users', defaultUsers);
    if(!users || !Array.isArray(users)) {
      document.getElementById('loginError').textContent = 'Data error. Click Reset.';
      return;
    }
    const found = users.find(x => x.username === u && x.password === p);
    if(!found) {
      document.getElementById('loginError').textContent = lang==='ar'?'اسم المستخدم أو كلمة المرور غير صحيحة':'Invalid credentials';
      return;
    }
    currentUser = {username:found.username,role:found.role,fullName:found.fullName};
    STORAGE.set('currentUser', currentUser);
    document.getElementById('loginError').textContent = '';
    showApp();
  } catch(e) {
    document.getElementById('loginError').textContent = 'Error: ' + e.message;
  }
}
function doLogout() {
  currentUser = null;
  safeStorage.remove('currentUser');
  document.getElementById('app').classList.remove('active');
  document.getElementById('loginPage').style.display = 'flex';
}
function showApp() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('app').classList.add('active');
  document.getElementById('userName').textContent = currentUser.fullName || currentUser.username;
  document.getElementById('userRole').textContent = t(currentUser.role);
  const avatarEl=document.getElementById('userAvatar');
  if(currentUser.avatar){avatarEl.innerHTML='<img src="'+currentUser.avatar+'" alt="avatar">';}
  else{avatarEl.textContent=getInitials(currentUser.fullName||currentUser.username);}
  buildSidebar();
  if(currentUser.role==='owner'||currentUser.role==='operations'||currentUser.role==='accounting') showPage('dashboard');
  else showPage('crm');
}

// ============================================================

function buildSidebar() {
  const nav = document.getElementById('sidebarNav');
  nav.innerHTML = NAV_ITEMS.filter(n => hasPermission(n.perm)).map(n =>
    `<div class="nav-item${n.id===currentPage?' active':''}" data-page="${n.id}" onclick="showPage('${n.id}')"><i class="fas ${n.icon}"></i><span>${t('nav_'+n.id)}</span></div>`
  ).join('');
}

function showPage(page) {
  const navItem = NAV_ITEMS.find(n=>n.id===page);
  if(navItem && !hasPermission(navItem.perm)) return;
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page===page));
  renderPage(page);
}

function renderPage(page) {
  const main = document.getElementById('mainContent');
  const pages = {
    dashboard: renderDashboard, sales: renderSales, employees: renderEmployees,
    orgChart: renderOrgChart, commissions: renderCommissions, accounting: renderAccounting,
    reports: renderReports, search: renderSearch, crm: renderCRM, crmAccounts: renderCrmAccounts, integrations: renderIntegrations, settings: renderSettings
  };
  if(pages[page]) pages[page](main);
}

function filterSalesList() {
  let sales = STORAGE.get('sales',[]);
  const search = (document.getElementById('filterSearch')?.value||'').trim().toLowerCase();
  const sp = document.getElementById('filterSalesPerson')?.value || '';
  const proj = document.getElementById('filterProject')?.value || '';
  const unitType = document.getElementById('filterUnitType')?.value || '';
  const bookingType = document.getElementById('filterBookingType')?.value || '';
  const saleType = document.getElementById('filterSaleType')?.value || '';
  const dFrom = document.getElementById('filterDateFrom')?.value || '';
  const dTo = document.getElementById('filterDateTo')?.value || '';
  const priceFrom = parseFloat(document.getElementById('filterPriceFrom')?.value) || 0;
  const priceTo = parseFloat(document.getElementById('filterPriceTo')?.value) || Infinity;

  const employees = STORAGE.get('employees',[]);
  const getEmpName = (id) => { const e=employees.find(x=>x.id===id); return e?e.name.toLowerCase():''; };

  if(search) {
    sales = sales.filter(s => {
      const empName = getEmpName(s.salesPersonId);
      const tlName = getEmpName(s.teamLeaderId);
      const smName = getEmpName(s.salesManagerId);
      return (s.code||'').toLowerCase().includes(search)
        || (s.client||'').toLowerCase().includes(search)
        || (s.clientPhone||'').includes(search)
        || (s.project||'').toLowerCase().includes(search)
        || (s.unitType||'').toLowerCase().includes(search)
        || (s.unitNum||'').toLowerCase().includes(search)
        || String(s.unitPrice||'').includes(search)
        || empName.includes(search)
        || tlName.includes(search)
        || smName.includes(search);
    });
  }
  if(sp) sales = sales.filter(s=>s.salesPersonId===sp||s.teamLeaderId===sp||s.salesManagerId===sp);
  if(proj) sales = sales.filter(s=>s.project===proj);
  if(unitType) sales = sales.filter(s=>s.unitType===unitType);
  if(bookingType) sales = sales.filter(s=>s.bookingType===bookingType);
  if(saleType) sales = sales.filter(s=>s.saleType===saleType);
  if(dFrom) sales = sales.filter(s=>s.date>=dFrom);
  if(dTo) sales = sales.filter(s=>s.date<=dTo);
  if(priceFrom) sales = sales.filter(s=>(s.unitPrice||0)>=priceFrom);
  if(priceTo<Infinity) sales = sales.filter(s=>(s.unitPrice||0)<=priceTo);

  const cnt = document.getElementById('salesCount');
  if(cnt) cnt.textContent = sales.length + ' / ' + STORAGE.get('sales',[]).length;

  renderSalesTable(sales);
}

function clearSalesFilters() {
  ['filterSearch','filterSalesPerson','filterProject','filterUnitType','filterBookingType','filterSaleType','filterDateFrom','filterDateTo','filterPriceFrom','filterPriceTo'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.value = '';
  });
  filterSalesList();
}

function renderSalesTable(sales) {
  const employees = STORAGE.get('employees',[]);
  const getEmpName = (id) => { const e=employees.find(x=>x.id===id); return e?e.name:'-'; };
  if(sales.length===0) { document.getElementById('salesTable').innerHTML='<div class="empty-state"><p>'+t('noData')+'</p></div>'; return; }
  let h='<table><thead><tr><th>'+t('sale_code')+'</th><th>'+t('sale_date')+'</th><th>'+t('sale_client')+'</th><th>'+t('sale_project')+'</th><th>'+t('sale_unitType')+'</th><th>'+t('sale_unitNum')+'</th><th>'+t('sale_price')+'</th><th>'+t('sale_commissionRate')+'</th><th>'+t('sale_commissionAmount')+'</th><th>'+t('sale_bookingType')+'</th><th>'+t('sale_salesPerson')+'</th><th></th></tr></thead><tbody>';
  sales.forEach(s => {
    const comm = (s.unitPrice||0)*(s.commissionRate||0)/100;
    const cond = s.commissionRate>=3.5;
    h+=`<tr>
      <td><strong>${s.code}</strong></td><td>${fmtDate(s.date)}</td><td>${s.client}</td><td>${s.project}</td>
      <td>${s.unitType}</td><td>${s.unitNum}</td><td>${fmt(s.unitPrice)}</td>

function calcNewRate(sale) {
  const employees = STORAGE.get('employees',[]);
  const spEmp = employees.find(e=>e.id===sale.salesPersonId);
  if(!spEmp) return sale.commissionRate;
  const roleCfg = getRoleConfig(spEmp.role);
  if(!roleCfg) return sale.commissionRate;
  if(roleCfg.type === 'fixed' || roleCfg.type === 'per_million') return 3.5;
  if(roleCfg.type === 'sales_tier') {
    const sales = STORAGE.get('sales',[]);
    const monthStart = new Date(sale.date);
    monthStart.setDate(1);
    const monthStartStr = monthStart.toISOString().slice(0,10);
    const monthSales = sales.filter(s=>s.date>=monthStartStr && s.date<=sale.date && s.salesPersonId===sale.salesPersonId && s.id!==sale.id);
    const totalSold = monthSales.reduce((s,x)=>s+(x.unitPrice||0),0) + (sale.unitPrice||0);
    const target = roleCfg.defaultTarget || 10000000;
    const ach = Math.min(100, (totalSold/target)*100);
    return ach <= 50 ? roleCfg.tiers[0].rate/1000 : ach <= 80 ? roleCfg.tiers[1].rate/1000 : roleCfg.tiers[2].rate/1000;
  }
  return sale.commissionRate;
}

function calcSaleCommission() {
  const price = parseFloat(document.getElementById('s_price').value)||0;
  const rate = parseFloat(document.getElementById('s_commRate').value)||0;
  const payoutDays = parseInt(document.getElementById('s_payoutDays').value)||30;
  const comm = price * rate / 100;
  document.getElementById('s_commAmount').value = fmt(comm);

  const dateVal = document.getElementById('s_date').value || today();
  const expiry = addDays(dateVal, payoutDays);
  document.getElementById('s_expiry').value = expiry;

  const isFull = rate >= 3.5;
  const isHalf = rate <= 3.0 && !isFull;
  const condText = isFull ? t('sale_fullPayout') : (isHalf ? t('sale_halfPayout') : t('sale_fullPayout'));

  const sales = STORAGE.get('sales',[]);
  const employees = STORAGE.get('employees',[]);
  const spId = document.getElementById('s_salesPerson').value;
  const spEmp = employees.find(e=>e.id===spId);
  const roleCfg = spEmp ? getRoleConfig(spEmp.role) : null;
  let achievementText = '';
  if(roleCfg && roleCfg.type === 'sales_tier' && roleCfg.tiers && roleCfg.defaultTarget > 0) {
    const monthStart = new Date(dateVal.getFullYear(), dateVal.getMonth(), 1).toISOString().slice(0,10);
    const monthSales = sales.filter(s=>s.date>=monthStart && s.date<=dateVal && s.salesPersonId===spId);
    const totalSold = monthSales.reduce((s,x)=>s+(x.unitPrice||0),0) + price;
    const ach = Math.min(100, (totalSold/roleCfg.defaultTarget)*100);
    let tierRate = roleCfg.tiers[0].rate;
    if(ach > 50) tierRate = roleCfg.tiers[1].rate;
    if(ach > 80) tierRate = roleCfg.tiers[2].rate;
    const millions = price / 1000000;
    const spComm = isHalf ? tierRate * millions * 0.5 : tierRate * millions;
    achievementText = `<br><b>${getRoleLabel(spEmp.role)}:</b> ${ach.toFixed(1)}% → ${fmt(spComm)} / مليون`;
  }

  let resaleText = '';
  const saleTypeEl = document.getElementById('s_saleType');
  if(saleTypeEl && saleTypeEl.value === 'resale' && comm > 0) {
    const resaleTeam = getResaleTeam();
    let lines = [];
    resaleTeam.forEach(rule => {
      const empId = document.getElementById('s_salesPerson') && document.getElementById('s_teamLeader');
      const pct = rule.pct;
      const amt = comm * pct / 100;
      lines.push(`${getRoleLabel(rule.roleId)}: ${pct}% = ${fmt(amt)}`);
    });
    if(lines.length) resaleText = `<br><b style="color:#B76E79">${t('comm_resaleTeam')}:</b> ${lines.join(' | ')}`;
  }

  document.getElementById('commPreviewBox').innerHTML =
    `<b>${t('sale_commissionCondition')}:</b> <span class="badge ${isFull?'badge-green':'badge-red'}">${condText}</span><br>` +
    `<b>${t('comm_companyAmount')}:</b> ${fmt(comm)} | ` +
    `<b>${t('sale_expiry')}:</b> ${fmtDate(expiry)}` + achievementText + resaleText;
}

function getRulesHash() {
  const roles = getAllRoles();
  return JSON.stringify(roles.map(r=>({id:r.id,type:r.type,rate:r.rate,tiers:r.tiers,defaultTarget:r.defaultTarget})));
}

function applyRulesToSale(saleId) {
  let sales = STORAGE.get('sales',[]);
  const sale = sales.find(s=>s.id===saleId);
  if(!sale) return;
  const employees = STORAGE.get('employees',[]);
  const spEmp = employees.find(e=>e.id===sale.salesPersonId);
  if(!spEmp) return;
  const roleCfg = getRoleConfig(spEmp.role);
  if(!roleCfg) return;

  let newRate = sale.commissionRate;
  if(roleCfg.type === 'fixed') {
    newRate = 3.5;
  } else if(roleCfg.type === 'per_million') {
    newRate = 3.5;
  } else if(roleCfg.type === 'sales_tier') {
    const monthStart = new Date(sale.date);
    monthStart.setDate(1);
    const monthStartStr = monthStart.toISOString().slice(0,10);
    const monthSales = sales.filter(s=>s.date>=monthStartStr && s.date<=sale.date && s.salesPersonId===sale.salesPersonId && s.id!==saleId);
    const totalSold = monthSales.reduce((s,x)=>s+(x.unitPrice||0),0) + (sale.unitPrice||0);
    const target = roleCfg.defaultTarget || 10000000;
    const ach = Math.min(100, (totalSold/target)*100);
    newRate = ach <= 50 ? roleCfg.tiers[0].rate/1000 : ach <= 80 ? roleCfg.tiers[1].rate/1000 : roleCfg.tiers[2].rate/1000;
  }

  sales = sales.map(s => {
    if(s.id === saleId) {
      return {...s, commissionRate: newRate, commRuleHash: getRulesHash()};
    }
    return s;
  });
  STORAGE.set('sales', sales);
  alert(t('comm_updated'));
  renderPage('sales');
}

function applyRulesToAll() {
  if(!confirm(t('comm_applyConfirm'))) return;
  let sales = STORAGE.get('sales',[]);
  const employees = STORAGE.get('employees',[]);
  const currentHash = getRulesHash();
  let updated = 0;

  sales = sales.map(s => {
    if(s.commRuleHash === currentHash) return s;
    const spEmp = employees.find(e=>e.id===s.salesPersonId);
    if(!spEmp) return {...s, commRuleHash: currentHash};
    const roleCfg = getRoleConfig(spEmp.role);
    if(!roleCfg) return {...s, commRuleHash: currentHash};

    let newRate = s.commissionRate;
    if(roleCfg.type === 'fixed') {
      newRate = 3.5;
    } else if(roleCfg.type === 'per_million') {
      newRate = 3.5;
    } else if(roleCfg.type === 'sales_tier') {
      const monthStart = new Date(s.date);
      monthStart.setDate(1);
      const monthStartStr = monthStart.toISOString().slice(0,10);
      const monthSales = sales.filter(x=>x.date>=monthStartStr && x.date<=s.date && x.salesPersonId===s.salesPersonId && x.id!==s.id);
      const totalSold = monthSales.reduce((a,x)=>a+(x.unitPrice||0),0) + (s.unitPrice||0);
      const target = roleCfg.defaultTarget || 10000000;
      const ach = Math.min(100, (totalSold/target)*100);
      newRate = ach <= 50 ? roleCfg.tiers[0].rate/1000 : ach <= 80 ? roleCfg.tiers[1].rate/1000 : roleCfg.tiers[2].rate/1000;
    }

    updated++;
    return {...s, commissionRate: newRate, commRuleHash: currentHash};
  });

  STORAGE.set('sales', sales);
  alert(t('comm_applied') + ': ' + updated);
  renderCommRules();
}

function filterEmpList() {
  let employees = STORAGE.get('employees',[]);
  const search = (document.getElementById('empFilterSearch')?.value||'').trim().toLowerCase();
  const role = document.getElementById('empFilterRole')?.value || '';
  const status = document.getElementById('empFilterStatus')?.value || '';
  const salaryFrom = parseFloat(document.getElementById('empFilterSalaryFrom')?.value) || 0;
  const salaryTo = parseFloat(document.getElementById('empFilterSalaryTo')?.value) || Infinity;

  if(search) {
    employees = employees.filter(e =>
      (e.name||'').toLowerCase().includes(search)
      || (e.nationalId||'').toLowerCase().includes(search)
      || (e.personalPhone||'').includes(search)
      || (e.workPhone||'').includes(search)
      || (e.address||'').toLowerCase().includes(search)
      || getRoleLabel(e.role).toLowerCase().includes(search)
    );
  }
  if(role) employees = employees.filter(e=>e.role===role);
  if(status) employees = employees.filter(e=>e.status===status);
  if(salaryFrom>0) employees = employees.filter(e=>(e.salary||0)>=salaryFrom);
  if(salaryTo<Infinity) employees = employees.filter(e=>(e.salary||0)<=salaryTo);

  const countEl = document.getElementById('empFilterCount');
  if(countEl) countEl.textContent = employees.length + ' ' + t('emp_filterResults');

  if(employees.length===0) { document.getElementById('empTable').innerHTML='<div class="empty-state"><p>'+t('emp_filterNoResult')+'</p></div>'; return; }

  employees.forEach(emp => {

      ? `<span class="badge badge-green" style="cursor:pointer" onclick="openEmpFiles('${emp.id}')"><i class="fas fa-paperclip"></i> ${files.length}</span>`
      : `<span class="badge badge-yellow">${t('emp_noFiles')}</span>`;

      <td><span class="badge badge-blue">${getRoleLabel(emp.role)}</span></td>

      <td>${emp.address||'-'}</td><td>${fmt(emp.salary)}</td><td>${fmt(emp.target)}</td>

    </tr>`;
  });
  h+='</tbody></table>';
  document.getElementById('empTable').innerHTML=h;
}

function saveEmp(empId) {
  const role = document.getElementById('e_role').value;
  const name = document.getElementById('e_name').value.trim();
  if(!name) return;
  const data = {
    role, name,
    nationalId: document.getElementById('e_nationalId').value.trim(),
    personalPhone: document.getElementById('e_personalPhone').value.trim(),
    workPhone: document.getElementById('e_workPhone').value.trim(),
    address: document.getElementById('e_address').value.trim(),
    salary: parseFloat(document.getElementById('e_salary').value)||0,
    target: parseFloat(document.getElementById('e_target').value)||0,
    status: document.getElementById('e_status').value,
    supervisor: document.getElementById('e_supervisor').value,
    files: window._pendingEmpFiles || []
  };
  let employees = STORAGE.get('employees',[]);
  if(empId) {
    employees = employees.map(e=>e.id===empId?{...e,...data}:e);
  } else {
    data.id = uid();
    employees.push(data);
  }
  STORAGE.set('employees',employees);
  closeModal();
  renderPage('employees');
}

function handleEmpFileSelect(event) {
  const files = event.target.files;
  if(!files.length) return;
  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = function(e) {
      window._pendingEmpFiles = window._pendingEmpFiles || [];
      window._pendingEmpFiles.push({
        name: file.name,
        size: file.size,
        type: file.type,
        date: today(),
        data: e.target.result
      });
      renderEmpFilesList();
    };
    reader.readAsDataURL(file);
  });
  event.target.value = '';
}

function renderEmpFilesList() {
  const container = document.getElementById('empFilesList');
  if(!container) return;
  const files = window._pendingEmpFiles || [];
  if(files.length === 0) { container.innerHTML = '<p style="color:var(--text-light);font-size:13px">'+t('emp_noFiles')+'</p>'; return; }
  let h = '<table style="font-size:13px"><thead><tr><th>'+t('emp_fileName')+'</th><th>'+t('emp_fileSize')+'</th><th>'+t('emp_fileDate')+'</th><th></th></tr></thead><tbody>';
  files.forEach((f, i) => {
    const sizeKB = (f.size/1024).toFixed(1);
    const sizeStr = sizeKB > 1024 ? (sizeKB/1024).toFixed(1)+' MB' : sizeKB+' KB';
    const icon = f.type.includes('pdf') ? 'fa-file-pdf' : f.type.includes('image') ? 'fa-file-image' : 'fa-file-word';
    h += `<tr>
      <td><i class="fas ${icon}" style="color:var(--danger);margin-left:6px"></i> ${f.name}</td>
      <td>${sizeStr}</td>
      <td>${fmtDate(f.date)}</td>
      <td>
        <a href="${f.data}" download="${f.name}" class="btn btn-outline btn-sm" style="padding:4px 10px;font-size:12px"><i class="fas fa-download"></i></a>
        <button class="btn btn-danger btn-sm" style="padding:4px 10px;font-size:12px" onclick="removeEmpFile(${i})"><i class="fas fa-trash"></i></button>
      </td>
    </tr>`;
  });
  h += '</tbody></table>';
  container.innerHTML = h;
}

function removeEmpFile(index) {
  window._pendingEmpFiles.splice(index, 1);
  renderEmpFilesList();
}

function openEmpFiles(empId) {
  const emp = STORAGE.get('employees',[]).find(e=>e.id===empId);
  if(!emp) return;
  const files = emp.files || [];
  let html = `<h3><i class="fas fa-paperclip"></i> ${t('emp_files')} - ${emp.name}</h3>`;
  if(files.length === 0) {
    html += '<div class="empty-state"><p>'+t('emp_noFiles')+'</p></div>';
  } else {
    html += '<div class="table-wrap"><table><thead><tr><th>'+t('emp_fileName')+'</th><th>'+t('emp_fileSize')+'</th><th>'+t('emp_fileDate')+'</th><th></th></tr></thead><tbody>';
    files.forEach((f, i) => {
      const sizeKB = (f.size/1024).toFixed(1);
      const sizeStr = sizeKB > 1024 ? (sizeKB/1024).toFixed(1)+' MB' : sizeKB+' KB';
      const icon = f.type.includes('pdf') ? 'fa-file-pdf' : f.type.includes('image') ? 'fa-file-image' : 'fa-file-word';
      html += `<tr>
        <td><i class="fas ${icon}" style="color:var(--danger);margin-left:6px"></i> ${f.name}</td>
        <td>${sizeStr}</td><td>${fmtDate(f.date)}</td>
        <td>
          ${f.type.includes('image') ? `<a href="${f.data}" target="_blank" class="btn btn-outline btn-sm" style="padding:4px 10px;font-size:12px"><i class="fas fa-eye"></i> ${t('emp_viewFile')}</a>` : ''}

          ${canEdit()?`<button class="btn btn-danger btn-sm" style="padding:4px 10px;font-size:12px" onclick="deleteEmpFile('${empId}',${i})"><i class="fas fa-trash"></i></button>`:''}

    });
    html += '</tbody></table></div>';
  }
  html += `<div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">${t('cancel')}</button></div>`;
  document.getElementById('modalContainer').innerHTML = html;
  document.getElementById('modalContainer').style.width = '650px';
  document.getElementById('modalOverlay').classList.add('active');
}

function deleteEmpFile(empId, fileIndex) {
  if(!confirm(t('confirm_delete'))) return;
  let employees = STORAGE.get('employees',[]);
  employees = employees.map(e => {
    if(e.id === empId && e.files) {
      e.files.splice(fileIndex, 1);
    }
    return e;
  });
  STORAGE.set('employees', employees);
  closeModal();
  openEmpFiles(empId);
}

function deleteEmp(id) {
  if(!confirm(t('confirm_delete'))) return;
  STORAGE.set('employees',STORAGE.get('employees',[]).filter(e=>e.id!==id));
  renderPage('employees');
}

function deleteOrgEmp(id) {
  if(!confirm(t('confirm_delete'))) return;
  STORAGE.set('employees',STORAGE.get('employees',[]).filter(e=>e.id!==id));

function downloadEmpTemplate() {
  const headers = ['role','name','nationalId','personalPhone','workPhone','address','salary','target','status'];
  const sample = getAllRoles().slice(0,3).map(r=>[r.id,r.ar,'29001011234567','01012345678','01011111111','العنوان',8000,10000000,'active']);
  const ws = XLSX.utils.aoa_to_sheet([headers,...sample]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Employees');
  XLSX.writeFile(wb,'employees_template.xlsx');
}

function importEmpExcel(event) {
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const wb = XLSX.read(e.target.result,{type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(ws);
      let employees = STORAGE.get('employees',[]);
      let added = 0;
      data.forEach(row => {
        if(!row.name) return;
        employees.push({
          id: uid(),
          role: row.role || 'property_consultant',
          name: row.name,
          nationalId: String(row.nationalId || ''),
          personalPhone: String(row.personalPhone || ''),
          workPhone: String(row.workPhone || ''),
          address: row.address || '',
          salary: parseFloat(row.salary) || 0,
          target: parseFloat(row.target) || 0,
          status: row.status || 'active',
          supervisor: ''
        });
        added++;
      });
      STORAGE.set('employees',employees);
      alert(added + ' ' + t('saved'));
      renderPage('employees');
    } catch(err) { alert('Import error: ' + err.message); }
  };
  reader.readAsArrayBuffer(file);
  event.target.value = '';
}

function renderOrgChart(el) {
  const employees = STORAGE.get('employees',[]);
  el.innerHTML = `
  <div class="topbar"><h1>${t('nav_orgChart')}</h1><div class="topbar-actions">
    ${canEdit()?'<button class="btn btn-primary" onclick="openEmpForm()"><i class="fas fa-plus"></i> '+t('addEmployee')+'</button>':''}
  </div></div>
  <div class="card" style="overflow-x:auto"><div class="org-tree" id="orgTree" ondragover="event.preventDefault()" ondrop="orgTreeDrop(event)"></div></div>`;

  if(employees.length===0) { document.getElementById('orgTree').innerHTML='<div class="empty-state"><p>'+t('noData')+'</p></div>'; return; }

  const roots = employees.filter(e=>!e.supervisor||!employees.find(x=>x.id===e.supervisor));
  const childMap = {};
  employees.forEach(e=>{ if(e.supervisor){ if(!childMap[e.supervisor]) childMap[e.supervisor]=[]; childMap[e.supervisor].push(e); }});

  const avClass = (role) => {
    if(['property_advisor','property_consultant','senior_property_consultant','team_leader','sales_manager','sales_director'].includes(role)) return 'av-sales';
    if(['marketing_director','marketing_assistant'].includes(role)) return 'av-marketing';
    if(['hr_manager','hr_agent'].includes(role)) return 'av-hr';
    if(['operation_director','operation'].includes(role)) return 'av-ops';
    if(['accountant','collector'].includes(role)) return 'av-acct';
    if(role==='ceo') return 'av-exec';
    return 'av-default';
  };

  function buildNode(emp) {
    const children = childMap[emp.id]||[];
    let html = `<div class="org-branch"><div class="org-node" draggable="${canEdit()?'true':'false'}" data-emp-id="${emp.id}" ondragstart="orgNodeDrag(event,'${emp.id}')" ondragover="event.preventDefault();this.style.borderColor='var(--primary)'" ondragleave="this.style.borderColor=''" ondrop="orgNodeDrop(event,'${emp.id}')">
      <div class="org-node-header">
        <div class="org-avatar ${avClass(emp.role)}">${getInitials(emp.name)}</div>
        <div class="org-node-name">${emp.name}${emp.status!=='active'?' <i class="fas fa-ban" style="color:var(--danger);font-size:10px"></i>':''}</div>
        <div class="org-node-role">${getRoleLabel(emp.role)}</div>
      </div>
      <div class="org-node-info"><span><i class="fas fa-money-bill-wave"></i> ${fmt(emp.salary)}</span></div>
      <div class="org-node-actions">
        ${canEdit()?`<button onclick="event.stopPropagation();openEmpForm('${emp.id}')" title="Edit"><i class="fas fa-pen"></i></button><button onclick="event.stopPropagation();showOrgAddChild('${emp.id}')" title="Add subordinate"><i class="fas fa-user-plus"></i></button><button onclick="event.stopPropagation();deleteOrgEmp('${emp.id}')" title="Delete" style="color:var(--danger)"><i class="fas fa-trash"></i></button>`:''}
      </div>
    </div>`;
    if(children.length>0) { html+='<div class="org-connector"></div><div class="org-level">'; children.forEach(c=>{html+=buildNode(c);}); html+='</div>'; }
    html+='</div>'; return html;
  }

  let tree=`<div class="org-branch"><div class="org-node root">
    <div class="org-node-header"><div class="org-avatar av-root"><i class="fas fa-building"></i></div>
    <div class="org-node-name">Marts</div><div class="org-node-role">${t('nav_orgChart')}</div></div>
    <div class="org-node-info"><span><i class="fas fa-users"></i> ${employees.length}</span><span><i class="fas fa-check-circle"></i> ${employees.filter(e=>e.status==='active').length}</span></div>
  </div><div class="org-connector"></div><div class="org-level">`;
  roots.forEach(r=>{tree+=buildNode(r);});
  tree+='</div></div>';
  document.getElementById('orgTree').innerHTML=tree;
}

let _dragEmpId = null;
function orgNodeDrag(e, id) { _dragEmpId = id; e.dataTransfer.effectAllowed = 'move'; }
function orgNodeDrop(e, targetId) {
  e.preventDefault();
  e.currentTarget.style.borderColor = '';
  if(!_dragEmpId || _dragEmpId === targetId) return;
  if(!confirm(t('confirm_delete'))) return;
  let employees = STORAGE.get('employees',[]);
  const emp = employees.find(x=>x.id===_dragEmpId);
  const target = employees.find(x=>x.id===targetId);
  if(!emp || !target) return;
  emp.supervisor = targetId;
  STORAGE.set('employees', employees);
  renderPage('orgChart');
}
function orgTreeDrop(e) {
  e.preventDefault();
  if(!_dragEmpId) return;
  if(!confirm(t('confirm_delete'))) return;
  let employees = STORAGE.get('employees',[]);
  const emp = employees.find(x=>x.id===_dragEmpId);
  if(!emp) return;
  emp.supervisor = null;
  STORAGE.set('employees', employees);
  renderPage('orgChart');
}

function renderRuleTester() {
  const container = document.getElementById('commTab_tester');
  const roles = getAllRoles();
  const lg = lang==='ar';

  const fixedTests = [
    {roleId:'hr_manager', contracts:3},
    {roleId:'operation_director', contracts:2},
    {roleId:'accountant', contracts:5}
  ];
  const perMillionTests = [
    {roleId:'ceo', price:5000000},
    {roleId:'marketing_director', price:3000000},
    {roleId:'marketing_assistant', price:8000000}
  ];
  const tierTests = [
    {roleId:'property_consultant', price:3000000, monthSales:0, desc:lg?'بيعة واحدة فقط':'Single sale only'},
    {roleId:'senior_property_consultant', price:10000000, monthSales:0, desc:lg?'بيعة واحدة فقط':'Single sale only'},
    {roleId:'team_leader', price:7000000, monthSales:0, desc:lg?'بيعة واحدة فقط':'Single sale only'}
  ];

  function calcFixed(roleId, contracts) {
    const cfg = getRoleConfig(roleId);
    if(!cfg) return {rate:0, total:0};
    return {rate:cfg.rate, total:cfg.rate * contracts};
  }
  function calcPerMillion(roleId, price) {
    const cfg = getRoleConfig(roleId);
    if(!cfg) return {rate:0, total:0};
    const millions = price / 1000000;
    return {rate:cfg.rate, total:cfg.rate * millions, millions};
  }
  function calcTier(roleId, price, monthSales) {
    const cfg = getRoleConfig(roleId);
    if(!cfg || !cfg.tiers) return {rate:0, total:0, ach:0, tierIdx:0};
    const target = cfg.defaultTarget || 10000000;
    const total = monthSales + price;
    const ach = Math.min(100, (total / target) * 100);
    let tierIdx = 0;
    if(ach > 80) tierIdx = 2;
    else if(ach > 50) tierIdx = 1;
    const tierRate = cfg.tiers[tierIdx].rate / 1000;
    return {rate:tierRate, total:price * tierRate / 100, ach, tierIdx, target};
  }

  function testResultCard(title, icon, color, examples) {
    let h = `<div style="background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:24px;border-right:5px solid ${color}">`;
    h += `<h3 style="margin-bottom:20px;display:flex;align-items:center;gap:10px"><i class="fas ${icon}" style="color:${color}"></i> ${title}</h3>`;
    h += `<div style="display:grid;gap:16px">`;
    examples.forEach((ex, idx) => {
      const pass = ex.computed === ex.expected;
      const passColor = pass ? 'var(--success)' : 'var(--danger)';
      const passText = pass ? t('tester_pass') : t('tester_fail');
      h += `<div style="background:var(--bg);border-radius:12px;padding:16px;border:2px solid ${passColor}">`;
      h += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">`;
      h += `<span style="font-weight:800;font-size:14px">${t('tester_example')} ${idx+1}: ${ex.roleLabel}</span>`;
      h += `<span style="background:${passColor};color:#000;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:700">${passText}</span>`;
      h += `</div>`;
      h += `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;font-size:13px">`;
      ex.inputs.forEach(inp => {
        h += `<div><span style="color:var(--text-light)">${inp.label}:</span> <b>${inp.value}</b></div>`;
      });
      h += `<div style="border-top:2px dashed var(--border);padding-top:8px;margin-top:4px"><span style="color:var(--text-light)">${t('tester_formula')}:</span> <span style="color:var(--accent);font-weight:700">${ex.formula}</span></div>`;
      h += `<div style="border-top:2px dashed var(--border);padding-top:8px;margin-top:4px"><span style="color:var(--text-light)">${t('tester_expected')}:</span> <b>${fmt(ex.expected)}</b></div>`;
      h += `<div style="border-top:2px solid ${passColor};padding-top:8px;margin-top:4px"><span style="color:var(--text-light)">${t('tester_result')}:</span> <b style="color:${passColor}">${fmt(ex.computed)}</b></div>`;
      h += `</div></div>`;
    });
    h += `</div></div>`;
    return h;
  }

  let html = `<div style="padding:20px"><div class="topbar"><h1><i class="fas fa-flask"></i> ${t('tester_tab')}</h1></div>`;
  html += `<div style="background:var(--card);border-radius:var(--radius);padding:16px 24px;margin-bottom:24px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;border-right:5px solid var(--accent)">
    <i class="fas fa-info-circle" style="color:var(--accent);font-size:20px"></i>
    <span style="font-size:14px">${lg?'أمثلة تفاعلية للتحقق من صحة حساب العمولات حسب كل نوع قاعدة. البيانات قابلة للتعديل والنتائج تتحدث فوراً.':'Interactive examples to verify commission calculations for each rule type. Data is editable and results update instantly.'}</span>
  </div>`;

  const fixedExamples = fixedTests.map(ex => {
    const cfg = getRoleConfig(ex.roleId);
    const r = calcFixed(ex.roleId, ex.contracts);
    return {
      roleLabel: cfg ? (lg ? cfg.ar : cfg.en) : ex.roleId,
      inputs: [{label:t('tester_contracts'), value:ex.contracts}],
      formula: `${fmt(r.rate)} ${t('tester_perContract')} × ${ex.contracts}`,
      expected: r.total, computed: r.total
    };
  });
  html += testResultCard(t('tester_fixed'), 'fa-file-contract', 'var(--accent)', fixedExamples);

  const perMillionExamples = perMillionTests.map(ex => {

      formula: `${tierLabels[r.tierIdx]} → ${fmt(r.rate*1000)} ${lg?'/ مليون':'/million'} = ${(r.rate*100).toFixed(1)}% × ${fmt(ex.price)}`,

function runTesterCalc() {
  const el = document.getElementById('testerCalcResult');
  if(!el) return;
  const roleId = document.getElementById('testerCalcRole').value;
  const price = parseFloat(document.getElementById('testerCalcPrice').value)||0;
  const contracts = parseInt(document.getElementById('testerCalcContracts').value)||1;
  const cfg = getRoleConfig(roleId);
  const lg = lang==='ar';
  if(!cfg) { el.innerHTML=''; return; }

  let result = '', formula = '', rate = 0, commission = 0;

  if(cfg.type === 'fixed') {
    rate = cfg.rate;
    commission = rate * contracts;
    formula = `${fmt(rate)} ${t('tester_perContract')} × ${contracts} = ${fmt(commission)}`;
  } else if(cfg.type === 'per_million') {
    rate = cfg.rate;
    const millions = price / 1000000;
    commission = rate * millions;
    formula = `${fmt(rate)} × ${millions.toFixed(1)} ${t('tester_perMillionLabel')} = ${fmt(commission)}`;
  } else if(cfg.type === 'sales_tier') {
    const target = cfg.defaultTarget || 10000000;
    const ach = Math.min(100, (price / target) * 100);
    let tierIdx = 0;
    if(ach > 80) tierIdx = 2;
    else if(ach > 50) tierIdx = 1;
    rate = cfg.tiers[tierIdx].rate / 1000;
    commission = price * rate / 100;
    const tierLabels = [t('tester_tier1'), t('tester_tier2'), t('tester_tier3')];
    formula = `${lg?'الهدف':'Target'}: ${fmt(target)} | ${lg?'الإنجاز':'Ach'}: ${ach.toFixed(1)}% → ${tierLabels[tierIdx]} → ${(rate*100).toFixed(1)}% × ${fmt(price)} = ${fmt(commission)}`;
  }

  el.innerHTML = `<div style="background:var(--bg);border-radius:12px;padding:16px;border:2px solid var(--primary)">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px;font-size:14px">
      <div><span style="color:var(--text-light)">${t('tester_role')}:</span> <b>${cfg?(lg?cfg.ar:cfg.en):''}</b> <span class="badge badge-blue">${cfg.type}</span></div>
      <div><span style="color:var(--text-light)">${t('tester_currentRate')}:</span> <b>${cfg.type==='sales_tier'?(cfg.tiers.map(t2=>(t2.rate/10).toFixed(0)+'%').join(' / ')):cfg.rate+(cfg.type==='fixed'?' '+t('tester_perContract'):' '+t('tester_perMillionLabel'))}</b></div>
    </div>
    <div style="font-size:14px;color:var(--accent);font-weight:700;margin-bottom:8px">${t('tester_formula')}: ${formula}</div>
    <div style="font-size:22px;font-weight:900;color:var(--primary)">${t('tester_commission')}: ${fmt(commission)}</div>
  </div>`;
}

function saveRule(existingId) {
  const ar = document.getElementById('ruleAr').value.trim();
  const en = document.getElementById('ruleEn').value.trim();
  if(!ar||!en) return;

  const roles = getAllRoles();
  const type = existingId ? roles.find(r=>r.id===existingId).type : document.getElementById('ruleType').value;
  const id = existingId || 'role_' + Date.now();

  const newRole = {id, ar, en, type, defaultTarget:0};

  if(type === 'fixed') {
    newRole.rate = parseFloat(document.getElementById('ruleFixedRate').value)||0;
  } else if(type === 'per_million') {
    newRole.rate = parseFloat(document.getElementById('ruleMillionRate').value)||0;
  } else if(type === 'sales_tier') {
    newRole.defaultTarget = parseFloat(document.getElementById('ruleTarget').value)||0;
    newRole.tiers = [];
    for(let i=1;i<=3;i++){
      newRole.tiers.push({
        min: parseInt(document.getElementById('tier'+i+'Min').value)||0,
        max: parseInt(document.getElementById('tier'+i+'Max').value)||100,
        rate: parseFloat(document.getElementById('tier'+i+'Rate').value)||0
      });
    }
  }

  const idx = roles.findIndex(r=>r.id===id);
  if(idx>=0) roles[idx] = newRole; else roles.push(newRole);
  STORAGE.set('empRoles', roles);
  closeModal(); alert(t('comm_ruleSaved'));
  renderCommRules();
}

function deleteRule(roleId) {
  if(!confirm(t('confirm_delete'))) return;
  let roles = getAllRoles();
  roles = roles.filter(r=>r.id!==roleId);
  STORAGE.set('empRoles', roles);
  closeModal(); alert(t('comm_ruleDeleted'));
  renderCommRules();
}

function renderCompanyDue() {
  const sales = STORAGE.get('sales',[]);
  const employees = STORAGE.get('employees',[]);
  const container = document.getElementById('commTab_companyDue');

  // Expiry alerts
  const expiring = sales.filter(s => {
    if(s.bookingType!=='contract'||!s.date) return false;
    const expiry = addDays(s.date, s.payoutDays||30);
    const daysLeft = daysBetween(today(), expiry);
    return daysLeft >= 0 && daysLeft <= 2;
  });
  let alertHtml = '';
  expiring.forEach(s => {
    const expiry = addDays(s.date, s.payoutDays||30);
    alertHtml += `<div class="alert alert-warning"><i class="fas fa-exclamation-triangle"></i> ${t('comm_expiringSoon')}: <b>${s.code}</b> - ${s.client} (${fmtDate(expiry)})</div>`;
  });

  const contracts = sales.filter(s=>s.bookingType==='contract').map(s => {
    const expiry = addDays(s.date, s.payoutDays||30);
    const daysLeft = daysBetween(today(), expiry);
    const companyComm = (s.unitPrice||0)*(s.commissionRate||0)/100;
    const isFull = s.commissionRate >= 3.5;
    const resaleTeam = s.saleType==='resale' ? getResaleTeam() : [];
    const resaleTotal = resaleTeam.reduce((sum,r)=> sum + companyComm * r.pct / 100, 0);
    return {...s, expiry, daysLeft, companyComm, isFull, resaleTotal};
  }).sort((a,b)=>new Date(a.expiry)-new Date(b.expiry));

  if(contracts.length===0) { container.innerHTML=alertHtml+'<div class="card"><div class="empty-state"><p>'+t('noData')+'</p></div></div>'; return; }

  let h = alertHtml + '<div class="card"><div class="table-wrap"><table><thead><tr><th>'+t('comm_saleCode')+'</th><th>'+t('comm_dueDate')+'</th><th>'+t('comm_client')+'</th><th>'+t('comm_unitType')+'</th><th>'+t('sale_price')+'</th><th>'+t('sale_commissionRate')+'</th><th>'+t('comm_companyAmount')+'</th><th>'+t('comm_resaleTeam')+'</th><th>'+t('comm_daysLeft')+'</th><th>'+t('sale_commissionCondition')+'</th></tr></thead><tbody>';
  contracts.forEach(s => {
    const daysClass = s.daysLeft<=0?'badge-red':(s.daysLeft<=2?'badge-yellow':'badge-green');
    const resaleBadge = s.saleType==='resale' ? `<span style="color:#B76E79;font-weight:700">${fmt(s.resaleTotal)}</span>` : '-';
    h+=`<tr>
      <td><strong>${s.code}</strong></td><td>${fmtDate(s.expiry)}</td><td>${s.client}</td><td>${s.unitType}</td>
      <td>${fmt(s.unitPrice)}</td><td>${s.commissionRate}%</td><td>${fmt(s.companyComm)}</td>
      <td>${resaleBadge}</td>
      <td><span class="badge ${daysClass}">${s.daysLeft<=0?'متأخر':s.daysLeft+' يوم'}</span></td>
      <td><span class="badge ${s.isFull?'badge-green':'badge-red'}">${s.isFull?t('sale_fullPayout'):t('sale_halfPayout')}</span></td>
    </tr>`;
  });
  h+='</tbody></table></div></div>';
  container.innerHTML=h;
}

function renderEmpPayouts() {
  const sales = STORAGE.get('sales',[]);
  const employees = STORAGE.get('employees',[]);
  const container = document.getElementById('commTab_empPayout');

  const contracts = sales.filter(s=>s.bookingType==='contract');
  const millions = (price) => price / 1000000;
  const isHalf = (s) => s.commissionRate <= 3.0 && s.commissionRate < 3.5;
  const multiplier = (s) => isHalf(s) ? 0.5 : 1.0;

  // Calculate per-employee commissions
  const empCommissions = {};
  contracts.forEach(s => {
    const addComm = (empId, role, amount) => {
      if(!empId) return;
      if(!empCommissions[empId]) empCommissions[empId]={total:0,details:[]};
      empCommissions[empId].total += amount;
      empCommissions[empId].details.push({saleCode:s.code,role,amount});
    };

    // Sales roles
    ['salesPersonId','teamLeaderId','salesManagerId','headOfSalesId'].forEach(field => {
      const empId = s[field];
      const emp = employees.find(e=>e.id===empId);
      if(!emp) return;
      const cfg = getRoleConfig(emp.role);
      if(!cfg||cfg.type!=='sales_tier') return;

      let target = cfg.defaultTarget;
      if(['team_leader','sales_manager','sales_director'].includes(emp.role)) {
        const teamEmps = employees.filter(e=>e.supervisor===emp.id||e.teamLeaderId===emp.id||e.salesManagerId===emp.id);
        target = teamEmps.reduce((sum,e)=>sum+(e.target||cfg.defaultTarget),0) || cfg.defaultTarget;
      }
      if(target<=0) return;

      const monthSales = contracts.filter(x=>x.date&&x.date.slice(0,7)===s.date.slice(0,7));
      const totalSold = monthSales.reduce((sum,x)=>sum+(x.unitPrice||0),0);
      const ach = Math.min(100, (totalSold/target)*100 * multiplier(s));
      let tierRate = cfg.tiers[0].rate;
      if(ach>50) tierRate = cfg.tiers[1].rate;
      if(ach>80) tierRate = cfg.tiers[2].rate;
      const amt = tierRate * millions(s.unitPrice) * multiplier(s);
      addComm(empId, emp.role, amt);
    });

    // Fixed per-contract roles
    employees.filter(e=>['hr_manager','hr_agent','accountant','collector','office_boy','operation_director','operation'].includes(e.role)).forEach(emp => {
      const cfg = getRoleConfig(emp.role);
      if(cfg && cfg.rate > 0) addComm(emp.id, emp.role, cfg.rate);
    });

    // Per-million roles
    employees.filter(e=>['ceo','marketing_director','marketing_assistant'].includes(e.role)).forEach(emp => {
      const cfg = getRoleConfig(emp.role);
      if(cfg && cfg.rate > 0) addComm(emp.id, emp.role, cfg.rate * millions(s.unitPrice));
    });

    // Resale team: % of company commission on resale sales only
    if(s.saleType === 'resale') {
      const resaleTeam = getResaleTeam();
      const companyComm = (s.unitPrice||0) * (s.commissionRate||0) / 100;
      resaleTeam.forEach(rule => {
        const empId = s[rule.saleField];
        if(!empId || rule.pct <= 0) return;
        const amt = companyComm * rule.pct / 100;
        addComm(empId, rule.roleId, amt);
      });
    }
  });

  // Determine payout date (1st or 15th)
  const payoutDay = 15;
  const nextPayout = (() => {
    const now = new Date();
    const d15 = new Date(now.getFullYear(), now.getMonth(), 15);
    const d1 = new Date(now.getFullYear(), now.getMonth()+1, 1);
    return now.getDate() <= 15 ? d15.toISOString().slice(0,10) : d1.toISOString().slice(0,10);
  })();

  if(Object.keys(empCommissions).length===0) { container.innerHTML='<div class="card"><div class="empty-state"><p>'+t('noData')+'</p></div></div>'; return; }

  let h = `<div class="card"><h3>${t('comm_payoutSchedule')}: <span class="badge badge-blue">${t('comm_payoutDay')} ${payoutDay} / 1</span> | ${t('sale_expiry')}: <b>${fmtDate(nextPayout)}</b></h3>`;
  h+='<div class="table-wrap"><table><thead><tr><th>'+t('comm_empName')+'</th><th>'+t('comm_empRole')+'</th><th>'+t('comm_amount')+'</th><th>'+t('sale_commissionCondition')+'</th></tr></thead><tbody>';
  Object.keys(empCommissions).sort((a,b)=>empCommissions[b].total-empCommissions[a].total).forEach(empId => {
    const emp = employees.find(e=>e.id===empId);
    if(!emp) return;
    const data = empCommissions[empId];
    h+=`<tr><td><strong>${emp.name}</strong></td><td>${getRoleLabel(emp.role)}</td><td><strong>${fmt(data.total)}</strong></td><td><span class="badge badge-green">${t('comm_pending')}</span></td></tr>`;
  });
  h+='</tbody></table></div></div>';
  container.innerHTML=h;
}

const ACC_COLUMNS = {
  treasury: { label:'الخزينة', headers:['التاريخ','النوع','المبلغ','الوصف'], keys:['date','type','amount','desc'], storage:'treasury' },
  salaries: { label:'الرواتب', headers:['اسم الموظف','المبلغ','التاريخ','ملاحظات'], keys:['empName','amount','date','notes'], storage:'salaries' },
  partners: { label:'الشركاء', headers:['اسم الشريك','المبلغ','التاريخ','ملاحظات'], keys:['name','amount','date','notes'], storage:'partners' },
  expenses: { label:'المصروفات', headers:['الفئة','المبلغ','التاريخ','الوصف'], keys:['category','amount','date','desc'], storage:'expenses' }
};

function downloadAccExcel(section) {
  const cfg = ACC_COLUMNS[section];
  if(!cfg) return;
  const data = STORAGE.get(cfg.storage, []);
  const employees = STORAGE.get('employees',[]);

  const rows = data.map(item => {
    return cfg.keys.map(k => {
      if(k === 'empName') {
        const emp = employees.find(e => e.id === item.empId);
        return emp ? emp.name : '-';
      }
      return item[k] !== undefined ? item[k] : '';
    });
  });

  const totalAmount = data.reduce((s,x) => s + (x.amount||0), 0);
  rows.push([]);
  rows.push(['','','الإجمالي', totalAmount]);

  const ws = XLSX.utils.aoa_to_sheet([cfg.headers, ...rows]);
  ws['!cols'] = cfg.headers.map(() => ({wch: 18}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, cfg.label);
  XLSX.writeFile(wb, 'marts_' + section + '_' + today() + '.xlsx');
}

function uploadAccExcel(section) {
  const cfg = ACC_COLUMNS[section];
  if(!cfg) return;
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.xlsx,.xls,.csv';
  input.onchange = function(e) {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        const wb = XLSX.read(ev.target.result, {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(ws, {header:1});
        if(json.length < 2) { alert(t('acc_importError')); return; }

        const employees = STORAGE.get('employees',[]);
        const existing = STORAGE.get(cfg.storage, []);
        let imported = 0;

        for(let i = 1; i < json.length; i++) {
          const row = json[i];
          if(!row || row.length === 0 || (row.length <= 1 && !row[0])) continue;

          const item = {id: uid()};
          cfg.keys.forEach((key, idx) => {
            const val = row[idx];
            if(key === 'empName') {
              const emp = employees.find(e => e.name === val || e.name?.trim() === String(val).trim());
              item.empId = emp ? emp.id : (employees.length > 0 ? employees[0].id : '');
            } else if(key === 'amount') {
              item[key] = parseFloat(val) || 0;
            } else {
              item[key] = val !== undefined ? String(val).trim() : '';
            }
          });

          if(item[cfg.keys[0]] || item.amount) {
            existing.push(item);
            imported++;
          }
        }

        STORAGE.set(cfg.storage, existing);
        alert(t('acc_importSuccess') + ': ' + imported);
        if(section === 'treasury') renderTreasury();
        else if(section === 'salaries') renderSalaries();
        else if(section === 'partners') renderPartners();
        else if(section === 'expenses') renderExpenses();
      } catch(err) {
        alert(t('acc_importError') + ': ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  };
  input.click();
}

function downloadAllAccExcel() {
  const wb = XLSX.utils.book_new();
  const employees = STORAGE.get('employees',[]);

  Object.keys(ACC_COLUMNS).forEach(section => {
    const cfg = ACC_COLUMNS[section];
    const data = STORAGE.get(cfg.storage, []);
    const rows = data.map(item => {
      return cfg.keys.map(k => {
        if(k === 'empName') { const emp = employees.find(e=>e.id===item.empId); return emp?emp.name:'-'; }
        return item[k] !== undefined ? item[k] : '';
      });
    });
    const totalAmount = data.reduce((s,x) => s+(x.amount||0), 0);
    rows.push([]);
    rows.push(['','','الإجمالي', totalAmount]);
    const ws = XLSX.utils.aoa_to_sheet([cfg.headers, ...rows]);
    ws['!cols'] = cfg.headers.map(()=>({wch:18}));
    XLSX.utils.book_append_sheet(wb, ws, cfg.label);
  });

  // Summary sheet
  const treasury = STORAGE.get('treasury',[]);
  const salaries = STORAGE.get('salaries',[]);
  const partners = STORAGE.get('partners',[]);
  const expenses = STORAGE.get('expenses',[]);
  const tBalance = treasury.reduce((s,e)=>s+(e.type==='income'?e.amount:-e.amount),0);
  const tSalaries = salaries.reduce((s,x)=>s+(x.amount||0),0);
  const tPartners = partners.reduce((s,x)=>s+(x.amount||0),0);
  const tExpenses = expenses.reduce((s,x)=>s+(x.amount||0),0);
  const summary = [
    ['الملخص', 'المبلغ'],
    ['رصيد الخزينة', tBalance],
    ['إجمالي الرواتب', tSalaries],
    ['إجمالي الشركاء', tPartners],
    ['إجمالي المصروفات', tExpenses],
    [],
    ['الخزينة - الصافي', tBalance - tSalaries - tPartners - tExpenses]
  ];
  const wsS = XLSX.utils.aoa_to_sheet(summary);
  wsS['!cols'] = [{wch:20},{wch:15}];
  XLSX.utils.book_append_sheet(wb, wsS, 'الملخص');

  XLSX.writeFile(wb, 'marts_all_accounts_' + today() + '.xlsx');
}

function generateReport() {
  let sales = STORAGE.get('sales',[]);
  const person = document.getElementById('rptPerson').value;
  const from = document.getElementById('rptFrom').value;
  const to = document.getElementById('rptTo').value;
  if(person) sales = sales.filter(s=>s.salesPersonId===person||s.teamLeaderId===person||s.salesManagerId===person);
  if(from) sales = sales.filter(s=>s.date>=from);
  if(to) sales = sales.filter(s=>s.date<=to);

  window._rptData = sales;
  document.getElementById('rptActions').style.display = sales.length > 0 ? 'flex' : 'none';

  const total = sales.reduce((s,x)=>s+(x.unitPrice||0),0);
  const totalComm = sales.reduce((s,x)=>s+(x.unitPrice||0)*(x.commissionRate||0)/100,0);
  const employees = STORAGE.get('employees',[]);
  const getEmpName = (id) => { const e=employees.find(x=>x.id===id); return e?e.name:'-'; };

  let h = `<div class="stats-grid">
    <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-dollar-sign"></i></div><div class="stat-info"><h4>${fmt(total)}</h4><p>${t('dash_totalSales')} (${sales.length})</p></div></div>
    <div class="stat-card"><div class="stat-icon green"><i class="fas fa-percent"></i></div><div class="stat-info"><h4>${fmt(totalComm)}</h4><p>${t('dash_totalCommission')}</p></div></div>
    <div class="stat-card"><div class="stat-icon yellow"><i class="fas fa-file-invoice-dollar"></i></div><div class="stat-info"><h4>${sales.length}</h4><p>${t('nav_sales')}</p></div></div>
    <div class="stat-card"><div class="stat-icon red"><i class="fas fa-chart-line"></i></div><div class="stat-info"><h4>${sales.length>0?fmt(total/sales.length):fmt(0)}</h4><p>${lang==='ar'?'متوسط سعر البيع':'Avg Sale Price'}</p></div></div>
  </div>`;

  if(sales.length > 0) {
    // Charts row
    h += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px">
      <div class="card"><h3>${t('report_monthlySales')}</h3><div style="position:relative;height:280px"><canvas id="chartMonthly"></canvas></div></div>
      <div class="card"><h3>${t('report_byProject')}</h3><div style="position:relative;height:280px"><canvas id="chartProject"></canvas></div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px">
      <div class="card"><h3>${t('report_byUnitType')}</h3><div style="position:relative;height:280px"><canvas id="chartUnitType"></canvas></div></div>
      <div class="card"><h3>${t('report_bySalesPerson')}</h3><div style="position:relative;height:280px"><canvas id="chartPerson"></canvas></div></div>
    </div>`;

    // Table
    h += '<div class="card" id="rptTableCard"><div class="table-wrap"><table><thead><tr><th>'+t('sale_code')+'</th><th>'+t('sale_date')+'</th><th>'+t('sale_client')+'</th><th>'+t('sale_project')+'</th><th>'+t('sale_unitType')+'</th><th>'+t('sale_price')+'</th><th>'+t('sale_commissionRate')+'</th><th>'+t('sale_commissionAmount')+'</th><th>'+t('sale_salesPerson')+'</th></tr></thead><tbody>';
    sales.forEach(s=>{h+=`<tr><td>${s.code}</td><td>${fmtDate(s.date)}</td><td>${s.client}</td><td>${s.project}</td><td>${s.unitType}</td><td>${fmt(s.unitPrice)}</td><td>${s.commissionRate}%</td><td>${fmt((s.unitPrice||0)*(s.commissionRate||0)/100)}</td><td>${getEmpName(s.salesPersonId)}</td></tr>`;});
    h+='</tbody></table></div></div>';
  } else {
    h += '<div class="card"><div class="empty-state"><i class="fas fa-chart-bar"></i><p>'+t('noData')+'</p></div></div>';
  }
  document.getElementById('rptResults').innerHTML=h;

  if(sales.length > 0) setTimeout(()=>renderRptCharts(sales), 100);
}

function renderRptCharts(sales) {
  const chartColors = ['#C4A882','#4CAF50','#BCA587','#D94F4F','#A77BCA','#EC407A','#26C6DA','#8BC34A','#FF7043','#7E57C2'];

  // 1. Monthly Sales
  const monthMap = {};
  sales.forEach(s => {
    const m = s.date ? s.date.slice(0,7) : 'Unknown';
    monthMap[m] = (monthMap[m]||0) + (s.unitPrice||0);
  });
  const monthLabels = Object.keys(monthMap).sort();
  const monthData = monthLabels.map(m=>monthMap[m]);
  new Chart(document.getElementById('chartMonthly'), {
    type:'bar',
    data:{labels:monthLabels.map(m=>{const [y,mo]=m.split('-');return mo+'/'+y.slice(2);}),datasets:[{label:t('sale_price'),data:monthData,backgroundColor:chartColors.map(c=>c+'cc'),borderColor:chartColors,borderWidth:2,borderRadius:8}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{callback:v=>fmt(v),color:'#666'},grid:{color:'rgba(196,168,130,.1)'}},x:{grid:{display:false},ticks:{color:'#666'}}}}
  });

  // 2. By Project
  const projMap = {};
  sales.forEach(s => { const p=s.project||'Other'; projMap[p]=(projMap[p]||0)+(s.unitPrice||0); });
  const projLabels = Object.keys(projMap);
  const projData = projLabels.map(p=>projMap[p]);
  new Chart(document.getElementById('chartProject'), {
    type:'doughnut',
    data:{labels:projLabels,datasets:[{data:projData,backgroundColor:chartColors.slice(0,projLabels.length),borderWidth:3,borderColor:'#1A1A1A'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{padding:12,font:{size:12},color:'#E8DCC8'}}}}
  });

  // 3. By Unit Type
  const unitMap = {};
  sales.forEach(s => { const u=s.unitType||'Other'; unitMap[u]=(unitMap[u]||0)+(s.unitPrice||0); });
  const unitLabels = Object.keys(unitMap);
  const unitData = unitLabels.map(u=>unitMap[u]);
  new Chart(document.getElementById('chartUnitType'), {
    type:'pie',
    data:{labels:unitLabels,datasets:[{data:unitData,backgroundColor:chartColors.slice(0,unitLabels.length).map(c=>c+'dd'),borderWidth:2,borderColor:'#1A1A1A'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{padding:12,font:{size:12},color:'#E8DCC8'}}}}
  });

  // 4. By Sales Person
  const employees = STORAGE.get('employees',[]);
  const empMap = {};
  sales.forEach(s => {
    const e = employees.find(x=>x.id===s.salesPersonId);
    const name = e ? e.name : '-';
    empMap[name] = (empMap[name]||0) + (s.unitPrice||0);
  });
  const empLabels = Object.keys(empMap);
  const empData = empLabels.map(e=>empMap[e]);
  new Chart(document.getElementById('chartPerson'), {
    type:'bar',
    data:{labels:empLabels,datasets:[{label:t('sale_price'),data:empData,backgroundColor:chartColors.slice(0,empLabels.length).map(c=>c+'bb'),borderColor:chartColors.slice(0,empLabels.length),borderWidth:2,borderRadius:8}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{callback:v=>fmt(v),color:'#666'},grid:{color:'rgba(196,168,130,.1)'}},y:{grid:{display:false},ticks:{color:'#666'}}}}
  });
}

  const employees = STORAGE.get('employees',[]);

  const matchedEmps = employees.filter(e=>
    (e.name||'').toLowerCase().includes(q)||
    (e.nationalId||'').includes(q)||
    (e.personalPhone||'').includes(q)||
    (e.workPhone||'').includes(q)

  const matchedSales = sales.filter(s=>

    (s.code||'').toLowerCase().includes(q)||
    (s.clientPhone||'').includes(q)||
    (s.project||'').toLowerCase().includes(q)

function getCrmClients(){ return STORAGE.get('crm_clients',[]); }
function saveCrmClients(c){ STORAGE.set('crm_clients',c); }
function getCrmActivities(){ return STORAGE.get('crm_activities',[]); }
function saveCrmActivities(a){ STORAGE.set('crm_activities',a); }

function generateTrialEmail(name){
  const slug = name.toLowerCase().replace(/[^a-z0-9\u0600-\u06FF]+/g,'').substring(0,12);
  const rand = Math.floor(1000+Math.random()*9000);
  return slug+rand+'@marts-eg.com';
}
function generateTrialPassword(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789@#$';
  let p='';for(let i=0;i<12;i++) p+=chars.charAt(Math.floor(Math.random()*chars.length));
  return p;
}
function addCrmActivity(clientId,type,desc){
  const acts=getCrmActivities();
  acts.push({id:'ca_'+Date.now(),clientId,type,desc,date:new Date().toISOString(),by:currentUser?currentUser.username:'system'});
  saveCrmActivities(acts);
}
function getCrmStatusLabel(s){ return t('crm_status_'+s); }
function getCrmSourceLabel(s){
  const map={facebook:'crm_sourceFacebook',instagram:'crm_sourceInstagram',referral:'crm_sourceReferral',walkin:'crm_sourceWalkIn',website:'crm_sourceWebsite',ad:'crm_sourceAd',other:'crm_sourceOther',meta:'crm_sourceMeta',google:'crm_sourceGoogle',x:'crm_sourceX',linkedin:'crm_sourceLinkedin',snapchat:'crm_sourceSnapchat',tiktok:'crm_sourceTiktok'};
  return t(map[s]||'crm_sourceOther');
}
function getCrmStatusClass(s){ return 'crm-status-'+s; }
function getCrmStageLabel(s){ return t('crm_stage_'+s); }
function getCrmStageClass(s){ return 'crm-stage-'+s; }
function changeCrmStage(clientId,newStage){
  const clients=getCrmClients();
  const c=clients.find(x=>x.id===clientId);
  if(c){
    const oldStage=c.stage||'fresh_leads';
    c.stage=newStage;
    c.lastContact=new Date().toISOString();
    saveCrmClients(clients);
    addCrmActivity(clientId,'status_changed',t('crm_stage_'+oldStage)+' → '+t('crm_stage_'+newStage));
  }
  openCrmClientDetail(clientId);
  renderCrmStats();
}

function switchCrmView(view, stageKey){
  document.querySelectorAll('.crm-nav-item').forEach(n => n.classList.remove('active'));
  if(view !== 'stage'){
    const navItem = Array.from(document.querySelectorAll('.crm-nav-item')).find(n => n.textContent.trim().toLowerCase().includes(view));
    if(navItem) navItem.classList.add('active');
  } else {
    const navItem = Array.from(document.querySelectorAll('.crm-nav-item')).find(n => n.textContent.trim().toLowerCase().includes('dashboard'));
    if(navItem) navItem.classList.add('active');
  }
  const content = document.getElementById('crmViewContent');
  if(view === 'dashboard') renderCrmDashboardView(content);
  else if(view === 'workspace') renderCrmWorkspaceView(content);
  else if(view === 'deals') renderCrmDealsView(content);
  else if(view === 'marketing') renderCrmMarketingView(content);
  else if(view === 'inventory') renderCrmInventoryView(content);
  else if(view === 'reports') renderCrmReportsView(content);
  else if(view === 'stage' && stageKey) renderCrmStageView(content, stageKey);
  else if(view === 'clientMgmt') renderCrmClientManagement(content);
  else content.innerHTML = `<div class="empty-state" style="padding:80px 20px"><i class="fas fa-tools" style="font-size:48px;color:var(--crm-text-muted)"></i><p style="margin-top:16px;color:var(--crm-text-muted)">${lang==='ar'?'قريباً':'Coming soon'}</p></div>`;
}

function updateCrmDateTime(){
  const el = document.getElementById('crmDateTime');
  if(el){
    const now = new Date();
    el.textContent = now.toLocaleDateString(lang==='ar'?'ar-EG':'en-US', {weekday:'long',year:'numeric',month:'long',day:'numeric'}) 
      + ' • ' + now.toLocaleTimeString(lang==='ar'?'ar-EG':'en-US', {hour:'2-digit',minute:'2-digit'});
  }
}

function getTopAgents(limit){
  const users = getAllUsers().filter(u => ['sales','tl','sm','marketer','ma','md'].includes(u.role));
  return users
    .map(u => ({
      ...u,
      score: Math.floor(Math.random() * 500) + 100 // simulated score
    }))
    .sort((a,b) => b.score - a.score)
    .slice(0, limit);
}

function getActivityIcon(type){
  const icons = {call:'fa-phone',meeting:'fa-handshake',email:'fa-envelope',note:'fa-sticky-note',created:'fa-user-plus',updated:'fa-pen',status_changed:'fa-arrow-right'};
  return icons[type] || 'fa-circle';
}

function showCrmTab(tabName, btn){
  document.querySelectorAll('.crm-tab-btn').forEach(b => {
    b.classList.remove('active');
    b.setAttribute('aria-selected','false');
  });
  btn.classList.add('active');
  btn.setAttribute('aria-selected','true');
  document.querySelectorAll('.crm-tab-pane').forEach(p => p.style.display = 'none');
  document.getElementById('crmTab'+tabName.charAt(0).toUpperCase()+tabName.slice(1)).style.display = 'block';
}

function filterCrmDashboard(){
  const leadFilter = (document.getElementById('crmFilterLeads')?.value || '').trim();
  const teamFilter = (document.getElementById('crmFilterTeam')?.value || '').trim();
  const agentFilter = (document.getElementById('crmFilterAgent')?.value || '').trim();
  const clients = getVisibleClients().filter(c => {
    if(leadFilter && (c.stage || 'fresh_leads') !== leadFilter) return false;
    if(agentFilter && c.assignedUser !== agentFilter) return false;
    if(teamFilter){
      const u = c.assignedUser ? getUserByUsername(c.assignedUser) : null;
      if(!u) return false;
      if(teamFilter === 'sales' && !['sales','tl','sm'].includes(u.role)) return false;
      if(teamFilter === 'marketing' && !['marketer','ma','md'].includes(u.role)) return false;
    }
    return true;
  });
  const stages = CRM_STAGES;
  const stageColors=['#C4A882','#BCA587','#F59E0B','#10B981','#3B82F6','#8B5CF6','#EC4899','#06B6D4','#F97316','#6366F1','#84CC16','#EF4444','#14B8A6','#22D3EE','#A855F7','#F43F5E','#64748B','#78716C','#FB923C','#38BDF8','#E11D48','#4ADE80','#FBBF24'];
  const stageStats = stages.map((s, idx) => ({
    stage: s,
    count: clients.filter(c => (c.stage || 'fresh_leads') === s).length,
    color: stageColors[idx % stageColors.length],
    change: Math.floor(Math.random() * 15) - 5
  }));
  const statsGrid = document.querySelector('.crm-stats-grid');
  if(statsGrid){
    statsGrid.innerHTML = stageStats.map(stat => {
      const changeClass = stat.change > 0 ? 'positive' : stat.change < 0 ? 'negative' : 'neutral';
      const changeSign = stat.change > 0 ? '+' : '';
      return `<div class="crm-stat-card clickable" onclick="switchCrmView('stage','${stat.stage}')" style="border-left:3px solid ${stat.color};cursor:pointer"><div class="stat-value">${stat.count}<span class="stat-change ${changeClass}">${changeSign}${stat.change}%</span></div><div class="stat-label">${t('crm_stage_'+stat.stage)}</div></div>`;
    }).join('');
  }
  const filterLabel = document.querySelector('.crm-filter-label .count');
  if(filterLabel) filterLabel.textContent = clients.length;
  const activities = getCrmActivities().slice(-8).reverse();
  const actList = document.querySelector('.crm-activity-list');
  if(actList){
    const recentActivities = activities.map(a => ({
      type: a.type, title: a.desc, clientId: a.clientId,
      meta: `${a.by || ''} • ${new Date(a.date).toLocaleDateString('ar-EG')}`,
      time: new Date(a.date).toLocaleTimeString('ar-EG', {hour:'2-digit',minute:'2-digit'})
    }));
    actList.innerHTML = recentActivities.length ? recentActivities.map(a => `<li class="crm-activity-item" onclick="${a.clientId ? `openCrmClientForm('${a.clientId}')` : ''}" style="${a.clientId ? 'cursor:pointer' : ''}"><div class="crm-activity-icon ${a.type}"><i class="fas ${getActivityIcon(a.type)}"></i></div><div class="crm-activity-content"><div class="crm-activity-title">${a.title}</div><div class="crm-activity-meta">${a.meta}</div></div><span class="crm-activity-time">${a.time}</span></li>`).join('') : `<li class="crm-activity-item" style="justify-content:center;padding:24px;color:var(--crm-text-muted)"><i class="fas fa-inbox" style="font-size:24px;margin-left:8px"></i> ${lang==='ar'?'لا توجد أنشطة حديثة':'No recent activities'}</li>`;
  }
}

function filterStagePage(){
  const search = (document.getElementById('stagePgSearch')?.value || '').toLowerCase();
  const status = document.getElementById('stagePgStatus')?.value || '';
  const agent = document.getElementById('stagePgAgent')?.value || '';
  document.querySelectorAll('#stagePgList .stage-client-row').forEach(row => {
    const name = row.dataset.name || '';
    const phone = row.dataset.phone || '';
    const st = row.dataset.status || '';
    const ag = row.dataset.agent || '';
    const matchSearch = !search || name.includes(search) || phone.includes(search);
    const matchStatus = !status || st === status;
    const matchAgent = !agent || ag === agent;
    row.style.display = (matchSearch && matchStatus && matchAgent) ? '' : 'none';
  });
}

function confirmTransferClient(clientId, newAgentUsername){
  const clients = getCrmClients();
  const idx = clients.findIndex(c => c.id === clientId);
  if(idx < 0) return;
  const client = clients[idx];
  const oldAgent = client.assignedUser || '';
  const oldAgentUser = oldAgent ? getUserByUsername(oldAgent) : null;
  const newAgentUser = getUserByUsername(newAgentUsername);
  const oldName = oldAgentUser ? (oldAgentUser.fullName || oldAgent) : (lang==='ar'?'غير معيّن':'Unassigned');
  const newName = newAgentUser ? (newAgentUser.fullName || newAgentUsername) : newAgentUsername;

  client.assignedUser = newAgentUsername;
  clients[idx] = client;
  saveCrmClients(clients);

  toast.style.cssText = 'position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#10B981;color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;font-weight:600;z-index:10001;box-shadow:0 4px 20px rgba(16,185,129,.3);animation:fadeInToast .3s';

  setTimeout(() => toast.remove(), 3000);

  if(content) renderCrmStageView(content, client.stage || 'fresh_leads');
}

let cmgDragClientId = null;
function cmgDragStart(e, clientId){
  cmgDragClientId = clientId;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', clientId);
  e.target.style.opacity = '0.5';
  setTimeout(()=>{ if(e.target) e.target.style.opacity = ''; }, 0);
}

function cmgDropClient(e, targetAgent){
  e.preventDefault();
  e.currentTarget.style.background = '';
  const clientId = cmgDragClientId || e.dataTransfer.getData('text/plain');
  if(!clientId) return;
  cmgDragClientId = null;
  const clients = getCrmClients();
  const idx = clients.findIndex(c => c.id === clientId);
  if(idx < 0) return;
  const oldAgent = clients[idx].assignedUser || '';
  if(oldAgent === targetAgent) return;
  clients[idx].assignedUser = targetAgent;
  saveCrmClients(clients);
  const newAgentUser = targetAgent ? getUserByUsername(targetAgent) : null;
  const newName = newAgentUser ? (newAgentUser.fullName||targetAgent) : (lang==='ar'?'غير معيّن':'Unassigned');
  addCrmActivity(clientId, 'updated', (lang==='ar'?'تم التحويل إلى ':'Transferred to ') + newName);
  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#10B981;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:10001;box-shadow:0 4px 20px rgba(16,185,129,.3);animation:fadeInToast .3s';
  toast.innerHTML = `<i class="fas fa-check-circle" style="margin-left:6px"></i>${lang==='ar'?'تم النقل إلى':'Moved to'} ${newName}`;
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(), 2500);
  renderCrmClientManagement(document.getElementById('crmViewContent'));
}

function cmgChangeStage(clientId, newStage){
  const clients = getCrmClients();
  const idx = clients.findIndex(c => c.id === clientId);
  if(idx < 0) return;
  const oldStage = clients[idx].stage || 'fresh_leads';
  clients[idx].stage = newStage;
  saveCrmClients(clients);
  addCrmActivity(clientId, 'updated', (lang==='ar'?'تم تغيير المرحلة من ':'Stage changed from ') + t('crm_stage_'+oldStage) + (lang==='ar'?' إلى ':' to ') + t('crm_stage_'+newStage));
  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;top:24px;left:50%;transform:translateX(-50%);background:var(--crm-info);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:10001;box-shadow:0 4px 20px rgba(59,130,246,.3);animation:fadeInToast .3s';
  toast.innerHTML = `<i class="fas fa-check-circle" style="margin-left:6px"></i>${t('crm_stage_'+newStage)}`;
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(), 2500);
}

function cmgFilterByStatus(status){
  document.querySelectorAll('.cmg-status-chip').forEach(c=>c.classList.remove('active'));
  event.target.classList.add('active');
  document.querySelectorAll('.cmg-client-card').forEach(card=>{
    const clientId = card.dataset.clientId;
    const clients = getCrmClients();
    const c = clients.find(x=>x.id===clientId);
    if(!c) return;
    const match = !status || c.status === status;
    card.style.display = match ? '' : 'none';
  });
}

function filterCmgBoard(){
  const search = (document.getElementById('cmgSearchInput')?.value||'').toLowerCase();
  const agent = document.getElementById('cmgSearchAgent')?.value||'';
  document.querySelectorAll('.cmg-client-card').forEach(card=>{
    const clientId = card.dataset.clientId;
    const clients = getCrmClients();
    const c = clients.find(x=>x.id===clientId);
    if(!c) return;
    const matchSearch = !search || (c.name||'').toLowerCase().includes(search) || (c.phone||'').includes(search);
    const matchAgent = !agent || c.assignedUser === agent;
    card.style.display = (matchSearch && matchAgent) ? '' : 'none';
  });
}

function wsChipFilter(el, filter){
  el.parentElement.querySelectorAll('.ws-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');

  const labels = {late:lg?'متأخر':'Late', today:lg?'اليوم':'Today', tomorrow:lg?'غداً':'Tomorrow', upcoming:lg?'القادمة':'Upcoming'};
  wsToast(labels[filter] || filter);
}

function wsToggleFilters(){

function wsExport(type){
  const rows = document.querySelectorAll('.ws-row');
  if(!rows.length){
    wsToast(lang==='ar'?'لا توجد بيانات':'No data');
    return;
  }
  let csv = '\uFEFF' + (lang==='ar'?'الاسم,المرحلة,الميزانية,المشروع':'Name,Stage,Budget,Project') + '\n';
  rows.forEach(r => {
    const name = r.querySelector('.ws-row-name')?.textContent || '';
    const stage = r.querySelector('.ws-pill')?.textContent?.trim() || '';
    const budget = r.querySelector('.ws-row-desc')?.textContent || '';
    csv += `"${name}","${stage}","${budget}",""\n`;
  });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'workspace_' + type + '_' + new Date().toISOString().split('T')[0] + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  wsToast((lang==='ar'?'تم التصدير: ':'Exported: ') + type);
}

function wsSelectAll(select){
  document.querySelectorAll('.ws-row-checkbox input').forEach(cb => cb.checked = select);
}

function wsSearchRows(query){
  const q = query.toLowerCase();
  document.querySelectorAll('.ws-row').forEach(row => {
    const text = row.textContent.toLowerCase();
    row.style.display = text.includes(q) ? '' : 'none';
  });
}

}

function wsCallClient(id){
  const clients = getCrmClients();
  const c = clients.find(x=>x.id===id);
  if(c && c.phone){
    wsToast((lang==='ar'?'الاتصال بـ ':'Calling ') + c.name);
  } else {
    wsToast(lang==='ar'?'لا يوجد رقم':'No phone number');
  }
}

function wsRejectClient(id){
  const clients = getCrmClients();
  const idx = clients.findIndex(x=>x.id===id);
  if(idx >= 0){
    clients[idx].status = 'cancelled';
    saveCrmClients(clients);
    addCrmActivity(id, 'status_changed', lang==='ar'?'تم رفض العميل من Workspace':'Client rejected from Workspace');
    wsToast(lang==='ar'?'تم رفض العميل':'Client rejected');
    renderCrmWorkspaceView(document.getElementById('crmViewContent'));
  }
}

function wsWhatsAppClient(phone){
  if(phone){
    wsToast('WhatsApp: ' + phone);
  } else {
    wsToast(lang==='ar'?'لا يوجد رقم':'No phone number');
  }
}

function wsToast(msg){
  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;top:24px;left:50%;transform:translateX(-50%);background:var(--crm-primary);color:#000;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:10001;box-shadow:0 4px 20px rgba(196,168,130,.3);animation:fadeInToast .3s';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(), 2500);
}

  const rate=total>0?Math.round(converted/total*100):0;
  const pipelineVal=clients.filter(c=>CRM_PIPELINE_STATUSES.includes(c.status)).reduce((s,c)=>s+(parseFloat(c.budget)||0),0);
  const hotCases=clients.filter(c=>(c.stage||'')==='hot_cases').length;
  const doneDeals=clients.filter(c=>(c.stage||'')==='done_deal').length;
  const scheduled=clients.filter(c=>(c.stage||'')==='scheduled_meeting'||(c.stage||'')==='rotation_scheduled').length;
  document.getElementById('crmStats').innerHTML=`
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-users"></i></div><div class="stat-info"><h4>${total}</h4><p>${t('crm_totalClients')}</p></div></div>

      <div class="stat-card"><div class="stat-icon purple"><i class="fas fa-chart-line"></i></div><div class="stat-info"><h4>${rate}%</h4><p>${t('crm_conversionRate')}</p></div></div>
      <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-coins"></i></div><div class="stat-info"><h4>${fmt(pipelineVal)}</h4><p>${t('crm_pipelineValue')}</p></div></div>

  const c=document.getElementById('crmContent');

  <div class="card" style="margin-bottom:18px;padding:18px 20px">
    <div class="emp-filters">
      <div class="emp-filter-group emp-filter-search">
        <i class="fas fa-search" style="color:var(--text-light);position:absolute;left:12px;top:50%;transform:translateY(-50%)"></i>
