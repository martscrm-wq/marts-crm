<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><title>Generate Marts PWA Icons</title>
<style>body{font-family:sans-serif;text-align:center;padding:40px;background:#E9EBE7}canvas{border:1px solid #ccc;margin:10px}button{padding:12px 24px;background:#827148;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;margin:10px}</style>
</head>
<body>
<h2>Generate PWA Icons</h2>
<p>Click the button to download icon-192.png and icon-512.png</p>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<br>
<button onclick="download('c192','icon-192.png')">Download icon-192.png</button>
<button onclick="download('c512','icon-512.png')">Download icon-512.png</button>
<script>
function drawIcon(canvasId, size) {
  const c = document.getElementById(canvasId);
  const ctx = c.getContext('2d');
  const r = size * 0.18;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = '#827148';
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + (size * 0.4) + 'px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('M', size/2, size*0.48);
  ctx.font = 'bold ' + (size * 0.1) + 'px Arial';
  ctx.fillStyle = 'rgba(255,255,255,.7)';
  ctx.letterSpacing = '4px';
  ctx.fillText('MARTS', size/2, size*0.75);
}
drawIcon('c192', 192);
drawIcon('c512', 512);
function download(id, name) {
  const a = document.createElement('a');
  a.download = name;
  a.href = document.getElementById(id).toDataURL('image/png');
  a.click();
}
</script>
</body>
</html>
